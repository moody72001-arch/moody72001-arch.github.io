<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050a15">
<title>فريق بني برزه</title>
<style>
:root{--gold:#d4af37;--gold-lt:#f5d76e;--gold-dk:#8a6d1f;--blue:#3b82f6;--blue-lt:#93c5fd;--blue-dk:#1e40af;--blue-mid:#2563eb;--bg:#050a15;--card:#0c1425;--card-2:#131d33;--text:#fff;--dim:#7a8499;--red:#e74c3c;--green:#27ae60}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
input,select,button,textarea{font-family:inherit}

/* AUTH (gold) */
.bg-anim{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 20% 20%,rgba(212,175,55,.18),transparent 45%),radial-gradient(ellipse at 80% 80%,rgba(212,175,55,.12),transparent 45%),linear-gradient(135deg,#000,#0a0805 50%,#000);overflow:hidden}
.ball{position:absolute;font-size:44px;opacity:.07;animation:drift 30s linear infinite}
.ball-1{top:10%;left:15%}.ball-2{top:70%;left:80%;animation-delay:-5s}.ball-3{top:30%;left:70%;animation-delay:-10s}.ball-4{top:80%;left:20%;animation-delay:-15s}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(30px,-40px) rotate(90deg)}50%{transform:translate(-20px,30px) rotate(180deg)}75%{transform:translate(40px,20px) rotate(270deg)}100%{transform:translate(0,0) rotate(360deg)}}
.auth-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.auth-bg-img{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:0;opacity:0;transition:opacity .6s ease}
.auth-bg-img.has-image{opacity:1}
.auth-bg-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.4),rgba(0,0,0,.75));z-index:1;display:none}
.auth-bg-img.has-image ~ .auth-bg-overlay{display:block}
.auth-card{position:relative;z-index:2;width:100%;max-width:400px;background:rgba(15,12,8,.9);backdrop-filter:blur(20px);border:1px solid rgba(212,175,55,.35);border-radius:24px;padding:28px 22px;box-shadow:0 0 100px rgba(212,175,55,.12),0 20px 60px rgba(0,0,0,.8)}
.auth-logo{display:flex;justify-content:center;margin-bottom:8px}
.logo-circle{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 40px rgba(212,175,55,.6)}
.auth-brand{text-align:center;font-size:24px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.auth-sub{text-align:center;font-size:12px;color:var(--dim);margin-bottom:22px}
.field{position:relative;margin-bottom:12px}
.field-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:17px;pointer-events:none;opacity:.8}
.field input{width:100%;padding:15px 46px 15px 14px;background:rgba(0,0,0,.4);border:1px solid rgba(212,175,55,.2);border-radius:12px;color:var(--text);font-size:14px}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
.btn-gold{position:relative;width:100%;padding:15px;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);border:none;border-radius:12px;color:#000;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px}
.auth-switch{text-align:center;font-size:13px;color:var(--dim);margin-top:18px}
.auth-switch a{color:var(--gold);font-weight:700;cursor:pointer}
.pending-icon{text-align:center;font-size:70px;margin:10px 0}
.pending-title{text-align:center;font-size:20px;font-weight:800;color:var(--gold-lt);margin-bottom:10px}
.pending-text{text-align:center;font-size:13px;color:var(--dim);line-height:1.7;margin-bottom:24px}

/* APP (blue) */
.app{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:linear-gradient(180deg,#050912,#050a15 40%,#050912)}
.app.show{display:flex}
.app-header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,#0a1424,#0f1a30);border-bottom:2px solid var(--blue-mid);box-shadow:0 4px 24px rgba(37,99,235,.25)}
.app-logo{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#3b82f6,#1e40af);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;box-shadow:0 0 18px rgba(59,130,246,.5);flex-shrink:0}
.app-logo img{width:100%;height:100%;object-fit:cover}
.app-title{flex:1;font-size:15px;font-weight:900;letter-spacing:1px;background:linear-gradient(135deg,#93c5fd,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);color:var(--blue-lt);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
.tabs-nav{flex-shrink:0;background:#0a1424;border-bottom:1px solid rgba(59,130,246,.18);overflow-x:auto;scrollbar-width:none}
.tabs-nav::-webkit-scrollbar{display:none}
.tabs-scroll{display:flex;gap:6px;padding:10px 12px;min-width:max-content}
.tab-btn{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);color:var(--dim);padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:600;transition:all .2s}
.tab-btn.active{background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff;border-color:var(--blue);box-shadow:0 4px 18px rgba(59,130,246,.5)}
.tabs-container{flex:1;overflow-y:auto;overflow-x:hidden}
.tab-panel{display:none;width:100%;height:100%;overflow-y:auto;padding:16px;padding-bottom:60px}
.tab-panel.active{display:block;animation:panelIn .25s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.section-header{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;color:var(--blue-lt);margin:8px 0 14px;padding-bottom:10px;border-bottom:1px solid rgba(59,130,246,.25)}
.section-header .count{background:rgba(59,130,246,.18);color:var(--blue-lt);padding:2px 10px;border-radius:10px;font-size:12px;font-weight:700}
.empty-state{text-align:center;padding:50px 20px;color:var(--dim);font-size:14px}
.empty-icon{font-size:60px;opacity:.4;margin-bottom:12px}
.btn-purple{position:relative;width:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#1e40af);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px;box-shadow:0 4px 18px rgba(59,130,246,.35)}
.btn-purple:active{transform:scale(.98)}
.btn-purple.btn-sm{padding:8px 12px;font-size:12px;width:auto;margin:4px 4px 4px 0;display:inline-block}
.btn-purple.btn-ghost{background:rgba(59,130,246,.15);color:var(--blue-lt);border:1px solid rgba(59,130,246,.35);box-shadow:none}
.btn-purple.btn-danger{background:rgba(231,76,60,.1);color:var(--red);border:1px solid var(--red);box-shadow:none}

/* Players */
.player-list{display:flex;flex-direction:column;gap:10px}
.player-card{display:flex;align-items:center;gap:8px;padding:12px;background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.2);border-radius:16px}
.player-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#1a2a44,#050a15);border:2px solid var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;box-shadow:0 0 15px rgba(59,130,246,.25)}
.player-avatar img{width:100%;height:100%;object-fit:cover}
.player-info{flex:1;min-width:0;cursor:pointer}
.player-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-pos{font-size:11px;color:var(--blue-lt);margin-top:2px;font-weight:600}
.player-actions{display:flex;gap:3px;flex-shrink:0}
.icon-action{width:32px;height:32px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.28);border-radius:9px;color:var(--blue-lt);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-action:active{transform:scale(.9);background:rgba(59,130,246,.25)}
.icon-action.danger{color:var(--red);border-color:rgba(231,76,60,.4);background:rgba(231,76,60,.08)}
.icon-action.danger:active{background:rgba(231,76,60,.25)}

/* CARDS SUBTABS */
.cards-subtabs{display:flex;gap:6px;margin-bottom:14px;background:rgba(59,130,246,.06);padding:4px;border-radius:14px;border:1px solid rgba(59,130,246,.2)}
.subtabs-btn{flex:1;padding:10px;background:transparent;border:none;color:var(--dim);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.subtabs-btn.active{background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.4)}

/* FIFA CARDS */
.cards-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cards-toolbar button{flex:1;min-width:140px;padding:10px;background:linear-gradient(135deg,#3b82f6,#1e40af);border:none;border-radius:10px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 3px 12px rgba(59,130,246,.3);transition:all .2s}
.cards-toolbar button.active{background:linear-gradient(135deg,#f5d76e,#d4af37);color:#000}
.cards-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fifa-card-wrap{width:100%;perspective:1200px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.fifa-card-3d{position:relative;width:100%;aspect-ratio:2/3;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.9,.3,1);will-change:transform}
@keyframes cardSway{0%,100%{transform:rotateY(-8deg) rotateX(4deg) scale(1)}50%{transform:rotateY(8deg) rotateX(-4deg) scale(1.02)}}
.cards-grid-2.motion .fifa-card-3d{animation:cardSway 3s ease-in-out infinite}
.cards-grid-2.motion .fifa-card-wrap:nth-child(2n) .fifa-card-3d{animation-delay:-1.5s}
.cards-grid-2.motion .fifa-card-wrap:nth-child(3n) .fifa-card-3d{animation-delay:-1s}
.fifa-card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.2,.2,1)}
.fifa-card.flipped{transform:rotateY(180deg)}

/* CHAMFERED FACE */
.fifa-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;clip-path:polygon(16px 0%,calc(100% - 16px) 0%,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0% calc(100% - 16px),0% 16px);background:linear-gradient(135deg,#1e40af,#0a1428,#1e40af);box-shadow:0 8px 24px rgba(0,0,0,.7)}
.fifa-face.fifa-back{transform:rotateY(180deg)}
.fifa-content{position:absolute;inset:2px;clip-path:polygon(15px 0%,calc(100% - 15px) 0%,100% 15px,100% calc(100% - 15px),calc(100% - 15px) 100%,15px 100%,0% calc(100% - 15px),0% 15px);padding:8px;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(160deg,#0a1428,#050a15)}
.fifa-content::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);background-size:200% 100%;animation:shineSweep 4s ease-in-out infinite;pointer-events:none;z-index:6}
@keyframes shineSweep{0%{background-position:-100% 0}100%{background-position:200% 0}}

[data-tier="gold"] .fifa-face{background:linear-gradient(135deg,#f5d76e,#8a6d1f,#f5d76e)}
[data-tier="gold"] .fifa-content{background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.5),transparent 45%),linear-gradient(160deg,#b8942a,#f5d76e 18%,#d4af37 40%,#8a6d1f 60%,#d4af37 82%,#b8942a)}
[data-tier="silver"] .fifa-face{background:linear-gradient(135deg,#e8e8e8,#5a5a5a,#e8e8e8)}
[data-tier="silver"] .fifa-content{background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.6),transparent 45%),linear-gradient(160deg,#9a9a9a,#e8e8e8 18%,#c8c8c8 40%,#787878 60%,#c8c8c8 82%,#9a9a9a)}
[data-tier="bronze"] .fifa-face{background:linear-gradient(135deg,#d4a373,#4a2f15,#d4a373)}
[data-tier="bronze"] .fifa-content{background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.3),transparent 45%),linear-gradient(160deg,#7a4a20,#d4a373 18%,#b8865f 40%,#6b4423 60%,#b8865f 82%,#7a4a20)}
[data-tier="icon"] .fifa-face{background:linear-gradient(135deg,#d4af37,#000,#d4af37,#8a6d1f,#d4af37)}
[data-tier="icon"] .fifa-content{background:radial-gradient(circle at 50% 15%,rgba(212,175,55,.35),transparent 60%),linear-gradient(160deg,#0a0805,#2a1e08 25%,#000 50%,#2a1e08 75%,#0a0805)}
[data-tier="legendary"] .fifa-face{background:linear-gradient(135deg,#f5d76e 0%,#000 20%,#d4af37 40%,#000 60%,#f5d76e 80%,#8a6d1f 100%);background-size:200% 200%;animation:legendaryShift 4s ease-in-out infinite}
@keyframes legendaryShift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
[data-tier="legendary"] .fifa-content{background:radial-gradient(circle at 50% 20%,rgba(245,215,110,.2),transparent 55%),conic-gradient(from 45deg at 50% 50%,#0a0a0a 0deg,#1a1208 90deg,#0a0a0a 180deg,#1a1208 270deg,#0a0a0a 360deg)}

.fifa-expand{position:absolute;top:6px;right:6px;width:32px;height:32px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);border-radius:50%;color:#fff;font-size:14px;cursor:pointer;z-index:15;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.fifa-del{position:absolute;top:6px;left:6px;width:32px;height:32px;background:rgba(231,76,60,.85);border:1px solid rgba(255,255,255,.4);border-radius:50%;color:#fff;font-size:14px;cursor:pointer;z-index:15;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.fifa-edit{position:absolute;top:44px;left:6px;width:32px;height:32px;background:rgba(59,130,246,.85);border:1px solid rgba(255,255,255,.4);border-radius:50%;color:#fff;font-size:14px;cursor:pointer;z-index:15;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}

.fifa-top{display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;position:relative;z-index:2}
.fifa-rating-block{display:flex;flex-direction:column;align-items:center;padding:3px 8px;border-radius:6px;min-width:46px;flex-shrink:0}
.fifa-overall{font-size:22px;font-weight:900;line-height:1}
.fifa-position{font-size:9px;font-weight:800;margin-top:1px;letter-spacing:.5px}
[data-tier="gold"] .fifa-rating-block{background:linear-gradient(135deg,#1a1208,#2a1e08);color:#f5d76e;border:1px solid rgba(245,215,110,.5)}
[data-tier="silver"] .fifa-rating-block{background:linear-gradient(135deg,#1a1a1a,#2a2a2a);color:#e8e8e8;border:1px solid rgba(232,232,232,.45)}
[data-tier="bronze"] .fifa-rating-block{background:linear-gradient(135deg,#1a1208,#2a1e08);color:#d4a373;border:1px solid rgba(212,163,115,.5)}
[data-tier="icon"] .fifa-rating-block{background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);color:#1a1208;border:1px solid #f5d76e;box-shadow:0 0 20px rgba(245,215,110,.6)}
[data-tier="legendary"] .fifa-rating-block{background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);color:#1a1208;border:1px solid #f5d76e;box-shadow:0 0 25px rgba(245,215,110,.8)}

.fifa-photo-wrap{flex:1;display:flex;justify-content:center;align-items:flex-start;padding-top:2px}
.fifa-photo-circle{width:72px;height:72px;border-radius:50%;overflow:hidden;border:2.5px solid;box-shadow:0 4px 10px rgba(0,0,0,.4);background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:26px}
[data-tier="gold"] .fifa-photo-circle{border-color:#1a1208}
[data-tier="silver"] .fifa-photo-circle{border-color:#1a1a1a}
[data-tier="bronze"] .fifa-photo-circle{border-color:#1a1208}
[data-tier="icon"] .fifa-photo-circle{border-color:#f5d76e;box-shadow:0 0 18px rgba(245,215,110,.6)}
[data-tier="legendary"] .fifa-photo-circle{border-color:#f5d76e;box-shadow:0 0 25px rgba(245,215,110,.7)}
.fifa-photo-circle img{width:100%;height:100%;object-fit:cover}

.fifa-name-bar{margin-top:2px;margin-bottom:4px;padding:4px 8px;border-top:1px solid rgba(0,0,0,.2);border-bottom:1px solid rgba(0,0,0,.2);position:relative;z-index:2}
.fifa-name{font-size:11px;font-weight:900;text-align:center;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-tier="gold"] .fifa-name{color:#1a1208}
[data-tier="silver"] .fifa-name{color:#1a1a1a}
[data-tier="bronze"] .fifa-name{color:#1a1208}
[data-tier="icon"] .fifa-name{color:#f5d76e;text-shadow:0 0 8px rgba(245,215,110,.5)}
[data-tier="legendary"] .fifa-name{color:#f5d76e;text-shadow:0 0 10px rgba(245,215,110,.7)}

/* SEASON STATS (front) */
.fifa-season-stats{display:flex;gap:3px;margin-top:auto;padding:3px 0;position:relative;z-index:2;direction:ltr}
.fifa-season-stat{flex:1;text-align:center;padding:3px 2px;border-radius:4px;background:rgba(0,0,0,.2)}
.fifa-season-stat b{display:block;font-size:16px;font-weight:900;line-height:1}
.fifa-season-stat span{font-size:8px;font-weight:700;margin-top:2px;display:block;letter-spacing:.3px}
[data-tier="gold"] .fifa-season-stat b{color:#1a1208}
[data-tier="gold"] .fifa-season-stat span{color:rgba(26,18,8,.7)}
[data-tier="silver"] .fifa-season-stat b{color:#1a1a1a}
[data-tier="silver"] .fifa-season-stat span{color:rgba(26,26,26,.7)}
[data-tier="bronze"] .fifa-season-stat b{color:#1a1208}
[data-tier="bronze"] .fifa-season-stat span{color:rgba(26,18,8,.7)}
[data-tier="icon"] .fifa-season-stat{background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.2)}
[data-tier="icon"] .fifa-season-stat b{color:#f5d76e}
[data-tier="icon"] .fifa-season-stat span{color:rgba(245,215,110,.65)}
[data-tier="legendary"] .fifa-season-stat{background:rgba(245,215,110,.15);border:1px solid rgba(245,215,110,.3)}
[data-tier="legendary"] .fifa-season-stat b{color:#f5d76e}
[data-tier="legendary"] .fifa-season-stat span{color:rgba(245,215,110,.75)}

/* EXTRA row with centered expand */
.fifa-extra{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:3px 2px 0;border-top:1px solid rgba(0,0,0,.15);font-size:9px;font-weight:800;position:relative;z-index:2;margin-top:3px;gap:4px}
.fifa-extra>:first-child{justify-self:start}
.fifa-extra>:last-child{justify-self:end}
.fifa-stars{letter-spacing:-.5px;font-size:10px}
[data-tier="gold"] .fifa-extra{color:#1a1208}
[data-tier="silver"] .fifa-extra{color:#1a1a1a}
[data-tier="bronze"] .fifa-extra{color:#1a1208}
[data-tier="icon"] .fifa-extra{color:#f5d76e}
[data-tier="legendary"] .fifa-extra{color:#f5d76e}

.fifa-expand-center{width:24px;height:24px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);border-radius:50%;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;justify-self:center;z-index:15}
.fifa-expand-center:active{transform:scale(.9)}

/* BACK full stats */
.fifa-back-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,9,25,.3),rgba(10,6,18,.85));z-index:0}
.fifa-back-top{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:3}
.fifa-back-btn{width:30px;height:30px;background:rgba(0,0,0,.7);border:1px solid var(--blue);border-radius:50%;color:var(--blue-lt);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.fifa-back-btn:active{transform:scale(.9)}

.fifa-full-stats{position:relative;z-index:2;padding:44px 8px 8px;margin-top:auto}
.fifa-full-stats .fifa-stat-row{display:flex;gap:4px;margin-bottom:4px}
.fifa-full-stats .fifa-stat{flex:1;text-align:center;padding:5px 2px;border-radius:5px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
.fifa-full-stats .fifa-stat b{display:block;font-size:15px;font-weight:900;line-height:1;color:#fff}
.fifa-full-stats .fifa-stat span{font-size:7px;font-weight:700;margin-top:2px;display:block;letter-spacing:.3px;color:rgba(255,255,255,.7)}

.fifa-back-content{padding:8px;position:relative;z-index:2;text-align:center;background:linear-gradient(180deg,transparent,rgba(0,0,0,.6))}
.fifa-back-ovr{font-size:26px;font-weight:900;color:var(--blue-lt);line-height:1;text-shadow:0 2px 12px rgba(59,130,246,.7)}
.fifa-back-name{font-size:13px;font-weight:900;color:#fff;margin-top:3px;letter-spacing:.6px;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.fifa-back-pos{font-size:10px;color:var(--blue-lt);margin-top:2px;letter-spacing:2px;font-weight:700;opacity:.85}
.fifa-back-brand{font-size:8px;color:rgba(147,197,253,.6);margin-top:6px;letter-spacing:2px;font-weight:700}
[data-tier="legendary"] .fifa-back-ovr{color:#f5d76e;text-shadow:0 0 20px rgba(245,215,110,.8)}
[data-tier="legendary"] .fifa-back-pos{color:#f5d76e}
[data-tier="legendary"] .fifa-back-btn{border-color:#f5d76e;color:#f5d76e}

/* LEGENDARY CAROUSEL */
.legendary-toolbar{display:flex;gap:8px;margin-bottom:10px}
.legendary-toolbar button{flex:1;padding:10px;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);border:none;border-radius:10px;color:#000;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 3px 14px rgba(212,175,55,.4)}
.legendary-carousel{position:relative;height:400px;perspective:1400px;overflow:hidden;margin:0 -16px;padding:0 16px}
.legendary-stage{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.legendary-card{position:absolute;left:50%;top:50%;width:200px;height:300px;margin-left:-100px;margin-top:-150px;transition:all .7s cubic-bezier(.2,.9,.3,1);cursor:pointer;transform-origin:center center}
.legendary-card .fifa-card-wrap{width:100%;height:100%;perspective:none}
.legendary-card .fifa-card-3d{width:100%;height:100%;aspect-ratio:auto}
.legendary-card .fifa-card{width:100%;height:100%}
.legendary-card.active .fifa-card-3d{animation:legendFloat 3s ease-in-out infinite}
@keyframes legendFloat{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}
.legendary-indicator{text-align:center;color:var(--gold-lt);font-size:12px;font-weight:700;margin-top:10px;letter-spacing:2px}

/* PREVIEW */
.preview-overlay{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,rgba(59,130,246,.2),rgba(0,0,0,.96));backdrop-filter:blur(8px);animation:fadeIn .3s ease}
.preview-overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.preview-content{max-width:300px;width:100%;position:relative;animation:packOpen .8s cubic-bezier(.2,.9,.3,1)}
@keyframes packOpen{0%{opacity:0;transform:scale(.2) rotateY(180deg) rotateZ(-15deg)}60%{transform:scale(1.05) rotateY(0) rotateZ(2deg)}100%{opacity:1;transform:scale(1) rotateY(0) rotateZ(0)}}
.preview-close{position:absolute;top:-50px;right:0;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer;backdrop-filter:blur(6px)}
.preview-content .fifa-card-wrap{width:100%;cursor:pointer}

/* MATCHES */
.match-item{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.25);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.match-item:active{transform:scale(.99);border-color:var(--blue)}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11px;color:var(--dim)}
.match-teams{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid rgba(59,130,246,.15);border-bottom:1px solid rgba(59,130,246,.15);margin-bottom:8px}
.match-team{flex:1;text-align:center;font-size:13px;font-weight:800;color:var(--blue-lt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-score{font-size:22px;font-weight:900;color:#fff;letter-spacing:2px;direction:ltr}
.match-time{text-align:center;font-size:12px;color:var(--dim);margin-bottom:6px;direction:ltr}
.match-meta{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--dim);flex-wrap:wrap}
.match-meta span{display:flex;align-items:center;gap:3px}

/* MATCH FORM */
.match-form{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.3);border-radius:14px;padding:14px;margin-bottom:14px}
.match-form-row{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-bottom:8px}
.match-form-row .vs{font-weight:900;color:var(--blue-lt);font-size:13px;text-align:center;padding:8px}
.match-form-label{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:3px;display:block}

/* LINEUP */
.lineup-section{background:rgba(59,130,246,.05);border:1px solid rgba(59,130,246,.25);border-radius:12px;margin-bottom:12px;overflow:hidden}
.lineup-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;background:rgba(59,130,246,.08)}
.lineup-title{font-size:13px;font-weight:800;color:var(--blue-lt)}
.lineup-toggle{font-size:16px;color:var(--blue-lt)}
.lineup-body{padding:12px 14px;display:none}
.lineup-body.open{display:block}
.lineup-player{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;margin-bottom:6px;background:rgba(0,0,0,.3);cursor:pointer}
.lineup-player.selected{border:1px solid var(--blue);background:rgba(59,130,246,.15)}
.lineup-checkbox{width:18px;height:18px;accent-color:#3b82f6;flex-shrink:0}
.lineup-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#1a2a44,#050a15);border:1.5px solid var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden;flex-shrink:0}
.lineup-avatar img{width:100%;height:100%;object-fit:cover}
.lineup-name{font-size:13px;font-weight:700;flex:1}
.lineup-pos{font-size:10px;color:var(--dim)}
.lineup-actions{display:flex;gap:6px;margin-top:10px}
.lineup-actions button{flex:1;padding:8px;border-radius:8px;border:1px solid rgba(59,130,246,.35);background:rgba(59,130,246,.1);color:var(--blue-lt);font-size:11px;font-weight:700;cursor:pointer}
.lineup-empty{text-align:center;color:var(--dim);font-size:12px;padding:16px}

/* STATS (improved cards) */
.stat-category{margin-bottom:22px}
.stat-cat-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--blue-lt);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(59,130,246,.25)}
.stat-cards{display:flex;flex-direction:column;gap:10px}
.stat-player-card{display:flex;align-items:center;gap:10px;padding:14px;background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.2);border-radius:16px;position:relative}
.stat-player-card.rank-1{border-color:#d4af37;background:linear-gradient(135deg,#1a1a08,#2a2410);box-shadow:0 0 24px rgba(212,175,55,.3)}
.stat-player-card.rank-2{border-color:#c0c0c0;background:linear-gradient(135deg,#1a1a22,#25252e)}
.stat-player-card.rank-3{border-color:#cd7f32;background:linear-gradient(135deg,#1a130a,#2a1e0f)}
.stat-rank{width:42px;height:42px;border-radius:50%;background:rgba(59,130,246,.15);border:1.5px solid rgba(59,130,246,.35);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:var(--blue-lt);flex-shrink:0}
.stat-rank.medal-gold{background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);color:#000;border-color:#f5d76e;box-shadow:0 0 15px rgba(212,175,55,.5)}
.stat-rank.medal-silver{background:linear-gradient(135deg,#f0f0f0,#c0c0c0,#888);color:#000;border-color:#e0e0e0;box-shadow:0 0 15px rgba(192,192,192,.4)}
.stat-rank.medal-bronze{background:linear-gradient(135deg,#e8a866,#cd7f32,#8b5a2b);color:#000;border-color:#cd7f32;box-shadow:0 0 15px rgba(205,127,50,.4)}
.stat-photo{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#1a2a44,#050a15);border:2px solid var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0}
.stat-photo img{width:100%;height:100%;object-fit:cover}
.stat-info{flex:1;min-width:0}
.stat-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-pos{font-size:11px;color:var(--blue-lt);font-weight:600;margin-top:2px;opacity:.85}
.stat-progress{height:6px;background:rgba(59,130,246,.15);border-radius:3px;margin-top:8px;overflow:hidden}
.stat-progress-bar{height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:3px;transition:width .6s ease}
.rank-1 .stat-progress-bar{background:linear-gradient(90deg,#d4af37,#f5d76e)}
.rank-2 .stat-progress-bar{background:linear-gradient(90deg,#a0a0a0,#e0e0e0)}
.rank-3 .stat-progress-bar{background:linear-gradient(90deg,#a0622b,#e8a866)}
.stat-value-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.35);border-radius:12px;min-width:70px;flex-shrink:0}
.stat-value{font-size:24px;font-weight:900;color:var(--blue-lt);line-height:1}
.stat-value-label{font-size:9px;color:var(--dim);margin-top:3px;font-weight:700;letter-spacing:.5px}

/* Rules / Anns */
.info-card{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.25);border-radius:14px;padding:14px;margin-bottom:10px}
.info-card-title{font-weight:800;color:var(--blue-lt);font-size:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.info-card-body{font-size:13px;line-height:1.7;color:#ccc}
.info-card-meta{font-size:11px;color:var(--dim);margin-bottom:6px}

/* Forms */
.form-label{display:block;color:var(--blue-lt);font-size:12px;font-weight:700;margin:12px 0 4px}
.modal input,.modal select,.modal textarea{width:100%;padding:12px;background:rgba(0,0,0,.4);border:1px solid rgba(59,130,246,.25);border-radius:10px;color:var(--text);font-size:14px}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--blue)}
.modal textarea{resize:vertical;min-height:70px}
.modal input[type=file]{cursor:pointer;padding:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid-2>div>input,.grid-3>div>input{margin-top:4px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:linear-gradient(135deg,#0d1728,#141e30);border:1px solid rgba(59,130,246,.4);border-radius:20px;padding:22px;width:100%;max-width:460px;max-height:85vh;overflow-y:auto}
.modal h3{color:var(--blue-lt);font-size:18px;font-weight:800;text-align:center;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid rgba(59,130,246,.25)}

/* PROFILE */
.profile-view{position:fixed;inset:0;z-index:60;overflow-y:auto;background:linear-gradient(135deg,#050a15,#0d1728,#050a15);display:none}
.profile-view.show{display:block}
.profile-bg-img{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(40px) brightness(.25);transform:scale(1.2);z-index:0}
.profile-overlay{position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,10,21,.3),rgba(5,10,21,.7) 50%,rgba(5,10,21,.95));z-index:1}
.profile-content{position:relative;z-index:2;min-height:100%;padding:60px 20px 40px;display:flex;flex-direction:column;align-items:center}
.profile-back{position:fixed;top:16px;right:16px;background:rgba(0,0,0,.6);border:1px solid rgba(59,130,246,.5);color:var(--blue-lt);padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;z-index:3}
.profile-avatar{width:140px;height:140px;border-radius:50%;border:4px solid var(--blue-mid);background:linear-gradient(135deg,#1a2a44,#050a15);display:flex;align-items:center;justify-content:center;font-size:60px;overflow:hidden;box-shadow:0 0 60px rgba(59,130,246,.6);margin-bottom:20px}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:26px;font-weight:900;color:var(--blue-lt);text-align:center;margin-bottom:6px}
.profile-pos{display:inline-block;background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff;padding:4px 16px;border-radius:20px;font-size:12px;font-weight:800;margin-bottom:24px}
.profile-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:400px;margin-bottom:20px}
.stat-box{background:rgba(12,20,37,.75);border:1px solid rgba(59,130,246,.35);border-radius:14px;padding:14px 8px;text-align:center}
.stat-box b{display:block;font-size:22px;font-weight:900;color:var(--blue-lt);margin-bottom:2px}
.stat-box span{font-size:11px;color:var(--dim);font-weight:600}
.profile-details{width:100%;max-width:400px;background:rgba(12,20,37,.75);border:1px solid rgba(59,130,246,.3);border-radius:14px;padding:16px;font-size:14px;line-height:2;color:#ddd;text-align:center;margin-bottom:24px}
.profile-delete-btn{width:100%;max-width:400px;padding:14px;background:rgba(231,76,60,.1);border:1px solid var(--red);color:var(--red);font-size:14px;font-weight:800;border-radius:14px;cursor:pointer;margin-top:8px}
.profile-delete-btn:active{background:rgba(231,76,60,.25)}

/* Admin redesign */
.admin-section{margin-bottom:18px}
.admin-section-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.admin-section-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#1e40af);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:0 3px 12px rgba(59,130,246,.35)}
.admin-section-title{font-size:15px;font-weight:800;color:var(--blue-lt)}
.admin-card{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.25);border-radius:16px;padding:16px}

.admin-logo-preview{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#1a2a44,#050a15);border:2px solid var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex-shrink:0}
.admin-logo-preview img{width:100%;height:100%;object-fit:cover}
.admin-logo-info{flex:1;min-width:0}
.admin-logo-info input{width:100%;padding:10px;background:rgba(0,0,0,.4);border:1px solid rgba(59,130,246,.25);border-radius:8px;color:#fff;margin-bottom:8px;font-size:13px}
.admin-bg-preview{width:100%;height:140px;border-radius:12px;background:rgba(0,0,0,.4);border:1px dashed rgba(59,130,246,.3);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--dim);background-size:cover;background-position:center;margin-bottom:12px;overflow:hidden}
.admin-bg-actions{display:flex;gap:8px;margin-bottom:8px}
.admin-bg-actions button{flex:1;padding:10px;border-radius:10px;border:none;font-size:12px;font-weight:700;cursor:pointer}
.firebase-status{padding:8px 10px;border-radius:8px;font-size:11px;font-weight:600;text-align:center}
.firebase-status.ok{background:rgba(39,174,96,.15);color:#4ade80;border:1px solid rgba(39,174,96,.3)}
.firebase-status.warn{background:rgba(230,126,34,.15);color:#fbbf24;border:1px solid rgba(230,126,34,.3)}

.pending-request{display:flex;gap:12px;padding:12px;background:rgba(0,0,0,.35);border:1px solid rgba(59,130,246,.2);border-radius:12px;margin-bottom:10px}
.pr-info{flex:1}
.pr-name{font-size:14px;font-weight:800;margin-bottom:4px}
.pr-phone,.pr-date{font-size:11px;color:var(--dim);margin-top:2px}
.pr-actions{display:flex;flex-direction:column;gap:6px}
.btn-approve,.btn-reject{width:38px;height:38px;border-radius:10px;border:none;font-size:16px;font-weight:800;cursor:pointer}
.btn-approve{background:linear-gradient(135deg,#27ae60,#1e8449);color:#fff}
.btn-reject{background:rgba(231,76,60,.15);border:1px solid var(--red);color:var(--red)}

.perm-row{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(0,0,0,.35);border:1px solid rgba(59,130,246,.2);border-radius:12px;margin-bottom:8px}
.perm-row.main{border-color:#d4af37;background:linear-gradient(135deg,rgba(212,175,55,.08),rgba(0,0,0,.35))}
.perm-info{flex:1;min-width:0}
.perm-name{font-size:13px;font-weight:800;color:#fff;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perm-meta{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.perm-role{padding:2px 7px;border-radius:6px;font-weight:700;font-size:10px}
.perm-lock{font-size:14px;color:#d4af37;flex-shrink:0}
.role-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;margin-right:4px}
.role-admin{background:rgba(59,130,246,.22);color:var(--blue-lt)}
.role-player{background:rgba(100,150,255,.15);color:#79a7ff}
.role-coach{background:rgba(39,174,96,.2);color:var(--green)}
.role-supervisor{background:rgba(230,126,34,.2);color:#e67e22}
.role-main{background:linear-gradient(135deg,#f5d76e,#d4af37);color:#000}

/* Match player row */
.pm-row{background:#0a1424;border:1px solid #1a2a44;border-radius:10px;padding:10px;margin-bottom:8px}
.pm-name{font-size:13px;font-weight:700;color:var(--blue-lt);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pm-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pm-ctrl{text-align:center;font-size:11px;color:var(--dim)}
.pm-ctrl label{display:block;margin-bottom:2px}
.pm-ctrl input{padding:6px;font-size:14px;text-align:center;margin:0}
.pm-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:8px}
.pm-award{background:#0d1728;border:1px solid #333;color:#666;padding:6px 4px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700}
.pm-award.best.active{background:rgba(212,175,55,.25);border-color:#d4af37;color:#f5d76e}
.pm-award.worst.active{background:rgba(231,76,60,.15);border-color:var(--red);color:var(--red)}
.pm-award.bad.active{background:rgba(150,150,150,.25);border-color:#888;color:#ccc}

.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;background:rgba(59,130,246,.18);color:var(--blue-lt);border:1px solid rgba(59,130,246,.35)}
.pill-gold{background:rgba(212,175,55,.2);color:#f5d76e;border-color:rgba(212,175,55,.5)}
.pill-red{background:rgba(231,76,60,.15);color:var(--red);border-color:var(--red)}
.pill-gray{background:rgba(150,150,150,.2);color:#ccc;border-color:#666}

.photo-pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.photo-pick-cell{aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid rgba(59,130,246,.3);cursor:pointer;background:#0a1424;display:flex;align-items:center;justify-content:center;font-size:20px}
.photo-pick-cell img{width:100%;height:100%;object-fit:cover}
</style>

<script>
/* ====================================================================

var firebaseApp = null, firebaseDB = null, firebaseStorage = null;

try {

// ============ STORAGE ============
var K = {users:'fca_users',players:'fca_players',session:'fca_session',matches:'fca_matches',rules:'fca_rules',anns:'fca_anns',team:'fca_team',notif:'fca_notif',legendary:'fca_legendary'};
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('المساحة ممتلئة — جرب صورة أصغر');return false}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function getUsers(){return load(K.users,[])}function setUsers(v){return save(K.users,v)}
function getPlayers(){return load(K.players,[])}function setPlayers(v){return save(K.players,v)}
function getMatches(){return load(K.matches,[])}function setMatches(v){return save(K.matches,v)}
function getRules(){return load(K.rules,[])}function setRules(v){return save(K.rules,v)}
function getAnns(){return load(K.anns,[])}function setAnns(v){return save(K.anns,v)}
function getTeam(){return load(K.team,{name:'فريق بني برزه',logo:'',loginBg:''})}function setTeam(v){return save(K.team,v)}
function getNotifs(){return load(K.notif,[])}function setNotifs(v){return save(K.notif,v)}
function getLegendary(){return load(K.legendary,[])}function setLegendary(v){return save(K.legendary,v)}
function getSession(){return localStorage.getItem(K.session)}
function setSession(id){if(id)localStorage.setItem(K.session,id);else localStorage.removeItem(K.session)}
function me(){var id=getSession();if(!id)return null;var us=getUsers();for(var i=0;i<us.length;i++)if(us[i].id===id)return us[i];return null}
function isAdmin(){var u=me();return u&&u.role==='admin'}
function canManage(){var u=me();return u&&(u.role==='admin'||u.role==='coach'||u.role==='supervisor')}
function getPlayerById(id){var ps=getPlayers();for(var i=0;i<ps.length;i++)if(ps[i].id===id)return ps[i];return null}
function getLegendaryById(id){var ls=getLegendary();for(var i=0;i<ls.length;i++)if(ls[i].id===id)return ls[i];return null}

// Main admin migration
function ensureMainAdmin(){
  var us=getUsers();
  if(us.length===0)return;
  var has=false;
  for(var i=0;i<us.length;i++)if(us[i].isMainAdmin){has=true;break}
  if(!has){
    for(var i=0;i<us.length;i++){if(us[i].role==='admin'){us[i].isMainAdmin=true;break}}
    if(!has && us[0])us[0].isMainAdmin=true;
    setUsers(us);
  }
}

function applyLoginBackground(){
  var t=getTeam(),el=document.getElementById('authBgImg');
  if(!el)return;
  if(t.loginBg){
    el.style.backgroundImage='url('+t.loginBg+')';
    el.classList.add('has-image');

async function syncLoginBackground(){
  if(FIREBASE_READY && firebaseDB){
    try{
      var doc=await firebaseDB.collection('settings').doc('team').get();
      if(doc.exists && doc.data().loginBgUrl){
        var t=getTeam();
        t.loginBg=doc.data().loginBgUrl;
        setTeam(t);
      }
    }catch(e){console.warn('Sync bg failed:',e)}
  }
  applyLoginBackground();
}

function dataURLtoBlob(dataUrl){
  var parts=dataUrl.split(','),mime=parts[0].match(/:(.*?);/)[1],bstr=atob(parts[1]),n=bstr.length,u8=new Uint8Array(n);
  while(n--)u8[n]=bstr.charCodeAt(n);
  return new Blob([u8],{type:mime});
}

async function uploadLoginBackground(){
  openModal('<h3>🖼️ خلفية شاشة الدخول</h3>'+
    '<input type="file" id="bgFileInput" accept="image/*" style="display:block">'+
    '<div id="bgPhotoPreview" style="margin:14px 0;text-align:center"></div>'+
    '<button class="btn-purple" onclick="saveLoginBackground()">حفظ الخلفية</button>');
  setTimeout(function(){
    var inp=document.getElementById('bgFileInput');
    if(!inp)return;
    inp.onchange=function(e){
      var f=e.target.files&&e.target.files[0];if(!f)return;
      var reader=new FileReader();
      reader.onload=function(ev){
        var prev=document.getElementById('bgPhotoPreview');
        if(prev)prev.innerHTML='<img src="'+ev.target.result+'" style="max-width:100%;max-height:180px;border-radius:10px;border:2px solid var(--blue)">';
      };
      reader.readAsDataURL(f);
    };
  },80);
}

async function saveLoginBackground(){
  var inp=document.getElementById('bgFileInput');
  if(!inp||!inp.files||!inp.files[0])return alert('اختر صورة أول');
  var file=inp.files[0];
  if(file.size>10*1024*1024)return alert('الصورة كبيرة جدًا');

  var dataUrl=await compressImage(file,1200,0.75);

  if(FIREBASE_READY && firebaseStorage && firebaseDB){
    try{
      var oldUrl=getTeam().loginBg;
      if(oldUrl && oldUrl.indexOf('firebasestorage.googleapis.com')!==-1){
        try{await firebaseStorage.refFromURL(oldUrl).delete()}catch(e){}
      }
      var blob=dataURLtoBlob(dataUrl);
      var ref=firebaseStorage.ref('team/bg-'+Date.now()+'.jpg');
      await ref.put(blob);
      var url=await ref.getDownloadURL();
      await firebaseDB.collection('settings').doc('team').set({loginBgUrl:url,updatedAt:Date.now()},{merge:true});
      var t=getTeam();t.loginBg=url;setTeam(t);
      applyLoginBackground();
      closeModal();
      renderAdmin();
      alert('✓ تم رفع الخلفية — هتظهر عند الكل');
      return;
    }catch(e){
      console.error('Firebase upload failed:',e);
      alert('فشل الرفع على Firebase: '+e.message+'\nهيتم الحفظ على الجهاز فقط');
    }
  }

  var t=getTeam();t.loginBg=dataUrl;setTeam(t);
  applyLoginBackground();
  closeModal();
  renderAdmin();
  alert('✓ تم حفظ الخلفية على الجهاز');
}

async function removeLoginBackground(){
  if(!confirm('إزالة خلفية شاشة الدخول؟'))return;
  var t=getTeam();
  if(FIREBASE_READY && firebaseStorage && t.loginBg && t.loginBg.indexOf('firebasestorage.googleapis.com')!==-1){
    try{await firebaseStorage.refFromURL(t.loginBg).delete()}catch(e){}
    try{await firebaseDB.collection('settings').doc('team').set({loginBgUrl:''},{merge:true})}catch(e){}
  }
  t.loginBg='';
  setTeam(t);
  applyLoginBackground();
  renderAdmin();
}

function showView(v){

function handleLogin(){
  var phone=document.getElementById('loginPhone').value.trim();
  var pass=document.getElementById('loginPassword').value;
  if(!phone||!pass)return alert('اكتب الرقم والباسورد');
  var us=getUsers(),u=null;
  for(var i=0;i<us.length;i++)if(us[i].phone===phone&&us[i].password===pass){u=us[i];break}
  if(!u)return alert('بيانات الدخول غلط');
  if(u.status==='pending')return alert('حسابك في انتظار الموافقة');
  if(u.status==='rejected')return alert('تم رفض حسابك');
  setSession(u.id);enterApp();
}
function handleSignup(){
  var name=document.getElementById('suName').value.trim();
  var phone=document.getElementById('suPhone').value.trim();
  var birth=document.getElementById('suBirth').value;
  var pass=document.getElementById('suPass').value;
  var conf=document.getElementById('suConfirm').value;
  if(!name||!phone||!birth||!pass)return alert('كمل كل الحقول');
  if(pass.length<4)return alert('الباسورد 4 حروف على الأقل');
  if(pass!==conf)return alert('الباسورد مش متطابق');
  var us=getUsers();
  for(var i=0;i<us.length;i++)if(us[i].phone===phone)return alert('الرقم مسجل');
  var isFirst=us.length===0;
  var u={id:uid(),name:name,phone:phone,birthDate:birth,password:pass,status:isFirst?'approved':'pending',role:isFirst?'admin':'player',playerId:null,createdAt:Date.now(),isMainAdmin:isFirst};
  us.push(u);setUsers(us);
  if(isFirst){
    var ps=getPlayers();
    var p={id:uid(),name:name,phone:phone,birthDate:birth,position:'لاعب',photo:'',cardBackImage:'',
      stats:{goals:0,assists:0,matches:0,motm:0,rating:0,pace:70,shooting:70,passing:70,dribbling:70,defending:70,physical:70,skills:3,weakFoot:3,jerseyNumber:0}};
    ps.push(p);setPlayers(ps);
    u.playerId=p.id;setUsers(us);setSession(u.id);enterApp();
  }else{
    showView('pending');
    ['suName','suPhone','suBirth','suPass','suConfirm'].forEach(function(id){document.getElementById(id).value=''});
  }
}
function logout(){
  if(!confirm('تسجيل الخروج؟'))return;
  setSession(null);
  document.getElementById('app').classList.remove('show');
  document.getElementById('authScreen').style.display='flex';

function enterApp(){

function openPhotoUpload(playerId,type){
  var titles={avatar:'📷 صورة اللاعب',back:'🖼️ صورة ظهر الكارت',logo:'🛡️ شعار الفريق'};
  openModal('<h3>'+(titles[type]||'رفع صورة')+'</h3>'+

    '<button class="btn-purple" onclick="savePhoto(\''+playerId+'\',\''+type+'\')">حفظ الصورة</button>');
  setTimeout(function(){
    var inp=document.getElementById('photoFileInput');
    if(!inp)return;
    inp.onchange=function(e){
      var f=e.target.files&&e.target.files[0];if(!f)return;
      var reader=new FileReader();
      reader.onload=function(ev){
        var prev=document.getElementById('photoPreview');
        if(prev)prev.innerHTML='<img src="'+ev.target.result+'" style="max-width:100%;max-height:200px;border-radius:10px;border:2px solid var(--blue)">';
      };
      reader.readAsDataURL(f);
    };
  },80);
}
function savePhoto(playerId,type){
  var inp=document.getElementById('photoFileInput');
  if(!inp||!inp.files||!inp.files[0])return alert('اختر صورة أول');
  var file=inp.files[0];
  if(file.size>10*1024*1024)return alert('الصورة كبيرة جدًا');
  compressImage(file,type==='avatar'?400:700,0.7).then(function(dataUrl){
    if(type==='logo'){
      var t=getTeam();t.logo=dataUrl;if(!setTeam(t))return;
      document.querySelector('.app-logo').innerHTML='<img src="'+dataUrl+'">';
      renderAdmin();
    }else{
      var ps=getPlayers(),found=false;
      for(var i=0;i<ps.length;i++)if(ps[i].id===playerId){
        if(type==='avatar')ps[i].photo=dataUrl;else ps[i].cardBackImage=dataUrl;
        found=true;break;
      }
      if(!found)return alert('اللاعب غير موجود');
      if(!setPlayers(ps))return;
      renderPlayers();renderCards();
    }
    closeModal();alert('✓ تم حفظ الصورة');
  }).catch(function(err){alert('فشل: '+err.message)});
}
function compressImage(file,maxW,quality){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        try{
          var canvas=document.createElement('canvas');
          var w=img.width,h=img.height;
          if(w>maxW){h=h*maxW/w;w=maxW}
          if(h>maxW){w=w*maxW/h;h=maxW}
          canvas.width=w;canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg',quality));
        }catch(e){reject(e)}
      };
      img.onerror=function(){reject(new Error('فشل تحميل الصورة'))};
      img.src=reader.result;
    };
    reader.onerror=function(){reject(new Error('فشل قراءة الملف'))};
    reader.readAsDataURL(file);
  });
}

// ============ POSITION / TIER / OVERALL ============
var posMap={'حارس':'GK','مدافع':'CB','وسط':'CM','مهاجم':'ST'};
function posAbbr(pos){return posMap[pos]||'PLAYER'}
function getCardTier(ovr){if(ovr>=90)return 'icon';if(ovr>=80)return 'gold';if(ovr>=70)return 'silver';return 'bronze'}
function calcOverall(p){
  var s=p.stats||{};
  var pace=+s.pace||70,sho=+s.shooting||70,pas=+s.passing||70,dri=+s.dribbling||70,def=+s.defending||70,phy=+s.physical||70;
  var w;
  if(p.position==='حارس')w={pace:.5,sho:.2,pas:1,dri:.8,def:2.5,phy:2};
  else if(p.position==='مدافع')w={pace:1.2,sho:.5,pas:1,dri:.8,def:2.5,phy:2};
  else if(p.position==='وسط')w={pace:1.5,sho:1,pas:2.5,dri:2,def:1,phy:1};
  else w={pace:2,sho:2.5,pas:1,dri:2,def:.3,phy:1.2};
  var total=pace*w.pace+sho*w.sho+pas*w.pas+dri*w.dri+def*w.def+phy*w.phy;
  var wsum=w.pace+w.sho+w.pas+w.dri+w.def+w.phy;
  return Math.round(total/wsum);
}

function renderPlayers(){
  var el=document.getElementById('panel-0');

  html+='<div class="section-header">👥 اللاعبين <span class="count">'+players.length+'</span></div>';
  if(!players.length)html+='<div class="empty-state"><div class="empty-icon">⚽</div><div>مفيش لاعبين لسه<br>ابدأ بإضافة لاعب</div></div>';
  else{
    html+='<div class="player-list">';
    for(var i=0;i<players.length;i++){
      var p=players[i];
      html+='<div class="player-card">'+
        '<div class="player-avatar" onclick="openProfile(\''+p.id+'\')">'+(p.photo?'<img src="'+p.photo+'">':'<span>👤</span>')+'</div>'+
        '<div class="player-info" onclick="openProfile(\''+p.id+'\')"><div class="player-name">'+esc(p.name)+'</div><div class="player-pos">'+esc(p.position||'لاعب')+'</div></div>'+
        '<div class="player-actions">'+
        '<button class="icon-action" onclick="openPhotoUpload(\''+p.id+'\',\'avatar\')">📷</button>'+
        '<button class="icon-action" onclick="editPlayerStats(\''+p.id+'\')">📊</button>'+
        '<button class="icon-action" onclick="openProfile(\''+p.id+'\')">👁️</button>'+
        (admin?'<button class="icon-action danger" onclick="deletePlayerCompletely(\''+p.id+'\')">🗑</button>':'')+
        '</div></div>';
    }
    html+='</div>';
  }

// ============ DELETE CASCADE ============
function deletePlayerCompletely(playerId){
  var users=getUsers();
  var currentUser=me();
  var linkedUser=null;
  for(var i=0;i<users.length;i++){
    if(users[i].playerId===playerId){linkedUser=users[i];break}
  }
  if(linkedUser&&linkedUser.isMainAdmin){
    alert('❌ لا يمكن حذف الأدمن الرئيسي');
    return false;
  }
  if(linkedUser&&currentUser&&linkedUser.id===currentUser.id){
    alert('❌ لا يمكنك حذف حسابك الخاص');
    return false;
  }
  if(!confirm('حذف اللاعب نهائيًا؟\nهيتم حذف أكونته من قايمة الصلاحيات كمان')){
    return false;
  }
  setPlayers(getPlayers().filter(function(p){return p.id!==playerId}));
  if(linkedUser){
    setUsers(users.filter(function(u){return u.id!==linkedUser.id}));
    if(getSession()===linkedUser.id){
      setSession(null);
      document.getElementById('app').classList.remove('show');
      document.getElementById('authScreen').style.display='flex';
      showView('login');
      return true;
    }
  }
  closeModal();renderAll();
  return true;
}

function deletePlayer(id){deletePlayerCompletely(id)}
function deleteFromProfile(){
  if(!currentProfileId)return;
  if(deletePlayerCompletely(currentProfileId))closeProfile();
}

var cardsTab='normal';
var legendaryIndex=0;
var legendaryPaused=false;
var legendaryPauseTimer=null;

function renderCards(){
  var el=document.getElementById('panel-1');
  if(!el)return;
  el.innerHTML='<div class="cards-subtabs">'+
    '<button class="subtabs-btn '+(cardsTab==='normal'?'active':'')+'" onclick="switchCardsTab(\'normal\')">⚡ عادية</button>'+

    '</div>'+
    '<div id="cardsNormalView" style="'+(cardsTab==='normal'?'':'display:none;')+'">'+buildNormalCardsHTML()+'</div>'+
    '<div id="cardsLegendaryView" style="'+(cardsTab==='legendary'?'':'display:none;')+'">'+buildLegendaryViewHTML()+'</div>';
  if(cardsTab==='legendary')setTimeout(updateLegendaryPositions,50);
}
function buildNormalCardsHTML(){
  var players=getPlayers();
  if(!players.length)return '<div class="empty-state"><div class="empty-icon">🎴</div><div>ضيف لاعبين الأول عشان تظهر الكروت</div></div>';
  var html='<div class="cards-toolbar"><button id="motionBtn" onclick="toggleMotion()">🎮 تشغيل الحركة</button></div>';
  html+='<div class="cards-grid-2" id="cardsGrid">';
  for(var i=0;i<players.length;i++)html+=buildNormalCardHTML(players[i]);
  html+='</div>';
  return html;
}
function buildLegendaryViewHTML(){
  var legends=getLegendary();
  var admin=isAdmin();
  var html='';
  if(admin)html+='<div class="legendary-toolbar"><button onclick="showAddLegend()">➕ إضافة كارت أسطوري</button></div>';
  if(!legends.length){
    html+='<div class="empty-state"><div class="empty-icon">👑</div><div>مفيش كروت أسطورية لسه'+(admin?'<br>اضغط "إضافة كارت أسطوري"':'')+'</div></div>';
    return html;
  }
  if(legendaryIndex>=legends.length)legendaryIndex=0;
  html+='<div class="legendary-carousel"><div class="legendary-stage" id="legendaryStage">';
  for(var i=0;i<legends.length;i++)html+=buildLegendaryCardHTML(legends[i],i);
  html+='</div></div>';
  html+='<div class="legendary-indicator" id="legendaryIndicator">'+(legendaryIndex+1)+' / '+legends.length+'</div>';
  return html;
}
function switchCardsTab(tab){cardsTab=tab;legendaryPaused=false;renderCards()}
function updateLegendaryPositions(){
  var stage=document.getElementById('legendaryStage');
  if(!stage)return;
  var cards=stage.querySelectorAll('.legendary-card');
  var total=cards.length;
  if(!total)return;
  for(var i=0;i<cards.length;i++){
    var offset=i-legendaryIndex;
    if(offset>total/2)offset-=total;
    if(offset<-total/2)offset+=total;
    var abs=Math.abs(offset);
    var card=cards[i];
    if(abs>3){card.style.opacity='0';card.style.pointerEvents='none';card.style.transform='translateX('+(offset>0?400:-400)+'px) scale(0.3)';continue}
    var translateX=offset*90,translateZ=-abs*80,scale=1-abs*0.12,rotateY=offset*-15;
    var opacity=abs===0?1:(abs===1?0.85:(abs===2?0.55:0.25));
    card.style.opacity=opacity;
    card.style.pointerEvents='auto';
    card.style.zIndex=100-abs;
    card.style.transform='translateX('+translateX+'px) translateZ('+translateZ+'px) scale('+scale+') rotateY('+rotateY+'deg)';
    card.classList.toggle('active',abs===0);
  }
  var ind=document.getElementById('legendaryIndicator');
  if(ind)ind.textContent=(legendaryIndex+1)+' / '+total;
}
function onLegendaryClick(e,i,el){
  if(e&&e.stopPropagation)e.stopPropagation();
  if(i===legendaryIndex){
    var inner=el.querySelector('.fifa-card');
    if(inner)inner.classList.toggle('flipped');
    pauseLegendaryAuto(true);
  }else{
    legendaryIndex=i;
    updateLegendaryPositions();
    pauseLegendaryAuto(false);
  }
}
function pauseLegendaryAuto(short){
  legendaryPaused=true;
  if(legendaryPauseTimer)clearTimeout(legendaryPauseTimer);
  legendaryPauseTimer=setTimeout(function(){legendaryPaused=false},short?8000:12000);
}
function toggleMotion(){
  var grid=document.getElementById('cardsGrid');
  if(!grid)return;
  grid.classList.toggle('motion');
  var btn=document.getElementById('motionBtn');
  if(btn){
    if(grid.classList.contains('motion')){btn.textContent='⏸️ إيقاف الحركة';btn.classList.add('active')}
    else{btn.textContent='🎮 تشغيل الحركة';btn.classList.remove('active')}
  }
}
function flipCard(el){
  if(!el)return;
  var card=el.classList&&el.classList.contains('fifa-card')?el:el.querySelector&&el.querySelector('.fifa-card');
  if(card)card.classList.toggle('flipped');
}

  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){alert('✓ تم النسخ')}).catch(function(){alert(text)})}

function toggleMatchLineup(){
  matchLineupExpanded=!matchLineupExpanded;
  var body=document.getElementById('lineupBody');
  var icon=document.getElementById('lineupToggleIcon');
  if(body)body.classList.toggle('open',matchLineupExpanded);
  if(icon)icon.textContent=matchLineupExpanded?'▴':'▾';
}
function toggleLineupPlayer(mid,pid,canEdit){
  if(!canEdit)return;
  var ms=getMatches();
  for(var i=0;i<ms.length;i++)if(ms[i].id===mid){
    if(!ms[i].lineup)ms[i].lineup=[];
    var idx=ms[i].lineup.indexOf(pid);
    if(idx!==-1)ms[i].lineup.splice(idx,1);
    else ms[i].lineup.push(pid);
    break;
  }
  setMatches(ms);openMatchDetail(mid);renderMatches();
}
function selectAllLineup(mid){
  var ms=getMatches();
  var ps=getPlayers();
  for(var i=0;i<ms.length;i++)if(ms[i].id===mid){
    ms[i].lineup=ps.map(function(p){return p.id});
    break;
  }
  setMatches(ms);openMatchDetail(mid);renderMatches();
}
function clearLineup(mid){
  var ms=getMatches();
  for(var i=0;i<ms.length;i++)if(ms[i].id===mid){ms[i].lineup=[];break}
  setMatches(ms);openMatchDetail(mid);renderMatches();
}
function setMatchStat(mid,field,pid,val){
  var ms=getMatches();
  for(var i=0;i<ms.length;i++)if(ms[i].id===mid){
    if(!ms[i][field])ms[i][field]={};
    ms[i][field][pid]=Math.max(0,+val||0);
    break;
  }
  setMatches(ms);
}
function setMatchAward(mid,field,pid){
  var ms=getMatches();
  for(var i=0;i<ms.length;i++)if(ms[i].id===mid){
    var m=ms[i];
    if(m[field]===pid){m[field]=null}
    else{
      m[field]=pid;
      if(field==='motm'&&m.worst===pid)m.worst=null;
      if(field==='worst'&&m.motm===pid)m.motm=null;
      if(!m.bad)m.bad=[];
      m.bad=m.bad.filter(function(x){return x!==pid});
    }
    break;
  }
  setMatches(ms);openMatchDetail(mid);
}
function toggleMatchBad(mid,pid){
  var ms=getMatches();
  for(var i=0;i<ms.length;i++)if(ms[i].id===mid){
    var m=ms[i];
    if(!m.bad)m.bad=[];
    var idx=m.bad.indexOf(pid);
    if(idx!==-1){m.bad.splice(idx,1)}
    else{
      m.bad.push(pid);
      if(m.motm===pid)m.motm=null;
      if(m.worst===pid)m.worst=null;
    }
    break;
  }
  setMatches(ms);openMatchDetail(mid);
}
function deleteMatch(id){
  if(!confirm('حذف الماتش؟'))return;
  setMatches(getMatches().filter(function(m){return m.id!==id}));
  closeModal();renderAll();
}

// ============ STATS ============
function renderStats(){
  var el=document.getElementById('panel-3');
  var players=getPlayers(),ms=getMatches();
  if(!players.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">📊</div><div>ضيف لاعبين الأول</div></div>';return}
  var agg={};
  for(var i=0;i<players.length;i++){
    var p=players[i];
    agg[p.id]={id:p.id,name:p.name,pos:p.position,photo:p.photo||'',goals:0,assists:0,matches:0,motm:0,bad:0,rsum:0,rcount:0};
  }
  for(var j=0;j<ms.length;j++){
    var m=ms[j];
    var lineup=m.lineup||[];
    if(lineup.length===0)continue;
    for(var k=0;k<lineup.length;k++){
      var pid=lineup[k];
      if(!agg[pid])continue;
      agg[pid].matches++;
      agg[pid].goals+=(m.goals||{})[pid]||0;
      agg[pid].assists+=(m.assists||{})[pid]||0;
      if((m.ratings||{})[pid]){agg[pid].rsum+=(m.ratings||{})[pid];agg[pid].rcount++}
    }
    if(m.motm&&agg[m.motm])agg[m.motm].motm++;
    var badArr=m.bad||[];
    for(var b=0;b<badArr.length;b++)if(agg[badArr[b]])agg[badArr[b]].bad++;
  }
  var arr=[];
  for(var id in agg){var a=agg[id];a.avg=a.rcount?a.rsum/a.rcount:0;arr.push(a)}

  function buildCategory(title,list,label){
    if(!list.length)return '';
    var maxVal=1;
    for(var x=0;x<list.length;x++)if(+list[x].val>maxVal)maxVal=+list[x].val;
    var h='<div class="stat-category"><div class="stat-cat-title">'+title+'</div><div class="stat-cards">';
    for(var i=0;i<list.length;i++){
      var r=list[i];
      var rankCls='';var rankCls2='';
      var rankIcon='';
      if(i===0){rankCls='rank-1';rankCls2='medal-gold';rankIcon='🥇'}
      else if(i===1){rankCls='rank-2';rankCls2='medal-silver';rankIcon='🥈'}
      else if(i===2){rankCls='rank-3';rankCls2='medal-bronze';rankIcon='🥉'}
      else{rankIcon=(i+1)}
      var pct=Math.round((+r.val/maxVal)*100);
      h+='<div class="stat-player-card '+rankCls+'">'+
        '<div class="stat-rank '+rankCls2+'">'+rankIcon+'</div>'+
        '<div class="stat-photo">'+(r.photo?'<img src="'+r.photo+'">':'👤')+'</div>'+
        '<div class="stat-info">'+
          '<div class="stat-name">'+esc(r.name)+'</div>'+
          '<div class="stat-pos">'+esc(r.pos||'لاعب')+'</div>'+
          '<div class="stat-progress"><div class="stat-progress-bar" style="width:'+pct+'%"></div></div>'+
        '</div>'+
        '<div class="stat-value-box"><div class="stat-value">'+r.val+'</div><div class="stat-value-label">'+label+'</div></div>'+
        '</div>';
    }
    return h+'</div></div>';
  }
  function srt(key,filter){
    var l=arr.slice().sort(function(a,b){return b[key]-a[key]});
    if(filter)l=l.filter(function(a){return a[key]>0});
    return l.map(function(a){return{name:a.name,pos:a.pos,photo:a.photo,val:key==='avg'?a[key].toFixed(1):a[key]}});
  }
  var html='';
  html+=buildCategory('⚽ هدافين',srt('goals',true),'أهداف');
  html+=buildCategory('🅰️ صناع',srt('assists',true),'أسيست');
  html+=buildCategory('⭐ نجوم',srt('motm',true),'مرات');
  html+=buildCategory('👎 الوحشين',srt('bad',true),'مرات');
  html+=buildCategory('🏆 أفضل تقييم',srt('avg',true),'متوسط');
  html+=buildCategory('👥 مشاركة',srt('matches',false),'ماتش');
  el.innerHTML=html||'<div class="empty-state">لسه مفيش ماتشات مسجلة</div>';
}

function saveTeamName(){
  var t=getTeam();
  var newName=document.getElementById('team_name').value.trim()||'فريق بني برزه';
  t.name=newName;
  if(!setTeam(t))return;
  var titleEl=document.getElementById('appTitle');
  if(titleEl)titleEl.textContent=newName;
  renderAdmin();
  alert('✓ تم تحديث اسم الفريق');
}
function addNotif(){
  var t=document.getElementById('n_title').value.trim();
  var b=document.getElementById('n_body').value.trim();
  if(!t)return alert('اكتب عنوان');
  var arr=getNotifs();
  arr.push({id:uid(),title:t,body:b,date:Date.now()});
  if(!setNotifs(arr))return;
  renderAdmin();
}
function changeRole(userId,role){
  var us=getUsers();
  var target=null;
  for(var i=0;i<us.length;i++)if(us[i].id===userId){target=us[i];break}
  if(!target)return;
  if(target.isMainAdmin)return alert('لا يمكن تغيير دور الأدمن الرئيسي');
  target.role=role;
  if(!setUsers(us))return;
  renderAdmin();
}

// ============ PENDING ============
function updateNotifBadge(){
  var u=me(),btn=document.getElementById('notifBtn'),badge=document.getElementById('notifBadge');
  if(!u||u.role!=='admin'){if(btn)btn.style.display='none';return}
  if(btn)btn.style.display='flex';
  var pending=getUsers().filter(function(x){return x.status==='pending'}).length;
  if(badge){if(pending>0){badge.textContent=pending;badge.style.display='flex'}else{badge.style.display='none'}}
}
function showPendingModal(){
  var pending=getUsers().filter(function(x){return x.status==='pending'});
  if(!pending.length){openModal('<h3>🔔 طلبات</h3><div class="empty-state"><div class="empty-icon">✨</div><div>مفيش طلبات</div></div>');return}
  var html='<h3>🔔 طلبات ('+pending.length+')</h3>';
  for(var i=0;i<pending.length;i++){var u=pending[i];
    html+='<div class="pending-request"><div class="pr-info"><div class="pr-name">'+esc(u.name)+'</div><div class="pr-phone">📱 '+esc(u.phone)+'</div><div class="pr-date">🎂 '+esc(u.birthDate||'—')+'</div></div><div class="pr-actions"><button class="btn-approve" onclick="approveUser(\''+u.id+'\')">✓</button><button class="btn-reject" onclick="rejectUser(\''+u.id+'\')">✗</button></div></div>';}
  openModal(html);
}
function approveUser(id){
  var us=getUsers(),u=null;
  for(var i=0;i<us.length;i++)if(us[i].id===id){u=us[i];break}
  if(!u)return;
  u.status='approved';u.role=u.role||'player';
  var ps=getPlayers(),pl=null;
  for(var j=0;j<ps.length;j++)if(ps[j].phone===u.phone){pl=ps[j];break}
  if(!pl){
    pl={id:uid(),name:u.name,position:'لاعب',phone:u.phone,birthDate:u.birthDate,photo:'',cardBackImage:'',stats:{goals:0,assists:0,matches:0,motm:0,rating:0,pace:70,shooting:70,passing:70,dribbling:70,defending:70,physical:70,skills:3,weakFoot:3,jerseyNumber:0}};
    ps.push(pl);setPlayers(ps);
  }
  u.playerId=pl.id;setUsers(us);
  closeModal();renderAll();
  alert('✓ تم قبول '+u.name);
}
function rejectUser(id){
  if(!confirm('رفض؟'))return;
  var us=getUsers();
  for(var i=0;i<us.length;i++)if(us[i].id===id){us[i].status='rejected';break}
  setUsers(us);closeModal();renderAll();
}

// ============ MODAL ============
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show');matchLineupExpanded=false}

// ============ BOOT ============
(function boot(){
  ensureMainAdmin();
  syncLoginBackground();
  var btns=document.querySelectorAll('.tab-btn');
  for(var i=0;i<btns.length;i++){
    (function(btn){btn.onclick=function(){goTab(parseInt(btn.dataset.tab,10))}})(btns[i]);
  }
  var u=me();
  if(u&&u.status==='approved')enterApp();
  else{if(u)setSession(null);showView('login')}
  setInterval(function(){var user=me();if(user&&user.role==='admin')updateNotifBadge()},15000);
  setInterval(function(){
    if(cardsTab==='legendary'&&!legendaryPaused&&currentTab===1){
      var ls=getLegendary();
      if(ls.length>1){legendaryIndex=(legendaryIndex+1)%ls.length;updateLegendaryPositions()}
    }
  },5500);
})();
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();closeProfile();closePreview()}});
</script>
