<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050a15">
<title>فريق بني برزه</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold-lt:#f5d76e;--gold-dk:#8a6d1f;--blue:#3b82f6;--blue-lt:#93c5fd;--blue-dk:#1e40af;--blue-mid:#2563eb;--bg:#050a15;--card:#0c1425;--card-2:#131d33;--text:#fff;--dim:#7a8499;--red:#e74c3c;--green:#27ae60;--border:rgba(59,130,246,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100vh;overflow:hidden;font-family:'Cairo', sans-serif;background:var(--bg);color:var(--text)}
input,select,button,textarea{font-family:inherit}

/* AUTH (Gold & Glass) */
.bg-anim{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 20% 20%,rgba(212,175,55,.18),transparent 45%),radial-gradient(ellipse at 80% 80%,rgba(212,175,55,.12),transparent 45%),linear-gradient(135deg,#000,#0a0805 50%,#000);overflow:hidden}
.ball{position:absolute;font-size:44px;opacity:.07;animation:drift 30s linear infinite}
.ball-1{top:10%;left:15%}.ball-2{top:70%;left:80%;animation-delay:-5s}.ball-3{top:30%;left:70%;animation-delay:-10s}.ball-4{top:80%;left:20%;animation-delay:-15s}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(30px,-40px) rotate(90deg)}50%{transform:translate(-20px,30px) rotate(180deg)}75%{transform:translate(40px,20px) rotate(270deg)}100%{transform:translate(0,0) rotate(360deg)}}

.auth-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.auth-bg-img{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:0;opacity:0;transition:opacity .6s ease}
.auth-bg-img.has-image{opacity:1}
.auth-bg-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.5),rgba(0,0,0,.85));z-index:1;display:none}
.auth-bg-img.has-image ~ .auth-bg-overlay{display:block}

.auth-card{position:relative;z-index:2;width:100%;max-width:400px;background:rgba(15,12,8,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(212,175,55,.35);border-radius:24px;padding:28px 22px;box-shadow:0 0 100px rgba(212,175,55,.12),0 20px 60px rgba(0,0,0,.8);transition:all .4s ease}
.auth-card.glass{background:rgba(10,10,15,.4);border-color:rgba(212,175,55,.5);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 0 50px rgba(0,0,0,.5)}

.auth-logo{display:flex;justify-content:center;margin-bottom:8px}
.logo-circle{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 40px rgba(212,175,55,.6)}
.auth-brand{text-align:center;font-size:24px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.auth-sub{text-align:center;font-size:12px;color:var(--dim);margin-bottom:22px}
.field{position:relative;margin-bottom:12px}
.field-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:17px;pointer-events:none;opacity:.8}
.field input{width:100%;padding:15px 46px 15px 14px;background:rgba(0,0,0,.4);border:1px solid rgba(212,175,55,.2);border-radius:12px;color:var(--text);font-size:14px}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
.btn-gold{position:relative;width:100%;padding:15px;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);border:none;border-radius:12px;color:#000;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px}
.auth-switch{text-align:center;font-size:13px;color:var(--dim);margin-top:18px}
.auth-switch a{color:var(--gold);font-weight:700;cursor:pointer}
.pending-icon{text-align:center;font-size:70px;margin:10px 0}
.pending-title{text-align:center;font-size:20px;font-weight:800;color:var(--gold-lt);margin-bottom:10px}
.pending-text{text-align:center;font-size:13px;color:var(--dim);line-height:1.7;margin-bottom:24px}

/* APP (Blue) */
.app{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:linear-gradient(180deg,#050912,#050a15 40%,#050912)}
.app.show{display:flex}
.app-header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,#0a1424,#0f1a30);border-bottom:2px solid var(--blue-mid);box-shadow:0 4px 24px rgba(37,99,235,.25)}
.app-logo{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#3b82f6,#1e40af);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;box-shadow:0 0 18px rgba(59,130,246,.5);flex-shrink:0}
.app-logo img{width:100%;height:100%;object-fit:cover}
.app-title{flex:1;font-size:15px;font-weight:900;letter-spacing:1px;background:linear-gradient(135deg,#93c5fd,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);color:var(--blue-lt);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}

/* TABS Gradient */
.tabs-nav{flex-shrink:0;background:#0a1424;border-bottom:1px solid rgba(59,130,246,.18);overflow-x:auto;scrollbar-width:none}
.tabs-nav::-webkit-scrollbar{display:none}
.tabs-scroll{display:flex;gap:8px;padding:12px;min-width:max-content}
.tab-btn{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);color:var(--dim);padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:700;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.tab-btn.active{background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff;border-color:transparent;box-shadow:0 4px 15px rgba(59,130,246,.4);text-shadow:0 2px 4px rgba(0,0,0,.3)}
.tab-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(to top, rgba(255,255,255,.2), transparent);opacity:0;transition:opacity .3s}
.tab-btn.active::before{opacity:1}

.tabs-container{flex:1;overflow-y:auto;overflow-x:hidden}
.tab-panel{display:none;width:100%;height:100%;overflow-y:auto;padding:16px;padding-bottom:60px}
.tab-panel.active{display:block;animation:panelIn .25s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.section-header{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;color:var(--blue-lt);margin:8px 0 14px;padding-bottom:10px;border-bottom:1px solid rgba(59,130,246,.25)}
.section-header .count{background:rgba(59,130,246,.18);color:var(--blue-lt);padding:2px 10px;border-radius:10px;font-size:12px;font-weight:700}
.empty-state{text-align:center;padding:50px 20px;color:var(--dim);font-size:14px}
.empty-icon{font-size:60px;opacity:.4;margin-bottom:12px}
.btn-purple{position:relative;width:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#1e40af);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px;box-shadow:0 4px 18px rgba(59,130,246,.35);transition:all .2s}
.btn-purple:active{transform:scale(.98)}
.btn-sm{padding:8px 12px;font-size:12px;width:auto;margin:4px 4px 4px 0;display:inline-block}
.btn-ghost{background:rgba(59,130,246,.15);color:var(--blue-lt);border:1px solid rgba(59,130,246,.35);box-shadow:none}
.btn-danger{background:rgba(231,76,60,.1);color:var(--red);border:1px solid var(--red);box-shadow:none}

/* Matches Form (Fixed Layout) */
.match-form{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
.match-form label{display:block;font-size:12px;color:var(--blue-lt);font-weight:700;margin:10px 0 4px}
.match-form input{width:100%;padding:12px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;color:#fff;font-size:14px;margin-bottom:8px}
.match-form input:focus{outline:none;border-color:var(--blue)}
.match-form .row{display:flex;gap:8px;align-items:center}
.match-form .row input{flex:1}
.match-form .vs{color:var(--dim);font-weight:900;font-size:14px;padding:0 4px}

/* Players List */
.player-list{display:flex;flex-direction:column;gap:10px}
.player-card{display:flex;align-items:center;gap:8px;padding:12px;background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.2);border-radius:16px}
.player-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#1a2a44,#050a15);border:2px solid var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
.player-avatar img{width:100%;height:100%;object-fit:cover}
.player-info{flex:1;min-width:0;cursor:pointer}
.player-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-pos{font-size:11px;color:var(--blue-lt);margin-top:2px;font-weight:600}
.player-actions{display:flex;gap:3px;flex-shrink:0}
.icon-action{width:32px;height:32px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.28);border-radius:9px;color:var(--blue-lt);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-action.danger{color:var(--red);border-color:rgba(231,76,60,.4);background:rgba(231,76,60,.08)}

/* Cards */
.cards-subtabs{display:flex;gap:6px;margin-bottom:14px;background:rgba(59,130,246,.06);padding:4px;border-radius:14px;border:1px solid rgba(59,130,246,.2)}
.subtabs-btn{flex:1;padding:10px;background:transparent;border:none;color:var(--dim);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.subtabs-btn.active{background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.4)}
.cards-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cards-toolbar button{flex:1;min-width:140px;padding:10px;background:linear-gradient(135deg,#3b82f6,#1e40af);border:none;border-radius:10px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
.cards-toolbar button.active{background:linear-gradient(135deg,#f5d76e,#d4af37);color:#000;box-shadow:0 4px 15px rgba(212,175,55,.4)}
.cards-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fifa-card-wrap{width:100%;perspective:1200px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.fifa-card-3d{position:relative;width:100%;aspect-ratio:2/3;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.9,.3,1);will-change:transform}
@keyframes cardSway{0%,100%{transform:rotateY(-8deg) rotateX(4deg) scale(1)}50%{transform:rotateY(8deg) rotateX(-4deg) scale(1.02)}}
.cards-grid-2.motion .fifa-card-3d{animation:cardSway 3s ease-in-out infinite}
.cards-grid-2.motion .fifa-card-wrap:nth-child(2n) .fifa-card-3d{animation-delay:-1.5s}
.cards-grid-2.motion .fifa-card-wrap:nth-child(3n) .fifa-card-3d{animation-delay:-1s}
.fifa-card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.2,.2,1)}
.fifa-card.flipped{transform:rotateY(180deg)}
.fifa-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;clip-path:polygon(16px 0%,calc(100% - 16px) 0%,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0% calc(100% - 16px),0% 16px);background:linear-gradient(135deg,#1e40af,#0a1428,#1e40af);box-shadow:0 8px 24px rgba(0,0,0,.7)}
.fifa-face.fifa-back{transform:rotateY(180deg)}
.fifa-content{position:absolute;inset:2px;clip-path:polygon(15px 0%,calc(100% - 15px) 0%,100% 15px,100% calc(100% - 15px),calc(100% - 15px) 100%,15px 100%,0% calc(100% - 15px),0% 15px);padding:8px;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(160deg,#0a1428,#050a15)}
.fifa-content::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);background-size:200% 100%;animation:shineSweep 4s ease-in-out infinite;pointer-events:none;z-index:6}
@keyframes shineSweep{0%{background-position:-100% 0}100%{background-position:200% 0}}

[data-tier="gold"] .fifa-face{background:linear-gradient(135deg,#f5d76e,#8a6d1f,#f5d76e)}
[data-tier="gold"] .fifa-content{background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.5),transparent 45%),linear-gradient(160deg,#b8942a,#f5d76e 18%,#d4af37 40%,#8a6d1f 60%,#d4af37 82%,#b8942a)}
[data-tier="silver"] .fifa-face{background:linear-gradient(135deg,#e8e8e8,#5a5a5a,#e8e8e8)}
[data-tier="silver"] .fifa-content{background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.6),transparent 45%),linear-gradient(160deg,#9a9a9a,#e8e8e8 18%,#c8c8c8 40%,#787878 60%,#c8c8c8 82%,#9a9a9a)}
[data-tier="bronze"] .fifa-face{background:linear-gradient(135deg,#d4a373,#4a2f15,#d4a373)}
[data-tier="bronze"] .fifa-content{background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.3),transparent 45%),linear-gradient(160deg,#7a4a20,#d4a373 18%,#b8865f 40%,#6b4423 60%,#b8865f 82%,#7a4a20)}
[data-tier="icon"] .fifa-face{background:linear-gradient(135deg,#d4af37,#000,#d4af37,#8a6d1f,#d4af37)}
[data-tier="icon"] .fifa-content{background:radial-gradient(circle at 50% 15%,rgba(212,175,55,.35),transparent 60%),linear-gradient(160deg,#0a0805,#2a1e08 25%,#000 50%,#2a1e08 75%,#0a0805)}
[data-tier="legendary"] .fifa-face{background:linear-gradient(135deg,#f5d76e 0%,#000 20%,#d4af37 40%,#000 60%,#f5d76e 80%,#8a6d1f 100%);background-size:200% 200%;animation:legendaryShift 4s ease-in-out infinite}
@keyframes legendaryShift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
[data-tier="legendary"] .fifa-content{background:radial-gradient(circle at 50% 20%,rgba(245,215,110,.2),transparent 55%),conic-gradient(from 45deg at 50% 50%,#0a0a0a 0deg,#1a1208 90deg,#0a0a0a 180deg,#1a1208 270deg,#0a0a0a 360deg)}

.fifa-expand-center{width:24px;height:24px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);border-radius:50%;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;justify-self:center;z-index:15}
.fifa-edit{position:absolute;top:44px;left:6px;width:32px;height:32px;background:rgba(59,130,246,.85);border:1px solid rgba(255,255,255,.4);border-radius:50%;color:#fff;font-size:14px;cursor:pointer;z-index:15;display:flex;align-items:center;justify-content:center;}
.fifa-del{position:absolute;top:6px;left:6px;width:32px;height:32px;background:rgba(231,76,60,.85);border:1px solid rgba(255,255,255,.4);border-radius:50%;color:#fff;font-size:14px;cursor:pointer;z-index:15;display:flex;align-items:center;justify-content:center;}

.fifa-top{display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;position:relative;z-index:2}
.fifa-rating-block{display:flex;flex-direction:column;align-items:center;padding:3px 8px;border-radius:6px;min-width:46px;flex-shrink:0}
.fifa-overall{font-size:22px;font-weight:900;line-height:1}
.fifa-position{font-size:9px;font-weight:800;margin-top:1px;letter-spacing:.5px}
[data-tier="gold"] .fifa-rating-block{background:linear-gradient(135deg,#1a1208,#2a1e08);color:#f5d76e;border:1px solid rgba(245,215,110,.5)}
[data-tier="silver"] .fifa-rating-block{background:linear-gradient(135deg,#1a1a1a,#2a2a2a);color:#e8e8e8;border:1px solid rgba(232,232,232,.45)}
[data-tier="bronze"] .fifa-rating-block{background:linear-gradient(135deg,#1a1208,#2a1e08);color:#d4a373;border:1px solid rgba(212,163,115,.5)}
[data-tier="icon"] .fifa-rating-block{background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);color:#1a1208;border:1px solid #f5d76e;box-shadow:0 0 20px rgba(245,215,110,.6)}
[data-tier="legendary"] .fifa-rating-block{background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);color:#1a1208;border:1px solid #f5d76e;box-shadow:0 0 25px rgba(245,215,110,.8)}

.fifa-photo-wrap{flex:1;display:flex;justify-content:center;align-items:flex-start;padding-top:2px}
.fifa-photo-circle{width:72px;height:72px;border-radius:50%;overflow:hidden;border:2.5px solid;box-shadow:0 4px 10px rgba(0,0,0,.4);background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:26px}
[data-tier="gold"] .fifa-photo-circle{border-color:#1a1208}
[data-tier="silver"] .fifa-photo-circle{border-color:#1a1a1a}
[data-tier="bronze"] .fifa-photo-circle{border-color:#1a1208}
[data-tier="icon"] .fifa-photo-circle{border-color:#f5d76e;box-shadow:0 0 18px rgba(245,215,110,.6)}
[data-tier="legendary"] .fifa-photo-circle{border-color:#f5d76e;box-shadow:0 0 25px rgba(245,215,110,.7)}
.fifa-photo-circle img{width:100%;height:100%;object-fit:cover}

.fifa-name-bar{margin-top:2px;margin-bottom:4px;padding:4px 8px;border-top:1px solid rgba(0,0,0,.2);border-bottom:1px solid rgba(0,0,0,.2);position:relative;z-index:2}
.fifa-name{font-size:11px;font-weight:900;text-align:center;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-tier="gold"] .fifa-name{color:#1a1208}
[data-tier="silver"] .fifa-name{color:#1a1a1a}
[data-tier="bronze"] .fifa-name{color:#1a1208}
[data-tier="icon"] .fifa-name{color:#f5d76e;text-shadow:0 0 8px rgba(245,215,110,.5)}
[data-tier="legendary"] .fifa-name{color:#f5d76e;text-shadow:0 0 10px rgba(245,215,110,.7)}

.fifa-season-stats{display:flex;gap:3px;margin-top:auto;padding:3px 0;position:relative;z-index:2;direction:ltr}
.fifa-season-stat{flex:1;text-align:center;padding:3px 2px;border-radius:4px;background:rgba(0,0,0,.2)}
.fifa-season-stat b{display:block;font-size:16px;font-weight:900;line-height:1}
.fifa-season-stat span{font-size:8px;font-weight:700;margin-top:2px;display:block;letter-spacing:.3px}
[data-tier="gold"] .fifa-season-stat b{color:#1a1208}
[data-tier="gold"] .fifa-season-stat span{color:rgba(26,18,8,.7)}
[data-tier="silver"] .fifa-season-stat b{color:#1a1a1a}
[data-tier="silver"] .fifa-season-stat span{color:rgba(26,26,26,.7)}
[data-tier="bronze"] .fifa-season-stat b{color:#1a1208}
[data-tier="bronze"] .fifa-season-stat span{color:rgba(26,18,8,.7)}
[data-tier="icon"] .fifa-season-stat{background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.2)}
[data-tier="icon"] .fifa-season-stat b{color:#f5d76e}
[data-tier="icon"] .fifa-season-stat span{color:rgba(245,215,110,.65)}
[data-tier="legendary"] .fifa-season-stat{background:rgba(245,215,110,.15);border:1px solid rgba(245,215,110,.3)}
[data-tier="legendary"] .fifa-season-stat b{color:#f5d76e}
[data-tier="legendary"] .fifa-season-stat span{color:rgba(245,215,110,.75)}

.fifa-extra{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:3px 2px 0;border-top:1px solid rgba(0,0,0,.15);font-size:9px;font-weight:800;position:relative;z-index:2;margin-top:3px;gap:4px}
.fifa-extra>:first-child{justify-self:start}
.fifa-extra>:last-child{justify-self:end}
.fifa-stars{letter-spacing:-.5px;font-size:10px}
[data-tier="gold"] .fifa-extra{color:#1a1208}
[data-tier="silver"] .fifa-extra{color:#1a1a1a}
[data-tier="bronze"] .fifa-extra{color:#1a1208}
[data-tier="icon"] .fifa-extra{color:#f5d76e}
[data-tier="legendary"] .fifa-extra{color:#f5d76e}

.info-card{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}

.perm-row{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:12px;margin-bottom:8px}

.perm-info{flex:1;min-width:0}

.pill-red{background:rgba(231,76,60,.15);color:var(--red);border-color:var(--red)}

.role-admin{background:rgba(59,130,246,.22);color:var(--blue-lt)}

function checkUserStatus(uid) {
  const userRef = doc(db, "users", uid);
  onSnapshot(userRef, async (snap) => {
    if (!snap.exists()) {
      if (currentUserPhone === "admin") { 
        await setDoc(userRef, { name: "المدير", phone: "admin", role: "admin", joinedAt: new Date().toISOString() }); 
        return;

    } else {
      $('#authScreen').style.display = 'none';

function startAppSync() {
  if (unsubscribeTeam) unsubscribeTeam();
  if (unsubscribeUsers) unsubscribeUsers();

  unsubscribeTeam = onSnapshot(teamDocRef, (snap) => {
    if (snap.exists()) {
      state = snap.data();
      state.players = state.players || []; 
      state.matches = state.matches || [];
      state.legendary = state.legendary || [];

      state.announcements = state.announcements || [];

      save();
    }
    if(currentUserPhone !== "admin") {

    updateUI();

// حساب OVR
function getPlayerData(p) {
  let goals=0, assists=0, matches=0, motm=0, worst=0, bad=0, ratingSum=0, ratingCount=0;
  state.matches.forEach(m => {
    if(m.archived) {
      if((m.lineup||[]).includes(p.id)) {
        matches++;
        goals += (m.goals||{})[p.id] || 0; 
        assists += (m.assists||{})[p.id] || 0;
        if (m.ratings && m.ratings[p.id]) { ratingSum += m.ratings[p.id]; ratingCount++; }
      }
      if (m.motm === p.id) motm++;
      if (m.worst === p.id) worst++;
      if ((m.bad||[]).includes(p.id)) bad++;
    }
  });
  const avgRating = ratingCount > 0 ? (ratingSum / ratingCount) : 0;
  return { ...p, goals, assists, matches, motm, worst, bad, avgRating };
}

function calculateOVR(p) {
  const data = getPlayerData(p);
  const stats = p.stats || { pace: 70, shooting: 70, passing: 70, dribbling: 70, defending: 70, physical: 70 };
  const statsAvg = (Number(stats.pace) + Number(stats.shooting) + Number(stats.passing) + Number(stats.dribbling) + Number(stats.defending) + Number(stats.physical)) / 6;
  let ovr = statsAvg + (data.goals * 0.1) + (data.assists * 0.05) + (data.motm * 0.25) + (data.avgRating * 0.1) - (data.bad * 0.3) - (data.worst * 0.5);
  return Math.min(99, Math.max(40, Math.round(ovr)));
}

function getCardTier(ovr) {
  if(ovr >= 99) return 'legendary';
  if(ovr >= 90) return 'icon';
  if(ovr >= 80) return 'gold';
  if(ovr >= 70) return 'silver';
  return 'bronze';
}

window.uploadPhoto = function(id) {
  if(!isAdmin) return;
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas'); const MAX = 250; let w = img.width, h = img.height;
        if(w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } }
        canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const p = state.players.find(x => x.id === id);
        if(p) { p.photo = canvas.toDataURL('image/jpeg', 0.7); await save(); }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
};

    if(!state.players.length) return view.innerHTML = '<div class="empty-state">مفيش لاعبين</div>';
    let html = `<div class="cards-toolbar"><button id="motionBtn" onclick="toggleMotion()">🎮 الحركة</button></div><div class="cards-grid-2" id="cardsGrid">`;
    state.players.forEach(p => html += buildCardHTML(p, calculateOVR(p), getCardTier(calculateOVR(p)), false, false));
    html += '</div>';
    view.innerHTML = html;
  } else {
    if(!state.legendary.length) return view.innerHTML = '<div class="empty-state">مفيش كروت أسطورية</div>';
    if(legendaryIndex >= state.legendary.length) legendaryIndex = 0;
    let html = isAdmin ? `<div class="legendary-toolbar"><button onclick="showAddLegend()">➕ إضافة كارت أسطوري</button></div>` : '';
    html += `<div class="legendary-carousel"><div class="legendary-stage" id="legendaryStage">`;
    state.legendary.forEach((p, i) => {
      html += `<div class="legendary-card" data-index="${i}" onclick="onLegendaryClick(event, ${i})">
        ${buildCardHTML(p, calculateOVR(p), 'legendary', true, false)}
      </div>`;
    });
    html += `</div></div><div class="legendary-indicator" id="legendaryIndicator">${legendaryIndex+1} / ${state.legendary.length}</div>`;
    view.innerHTML = html;
    setTimeout(updateLegendaryPositions, 50);
  }
}

window.toggleMotion = function() { 
  const grid = $('#cardsGrid');
  if(!grid) return;
  grid.classList.toggle('motion'); 
  const btn = $('#motionBtn');
  if(btn) {
    if(grid.classList.contains('motion')) { btn.classList.add('active'); btn.innerHTML = '⏸️ إيقاف'; }
    else { btn.classList.remove('active'); btn.innerHTML = '🎮 الحركة'; }
  }
};

function updateLegendaryPositions() {
  const stage = $('#legendaryStage'); if(!stage) return;
  const cards = stage.querySelectorAll('.legendary-card'); const total = cards.length;
  cards.forEach((card, i) => {
    let offset = i - legendaryIndex;
    if(offset > total/2) offset -= total;
    if(offset < -total/2) offset += total;
    const abs = Math.abs(offset);
    if(abs > 3) { card.style.opacity = '0'; card.style.pointerEvents = 'none'; return; }
    card.style.opacity = abs === 0 ? 1 : (abs === 1 ? 0.85 : 0.4);
    card.style.pointerEvents = 'auto';
    card.style.zIndex = 100 - abs;
    card.style.transform = `translateX(${offset*90}px) translateZ(${-abs*80}px) scale(${1-abs*0.12}) rotateY(${offset*-15}deg)`;
    card.classList.toggle('active', abs === 0);
  });
  const ind = $('#legendaryIndicator'); if(ind) ind.textContent = `${legendaryIndex+1} / ${total}`;
}

window.onLegendaryClick = function(e, i) {
  if(i === legendaryIndex) {
    const card = e.currentTarget.querySelector('.fifa-card'); if(card) card.classList.toggle('flipped');
    legendaryPaused = true; setTimeout(() => legendaryPaused = false, 8000);
  } else {
    legendaryIndex = i; updateLegendaryPositions();
  }
};

window.toggleLineup = async function(mid, pid, canEdit) {
  if(!canEdit) return;
  const m = state.matches.find(x => x.id === mid);
  if(m.lineup.includes(pid)) m.lineup = m.lineup.filter(x => x !== pid); else m.lineup.push(pid);
  await save(); openMatchDetail(mid);
};
window.selectAllLineup = async function(mid) { const m = state.matches.find(x=>x.id===mid); m.lineup = state.players.map(p=>p.id); await save(); openMatchDetail(mid); };
window.clearLineup = async function(mid) { const m = state.matches.find(x=>x.id===mid); m.lineup = []; await save(); openMatchDetail(mid); };
window.setStat = async function(mid, field, pid, val) { const m = state.matches.find(x=>x.id===mid); if(!m[field]) m[field]={}; m[field][pid] = +val; await save(); };
window.setAward = async function(mid, field, pid) { 
  const m = state.matches.find(x=>x.id===mid); 
  m[field] = (m[field]===pid) ? null : pid;
  if(field==='motm' && m.worst===pid) m.worst=null;
  if(field==='worst' && m.motm===pid) m.motm=null;
  m.bad = m.bad.filter(x=>x!==pid);
  await save(); openMatchDetail(mid);
};
window.toggleBad = async function(mid, pid) {
  const m = state.matches.find(x=>x.id===mid);
  if(m.bad.includes(pid)) m.bad = m.bad.filter(x=>x!==pid);
  else { m.bad.push(pid); if(m.motm===pid) m.motm=null; if(m.worst===pid) m.worst=null; }
  await save(); openMatchDetail(mid);
};
window.archiveMatch = async function(id) { if(!confirm("أرشفة الماتش؟ مش هينفع تعدل تاني")) return; const m = state.matches.find(x=>x.id===id); m.archived=true; await save(); closeModal(); };

// 4. الإحصائيات
function renderStats() {
  const el = $('#panel-3');
  if(!state.players.length) return el.innerHTML = '<div class="empty-state">ضيف لاعبين الأول</div>';
  const data = state.players.map(p => getPlayerData(p));
  
  function buildCat(title, list, label, filterZero) {
    let arr = [...list].sort((a,b) => b[label] - a[label]);
    if(filterZero) arr = arr.filter(x => x[label] > 0);
    if(!arr.length) return '';
    const max = arr[0][label] || 1;
    let h = `<div class="stat-category"><div class="stat-cat-title">${title}</div><div class="stat-cards">`;
    arr.forEach((p, i) => {
      let rCls = i===0?'rank-1':(i===1?'rank-2':(i===2?'rank-3':''));
      let rIcon = i===0?'🥇':(i===1?'🥈':(i===2?'🥉':(i+1)));
      let mCls = i===0?'medal-gold':(i===1?'medal-silver':(i===2?'medal-bronze':''));
      h += `<div class="stat-player-card ${rCls}">
        <div class="stat-rank ${mCls}">${rIcon}</div>
        <div class="stat-photo">${p.photo?`<img src="${p.photo}">`:'👤'}</div>
        <div class="stat-info"><div class="stat-name">${esc(p.name)}</div><div class="stat-pos">${p.position||'لاعب'}</div>
          <div class="stat-progress"><div class="stat-progress-bar" style="width:${(p[label]/max)*100}%"></div></div>
        </div>
        <div class="stat-value-box"><div class="stat-value">${label==='avgRating'?p[label].toFixed(1):p[label]}</div><div class="stat-value-label">${label==='avgRating'?'تقييم':(label==='matches'?'ماتش':(label==='goals'?'هدف':(label==='assists'?'أسيست':(label==='motm'?'⭐':'👎'))))}</div></div>
      </div>`;
    });
    return h + '</div></div>';
  }

  let html = '';
  html += buildCat('⚽ هدافين', data, 'goals', true);
  html += buildCat('🅰️ صناع', data, 'assists', true);
  html += buildCat('⭐ نجوم', data, 'motm', true);
  html += buildCat('👎 الوحشين', data, 'bad', true);
  html += buildCat('👥 مشاركة', data, 'matches', false);
  el.innerHTML = html;
}

      <div class="admin-logo-row">
        <div class="admin-logo-preview">${state.team.logo?`<img src="${state.team.logo}">`:'⚽'}</div>
        <div class="admin-logo-info"><input id="teamNameInput" value="${esc(state.team.name)}"><button class="btn-purple btn-sm" onclick="saveTeamName()">حفظ الاسم</button><button class="btn-purple btn-sm btn-ghost" onclick="uploadLogo()">📤 رفع شعار</button></div>
      </div>
    </div></div>
    
    <div class="admin-section"><div class="admin-section-header"><div class="admin-section-icon">🖼️</div><div class="admin-section-title">خلفية شاشة الدخول</div></div>
    <div class="admin-card"><div class="admin-bg-preview" style="${state.team.loginBg?`background-image:url(${state.team.loginBg})`:''}">${!state.team.loginBg?'مفيش خلفية':''}</div>
    <div class="admin-bg-actions"><button class="btn-purple" onclick="uploadLoginBg()">📤 تغيير</button><button class="btn-purple btn-danger" onclick="removeLoginBg()">🗑 إزالة</button></div>
    </div></div>

    <div class="admin-section"><div class="admin-section-header"><div class="admin-section-icon">🔔</div><div class="admin-section-title">إشعارات الفريق</div></div>
    <div class="admin-card"><input id="notifTitle" placeholder="عنوان" style="width:100%;padding:12px;background:rgba(0,0,0,.4);border:1px solid rgba(59,130,246,.25);border-radius:10px;color:#fff;margin-bottom:8px"><button class="btn-purple" onclick="addNotif()">إرسال</button></div></div>

    <div class="admin-section"><div class="admin-section-header"><div class="admin-section-icon">📨</div><div class="admin-section-title">طلبات الانضمام (${pendingUsers.length})</div></div>
    <div class="admin-card">`;
  if(!pendingUsers.length) html += `<div style="text-align:center;color:var(--dim);font-size:12px;padding:12px">مفيش طلبات</div>`;
  else pendingUsers.forEach(u => {
    html += `<div class="pending-request"><div class="pr-info"><div class="pr-name">${esc(u.name)}</div><div class="pr-phone">📱 ${esc(u.phone)}</div><div class="pr-date">🎂 ${esc(u.dob)}</div></div><div class="pr-actions"><button class="btn-approve" onclick="approveUser('${u.uid}')">✓</button><button class="btn-reject" onclick="rejectUser('${u.uid}')">✗</button></div></div>`;
  });
  html += `</div></div>

    <div class="admin-section"><div class="admin-section-header"><div class="admin-section-icon">👑</div><div class="admin-section-title">الصلاحيات (${approvedUsers.length})</div></div>
    <div class="admin-card">`;
  approvedUsers.forEach(u => {
    const isMain = u.phone === 'admin';
    html += `<div class="perm-row ${isMain?'main':''}"><div class="perm-info"><div class="perm-name">${esc(u.name)} ${isMain?'👑':''}</div><div class="perm-meta"><span class="perm-role ${isMain?'role-main':'role-'+u.role}">${isMain?'الأدمن الرئيسي':(u.role==='coach'?'مدير فني':(u.role==='supervisor'?'مشرف':'لاعب'))}</span><span>${esc(u.phone)}</span></div></div>`;
    if(isMain) html += `<div class="perm-lock">🔒</div>`;
    else html += `<select onchange="changeRole('${u.uid}', this.value)" style="width:auto;padding:6px;font-size:11px;background:rgba(0,0,0,.5);border:1px solid rgba(59,130,246,.35);border-radius:8px;color:#fff"><option value="player" ${u.role==='player'?'selected':''}>لاعب</option><option value="coach" ${u.role==='coach'?'selected':''}>مدير فني</option><option value="supervisor" ${u.role==='supervisor'?'selected':''}>مشرف</option></select>`;
    html += `</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
}

window.saveTeamName = async function() { state.team.name = $('#teamNameInput').value || 'فريق بني برزه'; await save(); updateUI(); };
window.uploadLogo = function() {
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas'); const MAX = 200; let w = img.width, h = img.height;
        if(w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } }
        canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        state.team.logo = canvas.toDataURL('image/jpeg', 0.8); await save(); updateUI();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
};
window.uploadLoginBg = function() {
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas'); const MAX = 800; let w = img.width, h = img.height;
        if(w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } }
        canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        state.team.loginBg = canvas.toDataURL('image/jpeg', 0.6); await save();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
};
window.removeLoginBg = async function() { state.team.loginBg = ""; await save(); };
window.addNotif = async function() { const t = $('#notifTitle').value; if(!t) return; state.notifs.push({id:uid(), text:t, date:new Date().toISOString()}); await save(); alert('تم'); };

window.approveUser = async function(uid) {
  if(!isAdmin) return;
  const snap = await getDoc(doc(db, "users", uid));
  if(snap.exists()) {
    const data = snap.data();
    const exists = state.players.find(p => p.name === data.name && p.phone === data.phone);
    if(!exists) {
      state.players.push({ id: uid, name: data.name, phone: data.phone, position: 'لاعب', photo: '', stats: { pace:70, shooting:70, passing:70, dribbling:70, defending:70, physical:70 } });
      await save();
    }
  }
  await updateDoc(doc(db, "users", uid), { role: 'player' });
  closeModal();
};
window.rejectUser = async function(uid) { await updateDoc(doc(db, "users", uid), { role: 'rejected' }); closeModal(); };
window.changeRole = async function(uid, role) { await updateDoc(doc(db, "users", uid), { role: role }); };

// المودال
window.openModal = function(html) { $('#modalContent').innerHTML = html; $('#modalBg').classList.add('show'); };
window.closeModal = function() { $('#modalBg').classList.remove('show'); };

// التهيئة الأولى
window.showView('login');
</script>
</body>
</html>
