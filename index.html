<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050a15">
<title>فريق بني برزة</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold-lt:#f5d76e;--gold-dk:#8a6d1f;--blue:#3b82f6;--blue-lt:#93c5fd;--blue-dk:#1e40af;--blue-mid:#2563eb;--bg:#050a15;--card:#0c1425;--card-2:#131d33;--text:#fff;--dim:#7a8499;--red:#e74c3c;--green:#27ae60;--border:rgba(59,130,246,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100vh;overflow:hidden;font-family:'Cairo', sans-serif;background:var(--bg);color:var(--text)}
input,select,button,textarea{font-family:inherit}

/* AUTH - Performance optimized (no blur) */
.bg-anim{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 20% 20%,rgba(212,175,55,.18),transparent 45%),radial-gradient(ellipse at 80% 80%,rgba(212,175,55,.12),transparent 45%),linear-gradient(135deg,#000,#0a0805 50%,#000);overflow:hidden}
.ball{position:absolute;font-size:44px;opacity:.07;animation:drift 30s linear infinite}
.ball-1{top:10%;left:15%}.ball-2{top:70%;left:80%;animation-delay:-5s}.ball-3{top:30%;left:70%;animation-delay:-10s}.ball-4{top:80%;left:20%;animation-delay:-15s}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(30px,-40px) rotate(90deg)}50%{transform:translate(-20px,30px) rotate(180deg)}75%{transform:translate(40px,20px) rotate(270deg)}100%{transform:translate(0,0) rotate(360deg)}}

.auth-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.auth-bg-img{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:0;opacity:0;transition:opacity .6s ease}
.auth-bg-img.has-image{opacity:1}
.auth-bg-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.5),rgba(0,0,0,.85));z-index:1;display:none}
.auth-bg-img.has-image ~ .auth-bg-overlay{display:block}
.auth-card{position:relative;z-index:2;width:100%;max-width:400px;background:rgba(15,12,8,.95);border:1px solid rgba(212,175,55,.35);border-radius:24px;padding:28px 22px;box-shadow:0 0 100px rgba(212,175,55,.12),0 20px 60px rgba(0,0,0,.8);transition:all .4s ease}
.auth-card.glass{background:rgba(10,10,15,.95);border-color:rgba(212,175,55,.5);box-shadow:0 0 50px rgba(0,0,0,.5)}
.auth-logo{display:flex;justify-content:center;margin-bottom:8px}
.logo-circle{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 40px rgba(212,175,55,.6)}
.auth-brand{text-align:center;font-size:24px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.auth-sub{text-align:center;font-size:12px;color:var(--dim);margin-bottom:22px}
.field{position:relative;margin-bottom:12px}
.field-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:17px;pointer-events:none;opacity:.8}
.field input{width:100%;padding:15px 46px 15px 14px;background:rgba(0,0,0,.4);border:1px solid rgba(212,175,55,.2);border-radius:12px;color:var(--text);font-size:14px}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
.btn-gold{position:relative;width:100%;padding:15px;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);border:none;border-radius:12px;color:#000;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px}
.auth-switch{text-align:center;font-size:13px;color:var(--dim);margin-top:18px}
.auth-switch a{color:var(--gold);font-weight:700;cursor:pointer}
.pending-icon{text-align:center;font-size:70px;margin:10px 0}
.pending-title{text-align:center;font-size:20px;font-weight:800;color:var(--gold-lt);margin-bottom:10px}
.pending-text{text-align:center;font-size:13px;color:var(--dim);line-height:1.7;margin-bottom:24px}

/* APP */
.app{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:linear-gradient(180deg,#050912,#050a15 40%,#050912)}
.app.show{display:flex}
.app-header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,#0a1424,#0f1a30);border-bottom:2px solid var(--blue-mid);box-shadow:0 4px 24px rgba(37,99,235,.25)}
.app-logo{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#3b82f6,#1e40af);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;box-shadow:0 0 18px rgba(59,130,246,.5);flex-shrink:0}
.app-logo img{width:100%;height:100%;object-fit:cover}
.app-title{flex:1;font-size:15px;font-weight:900;letter-spacing:1px;background:linear-gradient(135deg,#93c5fd,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);color:var(--blue-lt);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}

/* TABS */
.tabs-nav{flex-shrink:0;background:#0a1424;border-bottom:1px solid rgba(59,130,246,.18);overflow-x:auto;scrollbar-width:none}
.tabs-nav::-webkit-scrollbar{display:none}
.tabs-scroll{display:flex;gap:8px;padding:12px;min-width:max-content}
.tab-btn{background:transparent;border:1px solid var(--border);color:var(--dim);padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:700;transition:all .3s}
.tab-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6;box-shadow:0 0 15px rgba(59,130,246,.5);text-shadow:0 1px 2px rgba(0,0,0,.5)}

.tabs-container{flex:1;overflow-y:auto;overflow-x:hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch;}
.tab-panel{display:none;width:100%;height:100%;overflow-y:auto;padding:16px;padding-bottom:60px}
.tab-panel.active{display:block;animation:panelIn .25s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.section-header{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;color:var(--blue-lt);margin:8px 0 14px;padding-bottom:10px;border-bottom:1px solid rgba(59,130,246,.25)}
.section-header .count{background:rgba(59,130,246,.18);color:var(--blue-lt);padding:2px 10px;border-radius:10px;font-size:12px;font-weight:700}
.empty-state{text-align:center;padding:50px 20px;color:var(--dim);font-size:14px}
.empty-icon{font-size:60px;opacity:.4;margin-bottom:12px}
.btn-purple{position:relative;width:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#1e40af);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px;box-shadow:0 4px 18px rgba(59,130,246,.35);transition:all .2s}
.btn-purple:active{transform:scale(.98)}
.btn-sm{padding:8px 12px;font-size:12px;width:auto;margin:4px 4px 4px 0;display:inline-block}
.btn-ghost{background:rgba(59,130,246,.15);color:var(--blue-lt);border:1px solid rgba(59,130,246,.35);box-shadow:none}
.btn-danger{background:rgba(231,76,60,.1);color:var(--red);border:1px solid var(--red);box-shadow:none}

/* Matches Form */
.match-form{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
.match-form label{display:block;font-size:12px;color:var(--blue-lt);font-weight:700;margin:10px 0 4px}
.match-form input{width:100%;padding:12px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;color:#fff;font-size:14px;margin-bottom:8px}
.match-form .row{display:flex;gap:8px;align-items:center}
.match-form .row input{flex:1}
.match-form .vs{color:var(--dim);font-weight:900;font-size:14px;padding:0 4px}

/* Countdown */
.countdown-box{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;text-align:center;}
.countdown-title{font-size:14px;color:var(--blue-lt);font-weight:800;margin-bottom:10px;}
.countdown-timer{display:flex;justify-content:center;gap:10px;direction:ltr;}
.cd-item{background:rgba(0,0,0,0.5);border:1px solid var(--border);padding:8px 12px;border-radius:10px;min-width:60px;}
.cd-val{font-size:22px;font-weight:900;color:#fff;line-height:1;}
.cd-label{font-size:10px;color:var(--dim);margin-top:4px;font-weight:700;}

/* Motivation Banner */
.motivation-banner{background:linear-gradient(135deg, rgba(212,175,55,0.2), rgba(0,0,0,0.6));border:1px solid var(--gold);border-radius:12px;padding:12px;margin-bottom:16px;text-align:center;font-size:14px;font-weight:800;color:var(--gold-lt);box-shadow:0 0 15px rgba(212,175,55,0.2);}

/* Players List */
.player-list{display:flex;flex-direction:column;gap:10px}
.player-card{display:flex;align-items:center;gap:8px;padding:12px;background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.2);border-radius:16px}
.player-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#1a2a44,#050a15);border:2px solid var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;position:relative}
.player-avatar img{width:100%;height:100%;object-fit:cover}
.player-info{flex:1;min-width:0;cursor:pointer}
.player-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-pos{font-size:11px;color:var(--blue-lt);margin-top:2px;font-weight:600}
.player-actions{display:flex;gap:3px;flex-shrink:0}
.icon-action{width:32px;height:32px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.28);border-radius:9px;color:var(--blue-lt);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-action.danger{color:var(--red);border-color:rgba(231,76,60,.4);background:rgba(231,76,60,.08)}

/* Stars */
.star-badge{position:absolute; top:-8px; right:-8px; font-size:16px; filter:drop-shadow(0 0 5px rgba(212,175,55,0.8)); z-index:5;}
.star-aura{border-color: #d4af37 !important; box-shadow: 0 0 20px rgba(212,175,55,0.6) !important;}

/* ✨ NEW: Joker Badge */
.joker-badge-card{position:absolute;top:-9px;left:4px;font-size:9px;background:linear-gradient(135deg,#f5d76e,#d4af37);color:#000;border-radius:6px;padding:2px 6px;font-weight:900;z-index:3;box-shadow:0 0 10px rgba(212,175,55,.7);letter-spacing:.5px;}

/* Cards */
.cards-subtabs{display:flex;gap:6px;margin-bottom:14px;background:rgba(59,130,246,.06);padding:4px;border-radius:14px;border:1px solid rgba(59,130,246,.2)}
.subtabs-btn{flex:1;padding:10px;background:transparent;border:none;color:var(--dim);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.subtabs-btn.active{background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.4)}
.cards-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cards-toolbar button{flex:1;min-width:140px;padding:10px;background:linear-gradient(135deg,#3b82f6,#1e40af);border:none;border-radius:10px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
.cards-toolbar button.active{background:linear-gradient(135deg,#f5d76e,#d4af37);color:#000;box-shadow:0 4px 15px rgba(212,175,55,.4)}
.cards-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fifa-card-wrap{width:100%;perspective:1200px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.fifa-card-3d{position:relative;width:100%;aspect-ratio:2/3;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.9,.3,1);will-change:transform}
@keyframes cardSway{0%,100%{transform:rotateY(-8deg) rotateX(4deg) scale(1)}50%{transform:rotateY(8deg) rotateX(-4deg) scale(1.02)}}
.cards-grid-2.motion .fifa-card-3d{animation:cardSway 3s ease-in-out infinite}
.cards-grid-2.motion .fifa-card-wrap:nth-child(2n) .fifa-card-3d{animation-delay:-1.5s}
.cards-grid-2.motion .fifa-card-wrap:nth-child(3n) .fifa-card-3d{animation-delay:-1s}
.fifa-card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.2,.2,1)}
.fifa-card.flipped{transform:rotateY(180deg)}
.fifa-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;clip-path:polygon(16px 0%,calc(100% - 16px) 0%,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0% calc(100% - 16px),0% 16px);background:linear-gradient(135deg,#1e40af,#0a1428,#1e40af);box-shadow:0 8px 24px rgba(0,0,0,.7)}
.fifa-face.fifa-back{transform:rotateY(180deg)}
.fifa-content{position:absolute;inset:2px;clip-path:polygon(15px 0%,calc(100% - 15px) 0%,100% 15px,100% calc(100% - 15px),calc(100% - 15px) 100%,15px 100%,0% calc(100% - 15px),0% 15px);padding:8px;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(160deg,#0a1428,#050a15)}
.fifa-content::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);background-size:200% 100%;animation:shineSweep 4s ease-in-out infinite;pointer-events:none;z-index:6}
@keyframes shineSweep{0%{background-position:-100% 0}100%{background-position:200% 0}}

[data-tier="gold"] .fifa-face{background:linear-gradient(135deg,#f5d76e,#8a6d1f,#f5d76e)}
[data-tier="gold"] .fifa-content{background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.5),transparent 45%),linear-gradient(160deg,#b8942a,#f5d76e 18%,#d4af37 40%,#8a6d1f 60%,#d4af37 82%,#b8942a)}
[data-tier="silver"] .fifa-face{background:linear-gradient(135deg,#e8e8e8,#5a5a5a,#e8e8e8)}
[data-tier="silver"] .fifa-content{background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.6),transparent 45%),linear-gradient(160deg,#9a9a9a,#e8e8e8 18%,#c8c8c8 40%,#787878 60%,#c8c8c8 82%,#9a9a9a)}
[data-tier="bronze"] .fifa-face{background:linear-gradient(135deg,#d4a373,#4a2f15,#d4a373)}
[data-tier="bronze"] .fifa-content{background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.3),transparent 45%),linear-gradient(160deg,#7a4a20,#d4a373 18%,#b8865f 40%,#6b4423 60%,#b8865f 82%,#7a4a20)}
[data-tier="icon"] .fifa-face{background:linear-gradient(135deg,#d4af37,#000,#d4af37,#8a6d1f,#d4af37)}
[data-tier="icon"] .fifa-content{background:radial-gradient(circle at 50% 15%,rgba(212,175,55,.35),transparent 60%),linear-gradient(160deg,#0a0805,#2a1e08 25%,#000 50%,#2a1e08 75%,#0a0805)}
[data-tier="legendary"] .fifa-face{background:linear-gradient(135deg,#f5d76e 0%,#000 20%,#d4af37 40%,#000 60%,#f5d76e 80%,#8a6d1f 100%);background-size:200% 200%;animation:legendaryShift 4s ease-in-out infinite}
@keyframes legendaryShift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
[data-tier="legendary"] .fifa-content{background:radial-gradient(circle at 50% 20%,rgba(245,215,110,.2),transparent 55%),conic-gradient(from 45deg at 50% 50%,#0a0a0a 0deg,#1a1208 90deg,#0a0a0a 180deg,#1a1208 270deg,#0a0a0a 360deg)}

.fifa-expand-center{width:24px;height:24px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);border-radius:50%;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;justify-self:center;z-index:15}
.fifa-edit{position:absolute;top:44px;left:6px;width:32px;height:32px;background:rgba(59,130,246,.85);border:1px solid rgba(255,255,255,.4);border-radius:50%;color:#fff;font-size:14px;cursor:pointer;z-index:15;display:flex;align-items:center;justify-content:center;}
.fifa-del{position:absolute;top:6px;left:6px;width:32px;height:32px;background:rgba(231,76,60,.85);border:1px solid rgba(255,255,255,.4);border-radius:50%;color:#fff;font-size:14px;cursor:pointer;z-index:15;display:flex;align-items:center;justify-content:center;}

.fifa-top{display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;position:relative;z-index:2}
.fifa-rating-block{display:flex;flex-direction:column;align-items:center;padding:3px 8px;border-radius:6px;min-width:46px;flex-shrink:0}
.fifa-overall{font-size:22px;font-weight:900;line-height:1}
.fifa-position{font-size:9px;font-weight:800;margin-top:1px;letter-spacing:.5px}
[data-tier="gold"] .fifa-rating-block{background:linear-gradient(135deg,#1a1208,#2a1e08);color:#f5d76e;border:1px solid rgba(245,215,110,.5)}
[data-tier="silver"] .fifa-rating-block{background:linear-gradient(135deg,#1a1a1a,#2a2a2a);color:#e8e8e8;border:1px solid rgba(232,232,232,.45)}
[data-tier="bronze"] .fifa-rating-block{background:linear-gradient(135deg,#1a1208,#2a1e08);color:#d4a373;border:1px solid rgba(212,163,115,.5)}
[data-tier="icon"] .fifa-rating-block{background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);color:#1a1208;border:1px solid #f5d76e;box-shadow:0 0 20px rgba(245,215,110,.6)}
[data-tier="legendary"] .fifa-rating-block{background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);color:#1a1208;border:1px solid #f5d76e;box-shadow:0 0 25px rgba(245,215,110,.8)}

.fifa-photo-wrap{flex:1;display:flex;justify-content:center;align-items:flex-start;padding-top:2px;position:relative;}
.fifa-photo-circle{width:72px;height:72px;border-radius:50%;overflow:hidden;border:2.5px solid;box-shadow:0 4px 10px rgba(0,0,0,.4);background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:26px}
[data-tier="gold"] .fifa-photo-circle{border-color:#1a1208}
[data-tier="silver"] .fifa-photo-circle{border-color:#1a1a1a}
[data-tier="bronze"] .fifa-photo-circle{border-color:#1a1208}
[data-tier="icon"] .fifa-photo-circle{border-color:#f5d76e;box-shadow:0 0 18px rgba(245,215,110,.6)}
[data-tier="legendary"] .fifa-photo-circle{border-color:#f5d76e;box-shadow:0 0 25px rgba(245,215,110,.7)}
.fifa-photo-circle img{width:100%;height:100%;object-fit:cover}

.fifa-name-bar{margin-top:2px;margin-bottom:4px;padding:4px 8px;border-top:1px solid rgba(0,0,0,.2);border-bottom:1px solid rgba(0,0,0,.2);position:relative;z-index:2}
.fifa-name{font-size:11px;font-weight:900;text-align:center;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-tier="gold"] .fifa-name{color:#1a1208}
[data-tier="silver"] .fifa-name{color:#1a1a1a}
[data-tier="bronze"] .fifa-name{color:#1a1208}
[data-tier="icon"] .fifa-name{color:#f5d76e;text-shadow:0 0 8px rgba(245,215,110,.5)}
[data-tier="legendary"] .fifa-name{color:#f5d76e;text-shadow:0 0 10px rgba(245,215,110,.7)}

.fifa-season-stats{display:flex;gap:3px;margin-top:auto;padding:3px 0;position:relative;z-index:2;direction:ltr}
.fifa-season-stat{flex:1;text-align:center;padding:3px 2px;border-radius:4px;background:rgba(0,0,0,.2)}
.fifa-season-stat b{display:block;font-size:16px;font-weight:900;line-height:1}
.fifa-season-stat span{font-size:8px;font-weight:700;margin-top:2px;display:block;letter-spacing:.3px}
[data-tier="gold"] .fifa-season-stat b{color:#1a1208}
[data-tier="gold"] .fifa-season-stat span{color:rgba(26,18,8,.7)}
[data-tier="silver"] .fifa-season-stat b{color:#1a1a1a}
[data-tier="silver"] .fifa-season-stat span{color:rgba(26,26,26,.7)}
[data-tier="bronze"] .fifa-season-stat b{color:#1a1208}
[data-tier="bronze"] .fifa-season-stat span{color:rgba(26,18,8,.7)}
[data-tier="icon"] .fifa-season-stat{background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.2)}
[data-tier="icon"] .fifa-season-stat b{color:#f5d76e}
[data-tier="icon"] .fifa-season-stat span{color:rgba(245,215,110,.65)}
[data-tier="legendary"] .fifa-season-stat{background:rgba(245,215,110,.15);border:1px solid rgba(245,215,110,.3)}
[data-tier="legendary"] .fifa-season-stat b{color:#f5d76e}
[data-tier="legendary"] .fifa-season-stat span{color:rgba(245,215,110,.75)}

.fifa-extra{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:3px 2px 0;border-top:1px solid rgba(0,0,0,.15);font-size:9px;font-weight:800;position:relative;z-index:2;margin-top:3px;gap:4px}
.fifa-extra>:first-child{justify-self:start}
.fifa-extra>:last-child{justify-self:end}
.fifa-stars{letter-spacing:-.5px;font-size:10px}
[data-tier="gold"] .fifa-extra{color:#1a1208}
[data-tier="silver"] .fifa-extra{color:#1a1a1a}
[data-tier="bronze"] .fifa-extra{color:#1a1208}
[data-tier="icon"] .fifa-extra{color:#f5d76e}
[data-tier="legendary"] .fifa-extra{color:#f5d76e}

.fifa-back-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,9,25,.3),rgba(10,6,18,.85));z-index:0}
.fifa-back-top{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:3}
.fifa-back-btn{width:30px;height:30px;background:rgba(0,0,0,.7);border:1px solid var(--blue);border-radius:50%;color:var(--blue-lt);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.fifa-full-stats{position:relative;z-index:2;padding:44px 8px 8px;margin-top:auto}
.fifa-full-stats .fifa-stat-row{display:flex;gap:4px;margin-bottom:4px}
.fifa-full-stats .fifa-stat{flex:1;text-align:center;padding:5px 2px;border-radius:5px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
.fifa-full-stats .fifa-stat b{display:block;font-size:15px;font-weight:900;line-height:1;color:#fff}
.fifa-full-stats .fifa-stat span{font-size:7px;font-weight:700;margin-top:2px;display:block;letter-spacing:.3px;color:rgba(255,255,255,.7)}
.fifa-back-content{padding:8px;position:relative;z-index:2;text-align:center;background:linear-gradient(180deg,transparent,rgba(0,0,0,.6))}
.fifa-back-ovr{font-size:26px;font-weight:900;color:var(--blue-lt);line-height:1;text-shadow:0 2px 12px rgba(59,130,246,.7)}
.fifa-back-name{font-size:13px;font-weight:900;color:#fff;margin-top:3px;letter-spacing:.6px;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.fifa-back-pos{font-size:10px;color:var(--blue-lt);margin-top:2px;letter-spacing:2px;font-weight:700;opacity:.85}

.legendary-toolbar{display:flex;gap:8px;margin-bottom:10px}
.legendary-toolbar button{flex:1;padding:10px;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);border:none;border-radius:10px;color:#000;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 3px 14px rgba(212,175,55,.4)}
.legendary-carousel{position:relative;height:400px;perspective:1400px;overflow:hidden;margin:0 -16px;padding:0 16px}
.legendary-stage{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.legendary-card{position:absolute;left:50%;top:50%;width:200px;height:300px;margin-left:-100px;margin-top:-150px;transition:all .7s cubic-bezier(.2,.9,.3,1);cursor:pointer;transform-origin:center center}
.legendary-card .fifa-card-wrap{width:100%;height:100%;perspective:none}
.legendary-card .fifa-card-3d{width:100%;height:100%;aspect-ratio:auto}
.legendary-card .fifa-card{width:100%;height:100%}
.legendary-card.active .fifa-card-3d{animation:legendFloat 3s ease-in-out infinite}
@keyframes legendFloat{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}
.legendary-indicator{text-align:center;color:var(--gold-lt);font-size:12px;font-weight:700;margin-top:10px;letter-spacing:2px}

/* HALL OF FAME */
.hall-bg{background:radial-gradient(circle at top, #1a1508 0%, #050a15 100%);min-height:100%;padding:10px;position:relative;overflow:hidden;}
.hall-bg::before{content:'';position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20px 30px, #fff, transparent),radial-gradient(1.5px 1.5px at 40px 70px, rgba(212,175,55,0.8), transparent),radial-gradient(1px 1px at 90px 40px, #fff, transparent),radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.8), transparent);background-repeat:repeat;background-size:200px 200px;opacity:0.3;animation:starDrift 60s linear infinite;z-index:0;pointer-events:none;}
@keyframes starDrift{from{background-position:0 0}to{background-position:-200px -200px}}
.marquee-container{position:relative;z-index:1;overflow:hidden;white-space:nowrap;width:100%;background:rgba(212,175,55,0.1);border-radius:10px;padding:10px 0;margin-bottom:25px;border:1px solid rgba(212,175,55,0.3);box-shadow:0 0 15px rgba(212,175,55,0.2);}
.marquee-text{display:inline-block;padding-left:100%;animation:marquee 35s linear infinite;color:var(--gold);font-weight:900;font-size:14px;text-shadow:0 0 10px rgba(212,175,55,0.5);}
@keyframes marquee{0%{transform:translate(0,0)}100%{transform:translate(-100%,0)}}
.hall-title{position:relative;z-index:1;text-align:center;font-size:24px;font-weight:900;color:var(--gold);text-shadow:0 0 15px rgba(212,175,55,0.5);margin-bottom:20px;letter-spacing:2px;}
.star-month-banner{position:relative;z-index:1;background:linear-gradient(135deg, rgba(212,175,55,0.2), rgba(0,0,0,0.8));border:1px solid var(--gold);border-radius:20px;padding:20px;text-align:center;margin-bottom:30px;overflow:hidden;}
.star-month-banner::before{content:'✨';position:absolute;top:10px;left:10px;font-size:20px;opacity:0.5;animation:pulseStar 2s infinite;}
.star-month-banner::after{content:'✨';position:absolute;bottom:10px;right:10px;font-size:20px;opacity:0.5;animation:pulseStar 2s infinite;}
@keyframes pulseStar{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.3);opacity:1}}
.month-title{font-size:12px;color:var(--gold-lt);font-weight:800;letter-spacing:2px;margin-bottom:10px;}
.month-star-img{width:100px;height:100px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 30px rgba(212,175,55,0.8);margin:0 auto 10px;object-fit:cover;}
.month-star-name{font-size:20px;font-weight:900;color:#fff;}
.month-star-count{display:inline-block;background:var(--gold);color:#000;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:900;margin-top:5px;}

.podium-container{position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-bottom:30px;}
.podium{display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg, rgba(255,255,255,0.1), rgba(0,0,0,0.5));border-radius:15px 15px 0 0;padding:10px;border:1px solid rgba(255,255,255,0.1);position:relative;opacity:0;transform:translateY(50px);}
.podium.p1{height:170px;width:100px;border-color:var(--gold);background:linear-gradient(180deg, rgba(212,175,55,0.3), rgba(0,0,0,0.8));z-index:3;box-shadow:0 0 30px rgba(212,175,55,0.4);animation:riseUp 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) forwards 0.5s;}
.podium.p2{height:130px;width:90px;z-index:2;border-color:#c0c0c0;animation:riseUp 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) forwards 1s;}
.podium.p3{height:110px;width:90px;z-index:1;border-color:#cd7f32;animation:riseUp 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) forwards 1.5s;}
@keyframes riseUp{to{opacity:1;transform:translateY(0)}}
.podium-avatar{width:60px;height:60px;border-radius:50%;border:2px solid #fff;position:absolute;top:-30px;left:50%;transform:translateX(-50%);object-fit:cover;background:#000;}
.p1 .podium-avatar{width:80px;height:80px;top:-40px;border-color:var(--gold);animation:pulseGlow 2s infinite alternate;}
@keyframes pulseGlow{from{box-shadow:0 0 10px rgba(212,175,55,0.5)}to{box-shadow:0 0 30px rgba(212,175,55,1), 0 0 15px rgba(255,255,255,0.5)}}
.podium-name{font-size:12px;font-weight:800;color:#fff;text-align:center;margin-top:35px;line-height:1.2;}
.p1 .podium-name{font-size:14px;margin-top:45px;}
.podium-stars{font-size:11px;color:var(--gold);font-weight:900;margin-top:5px;background:rgba(0,0,0,0.5);padding:2px 6px;border-radius:10px;}
.crown-p1{position:absolute;top:-55px;left:50%;transform:translateX(-50%);font-size:30px;filter:drop-shadow(0 0 10px gold);animation:floatCrown 3s ease-in-out infinite;}
@keyframes floatCrown{0%,100%{transform:translate(-50%, -5px)}50%{transform:translate(-50%, 5px)}}

.hall-list{position:relative;z-index:1;background:rgba(0,0,0,0.4);border-radius:15px;border:1px solid rgba(255,255,255,0.1);overflow:hidden;}
.hall-row{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid rgba(255,255,255,0.05);}
.hall-row:last-child{border:none;}
.hall-rank{font-size:14px;font-weight:900;color:var(--dim);width:25px;}
.hall-avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);object-fit:cover;}
.hall-name{flex:1;font-size:14px;font-weight:800;color:#fff;}
.hall-count{font-size:14px;font-weight:900;color:var(--gold);}

.sparkle{position:fixed;pointer-events:none;font-size:24px;z-index:9999;animation:sparkleFly 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;}
@keyframes sparkleFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}

/* Modals, Board, Comments */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:linear-gradient(135deg,#0d1728,#141e30);border:1px solid rgba(59,130,246,.4);border-radius:20px;padding:22px;width:100%;max-width:460px;max-height:85vh;overflow-y:auto}
.modal h3{color:var(--blue-lt);font-size:18px;font-weight:800;text-align:center;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid rgba(59,130,246,.25)}
.modal input,.modal select,.modal textarea{width:100%;padding:12px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;margin-bottom:8px}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--blue)}
.form-label{display:block;color:var(--blue-lt);font-size:12px;font-weight:700;margin:12px 0 4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

/* Others */
.match-item{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11px;color:var(--dim)}
.match-teams{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid rgba(59,130,246,.15);border-bottom:1px solid rgba(59,130,246,.15);margin-bottom:8px}
.match-team{flex:1;text-align:center;font-size:13px;font-weight:800;color:var(--blue-lt)}
.match-score{font-size:22px;font-weight:900;color:#fff;letter-spacing:2px;direction:ltr}
.match-meta{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--dim);flex-wrap:wrap}

/* RSVP */
.rsvp-box{display:flex;gap:10px;margin-bottom:14px;background:rgba(0,0,0,.2);padding:10px;border-radius:12px;align-items:center;justify-content:center;}
.rsvp-btn{padding:8px 16px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;border:1px solid var(--border);background:rgba(0,0,0,0.5);color:#fff;transition:all .2s;}
.rsvp-btn.yes.active{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(39,174,96,0.5);}
.rsvp-btn.no.active{background:var(--red);border-color:var(--red);box-shadow:0 0 10px rgba(231,76,60,0.5);}

/* Lineup & Form */
.lineup-section{background:rgba(59,130,246,.05);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
.lineup-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;background:rgba(59,130,246,.08)}
.lineup-title{font-size:13px;font-weight:800;color:var(--blue-lt)}
.lineup-toggle{font-size:16px;color:var(--blue-lt)}
.lineup-body{padding:12px 14px;display:none}
.lineup-body.open{display:block}
.lineup-player{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;margin-bottom:6px;background:rgba(0,0,0,.3);cursor:pointer}
.lineup-player.selected{border:1px solid var(--blue);background:rgba(59,130,246,.15)}
.lineup-checkbox{width:18px;height:18px;accent-color:#3b82f6;flex-shrink:0;pointer-events:none;}
.lineup-avatar{width:32px;height:32px;border-radius:50%;background:#1a2a44;border:1.5px solid var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden;flex-shrink:0}
.lineup-avatar img{width:100%;height:100%;object-fit:cover}
.lineup-name{font-size:13px;font-weight:700;flex:1}
.lineup-pos{font-size:10px;color:var(--dim)}
.lineup-actions{display:flex;gap:6px;margin-top:10px}
.lineup-actions button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:rgba(59,130,246,.1);color:var(--blue-lt);font-size:11px;font-weight:700;cursor:pointer}

/* Team Form */
.team-form-box{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:20px;}
.team-form-title{font-size:13px;font-weight:800;color:var(--blue-lt);margin-bottom:10px;}
.team-form-row{display:flex;gap:6px;}
.tf-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;}
.tf-w{background:var(--green);box-shadow:0 0 10px rgba(39,174,96,0.4);}
.tf-d{background:#f39c12;box-shadow:0 0 10px rgba(243,156,18,0.4);}
.tf-l{background:var(--red);box-shadow:0 0 10px rgba(231,76,60,0.4);}

.stat-category{margin-bottom:22px}
.stat-cat-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--blue-lt);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(59,130,246,.25)}
.stat-cards{display:flex;flex-direction:column;gap:10px}
.stat-player-card{display:flex;align-items:center;gap:10px;padding:14px;background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:16px}
.stat-player-card.rank-1{border-color:#d4af37;background:linear-gradient(135deg,#1a1a08,#2a2410)}
.stat-player-card.rank-2{border-color:#c0c0c0;background:linear-gradient(135deg,#1a1a22,#25252e)}
.stat-player-card.rank-3{border-color:#cd7f32;background:linear-gradient(135deg,#1a130a,#2a1e0f)}
.stat-rank{width:42px;height:42px;border-radius:50%;background:rgba(59,130,246,.15);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:var(--blue-lt);flex-shrink:0}
.stat-rank.medal-gold{background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);color:#000;border-color:#f5d76e}
.stat-rank.medal-silver{background:linear-gradient(135deg,#f0f0f0,#c0c0c0,#888);color:#000;border-color:#e0e0e0}
.stat-rank.medal-bronze{background:linear-gradient(135deg,#e8a866,#cd7f32,#8b5a2b);color:#000;border-color:#cd7f32}
.stat-photo{width:48px;height:48px;border-radius:50%;background:#1a2a44;border:2px solid var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0}
.stat-photo img{width:100%;height:100%;object-fit:cover}
.stat-info{flex:1;min-width:0}
.stat-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-pos{font-size:11px;color:var(--blue-lt);font-weight:600;margin-top:2px;opacity:.85}
.stat-progress{height:6px;background:rgba(59,130,246,.15);border-radius:3px;margin-top:8px;overflow:hidden}
.stat-progress-bar{height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:3px}
.rank-1 .stat-progress-bar{background:linear-gradient(90deg,#d4af37,#f5d76e)}
.rank-2 .stat-progress-bar{background:linear-gradient(90deg,#a0a0a0,#e0e0e0)}
.rank-3 .stat-progress-bar{background:linear-gradient(90deg,#a0622b,#e8a866)}
.stat-value-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px;background:rgba(59,130,246,.15);border:1px solid var(--border);border-radius:12px;min-width:70px;flex-shrink:0}
.stat-value{font-size:24px;font-weight:900;color:var(--blue-lt);line-height:1}
.stat-value-label{font-size:9px;color:var(--dim);margin-top:3px;font-weight:700;letter-spacing:.5px}

.info-card{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.info-card-title{font-weight:800;color:var(--blue-lt);font-size:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.info-card-body{font-size:13px;line-height:1.7;color:#ccc}
.info-card-meta{font-size:11px;color:var(--dim);margin-bottom:6px}

.admin-section{margin-bottom:18px}
.admin-section-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.admin-section-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#1e40af);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.admin-section-title{font-size:15px;font-weight:800;color:var(--blue-lt)}
.admin-card{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:16px;padding:16px}
.admin-logo-row{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.admin-logo-preview{width:70px;height:70px;border-radius:50%;background:#1a2a44;border:2px solid var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex-shrink:0}
.admin-logo-preview img{width:100%;height:100%;object-fit:cover}
.admin-logo-info{flex:1;min-width:0}
.admin-logo-info input{width:100%;padding:10px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:8px;color:#fff;margin-bottom:8px;font-size:13px}
.admin-bg-preview{width:100%;height:140px;border-radius:12px;background:rgba(0,0,0,.4);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--dim);background-size:cover;background-position:center;margin-bottom:12px;overflow:hidden}
.admin-bg-actions{display:flex;gap:8px;margin-bottom:8px}
.admin-bg-actions button{flex:1;padding:10px;border-radius:10px;border:none;font-size:12px;font-weight:700;cursor:pointer}

.pending-request{display:flex;gap:12px;padding:12px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
.pr-info{flex:1}
.pr-name{font-size:14px;font-weight:800;margin-bottom:4px}
.pr-phone,.pr-date{font-size:11px;color:var(--dim);margin-top:2px}
.pr-actions{display:flex;flex-direction:column;gap:6px}
.btn-approve,.btn-reject{width:38px;height:38px;border-radius:10px;border:none;font-size:16px;font-weight:800;cursor:pointer}
.btn-approve{background:linear-gradient(135deg,#27ae60,#1e8449);color:#fff}
.btn-reject{background:rgba(231,76,60,.15);border:1px solid var(--red);color:var(--red)}

.perm-row{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.perm-row.main{border-color:#d4af37;background:linear-gradient(135deg,rgba(212,175,55,.08),rgba(0,0,0,.35))}
.perm-info{flex:1;min-width:0}
.perm-name{font-size:13px;font-weight:800;color:#fff;margin-bottom:3px}
.perm-meta{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.perm-role{padding:2px 7px;border-radius:6px;font-weight:700;font-size:10px}
.perm-lock{font-size:14px;color:#d4af37;flex-shrink:0}

.pm-row{background:#0a1424;border:1px solid #1a2a44;border-radius:10px;padding:10px;margin-bottom:8px}

// ============ الأنظمة ============
function getPlayerXP(p, data) {
    return (data.matches * 10) + (data.goals * 5) + (data.assists * 3) + (data.motm * 20);
}

function getPlayerData(p) {
  let searchId = p.id;
  if(searchId && searchId.startsWith('leg_auto_')) searchId = searchId.substring(9);
  
  let goals=0, assists=0, matches=0, motm=0, worst=0, bad=0, ratingSum=0, ratingCount=0, trophies=[], recentMatches=[];
  state.matches.forEach(m => {
    if(m.archived) {
      if((m.lineup||[]).includes(searchId)) {
        matches++; goals += (m.goals||{})[searchId] || 0; assists += (m.assists||{})[searchId] || 0;
        if (m.ratings && m.ratings[searchId]) { ratingSum += m.ratings[searchId]; ratingCount++; recentMatches.push({ opponent: m.opponentTeam, rating: m.ratings[searchId], date: m.date, goals: (m.goals||{})[searchId] || 0 }); }
      }
      if (m.motm === searchId) { motm++; trophies.push(m); }
      if (m.worst === searchId) worst++;
      if ((m.bad||[]).includes(searchId)) bad++;
    }
  });
  const avgRating = ratingCount > 0 ? (ratingSum / ratingCount) : 0;
  recentMatches.sort((a,b) => new Date(b.date) - new Date(a.date));
  return { ...p, id: searchId, goals, assists, matches, motm, worst, bad, avgRating, trophies, recentMatches };
}

function calculateOVR(p) {
  const data = getPlayerData(p);
  const stats = p.stats || { pace: 70, shooting: 70, passing: 70, dribbling: 70, defending: 70, physical: 70 };
  const statsAvg = (Number(stats.pace) + Number(stats.shooting) + Number(stats.passing) + Number(stats.dribbling) + Number(stats.defending) + Number(stats.physical)) / 6;
  let ovr = statsAvg + (data.goals * 0.1) + (data.assists * 0.05) + (data.motm * 0.25) + (data.avgRating * 0.1) - (data.bad * 0.3) - (data.worst * 0.5);
  return Math.min(99, Math.max(40, Math.round(ovr)));
}

function getCardTier(ovr) { if(ovr >= 99) return 'legendary'; if(ovr >= 90) return 'icon'; if(ovr >= 80) return 'gold'; if(ovr >= 70) return 'silver'; return 'bronze'; }

window.uploadPhoto = function(id) {
  if(!isAdmin) return;
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas'); const MAX = 250; let w = img.width, h = img.height;
        if(w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } }
        canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const p = state.players.find(x => x.id === id);
        if(p) { p.photo = canvas.toDataURL('image/jpeg', 0.6); await save(); }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
};

// ============ 2. الكروت ============
function buildCardHTML(p, ovr, tier, isLegend, forPreview, isCleanCapture = false) {
  const s = p.stats || { pace:70, shooting:70, passing:70, dribbling:70, defending:70, physical:70 };
  const d = getPlayerData(p); const photo = p.photo ? `<img src="${p.photo}">` : '👤';
  const expandBtn = (forPreview || isCleanCapture) ? '' : `<button class="fifa-expand-center" onclick="event.stopPropagation();previewCard('${p.id}', ${isLegend})">⤢</button>`;
  const editBtn = (isLegend && isAdmin && !forPreview && !isCleanCapture) ? `<button class="fifa-edit" onclick="event.stopPropagation();editLegend('${p.id}')">✏️</button>` : '';
  const delBtn = (isLegend && isAdmin && !forPreview && !isCleanCapture) ? `<button class="fifa-del" onclick="event.stopPropagation();deleteLegend('${p.id}')">🗑</button>` : '';
  const auraClass = (d.motm >= 3) ? 'star-aura' : '';
  let captureClass = isCleanCapture ? 'capture-clean' : '';

  return `<div class="fifa-card-wrap ${captureClass}" data-tier="${tier}" id="card-capture-${p.id}">
    <div class="fifa-card-3d"><div class="fifa-card" ${isCleanCapture?'':'onclick="this.classList.toggle(\'flipped\')"'}>
      <div class="fifa-face fifa-front"><div class="fifa-content">
        ${editBtn}${delBtn}
        <div class="fifa-top"><div class="fifa-rating-block"><div class="fifa-overall">${ovr}</div><div class="fifa-position">${p.position||'لاعب'}</div></div>
          <div class="fifa-photo-wrap ${auraClass}" style="border-radius:50%;"><div class="fifa-photo-circle">${photo} ${d.motm>0?'<div class="star-badge" style="font-size:12px; top:-5px; right:-5px;">👑</div>':''}</div></div></div>
        <div class="fifa-name-bar" style="position:relative;">
          <div class="fifa-name">${esc(p.name)}</div>
          ${p.isJoker ? `<div class="joker-badge-card">🃏 JOKER</div>` : ''}
        </div>
        <div class="fifa-season-stats"><div class="fifa-season-stat"><b>${d.matches}</b><span>MATCH</span></div><div class="fifa-season-stat"><b>${d.goals}</b><span>GOALS</span></div><div class="fifa-season-stat"><b>${d.assists}</b><span>ASSIST</span></div></div>
        <div class="fifa-extra"><span class="fifa-stars">${'★'.repeat(Math.floor(ovr/20))}</span>${expandBtn}<span>#${p.number || ''}</span></div>
      </div></div>
      <div class="fifa-face fifa-back"><div class="fifa-back-overlay"></div>
        <div class="fifa-back-top">${(!forPreview && !isCleanCapture) ? `<button class="fifa-back-btn" onclick="event.stopPropagation();shareCard('${p.id}')">📤</button>` : ''}</div>
        <div class="fifa-full-stats"><div class="fifa-stat-row"><div class="fifa-stat"><b>${s.pace}</b><span>PAC</span></div><div class="fifa-stat"><b>${s.shooting}</b><span>SHO</span></div><div class="fifa-stat"><b>${s.passing}</b><span>PAS</span></div></div><div class="fifa-stat-row"><div class="fifa-stat"><b>${s.dribbling}</b><span>DRI</span></div><div class="fifa-stat"><b>${s.defending}</b><span>DEF</span></div><div class="fifa-stat"><b>${s.physical}</b><span>PHY</span></div></div></div>
        <div class="fifa-back-content"><div class="fifa-back-ovr">${ovr}</div><div class="fifa-back-name">${esc(p.name)}</div><div class="fifa-back-pos">${p.position||'لاعب'}</div></div>
      </div>
    </div></div>
  </div>`;
}

function renderCards() {
  const el = $('#panel-1');
  let tabsHtml = `<div class="cards-subtabs"><button class="subtabs-btn ${cardsTab==='normal'?'active':''}" onclick="switchCardsTab('normal')">⚡ عادية</button><button class="subtabs-btn ${cardsTab==='legendary'?'active':''}" onclick="switchCardsTab('legendary')">👑 أسطورية</button></div>`;
  let contentHtml = '';
  if(cardsTab === 'normal') {
    if(!state.players.length) contentHtml = '<div class="empty-state">مفيش لاعبين</div>';
    else {
      contentHtml = `<div class="cards-toolbar"><button id="motionBtn" onclick="toggleMotion()">🎮 الحركة</button></div><div class="cards-grid-2" id="cardsGrid">`;
      state.players.forEach(p => contentHtml += buildCardHTML(p, calculateOVR(p), getCardTier(calculateOVR(p)), false, false, false)); contentHtml += '</div>';
    }
  } else {
    let autoLegends = state.players.filter(p => getPlayerData(p).motm >= 10).map(p => ({ ...p, id: 'leg_auto_' + p.id, isAuto: true }));
    let allLegends = [...state.legendary, ...autoLegends];
    if(isAdmin) contentHtml += `<div class="legendary-toolbar" style="margin-bottom:15px;"><button onclick="showAddLegend()">➕ إضافة كارت أسطوري جديد</button></div>`;
    if(!allLegends.length) contentHtml += '<div class="empty-state">مفيش كروت أسطورية</div>';
    else {
      if(legendaryIndex >= allLegends.length) legendaryIndex = 0;
      contentHtml += `<div class="legendary-carousel"><div class="legendary-stage" id="legendaryStage">`;
      allLegends.forEach((p, i) => { contentHtml += `<div class="legendary-card" data-index="${i}" onclick="onLegendaryClick(event, ${i})">${buildCardHTML(p, calculateOVR(p), 'legendary', true, false, false)}</div>`; });
      contentHtml += `</div></div><div class="legendary-indicator" id="legendaryIndicator">${legendaryIndex+1} / ${allLegends.length}</div>`;
    }
  }
  el.innerHTML = tabsHtml + `<div id="cardsView">${contentHtml}</div>`;
  if(cardsTab === 'legendary') {
    setTimeout(updateLegendaryPositions, 50);
    startLegendaryAuto();
    setupLegendarySwipe();
  } else {
    stopLegendaryAuto();
  }
}
window.switchCardsTab = function(t) { cardsTab = t; renderCards(); };
window.toggleMotion = function() { const grid = $('#cardsGrid'); if(!grid) return; grid.classList.toggle('motion'); const btn = $('#motionBtn'); if(btn) { if(grid.classList.contains('motion')) { btn.classList.add('active'); btn.innerHTML = '⏸️ إيقاف'; } else { btn.classList.remove('active'); btn.innerHTML = '🎮 الحركة'; } } };

function updateLegendaryPositions() { 
  const stage = $('#legendaryStage'); if(!stage) return; 
  const cards = stage.querySelectorAll('.legendary-card'); const total = cards.length; 
  cards.forEach((card, i) => { 
    let offset = i - legendaryIndex; 
    if(offset > total/2) offset -= total; 
    if(offset < -total/2) offset += total; 
    const abs = Math.abs(offset); 
    if(abs > 3) { card.style.opacity = '0'; card.style.pointerEvents = 'none'; return; } 
    card.style.opacity = abs === 0 ? 1 : (abs === 1 ? 0.85 : 0.4); 
    card.style.pointerEvents = 'auto'; card.style.zIndex = 100 - abs; 
    card.style.transform = `translateX(${offset*90}px) translateZ(${-abs*80}px) scale(${1-abs*0.12}) rotateY(${offset*-15}deg)`; 
    card.classList.toggle('active', abs === 0); 
  }); 
  const ind = $('#legendaryIndicator'); if(ind) ind.textContent = `${legendaryIndex+1} / ${total}`; 
}

window.onLegendaryClick = function(e, i) { 
  if(i === legendaryIndex) { 
    const card = e.currentTarget.querySelector('.fifa-card'); 
    if(card) card.classList.toggle('flipped'); 
    legendaryPaused = true; 
    setTimeout(() => legendaryPaused = false, 5000); 
  } else { 
    legendaryIndex = i; 
    updateLegendaryPositions(); 
  } 
};

function startLegendaryAuto() {
  stopLegendaryAuto();
  autoRotateInterval = setInterval(() => {
    if(currentTab !== 1 || cardsTab !== 'legendary' || legendaryPaused) return;
    const total = state.legendary.length + state.players.filter(p => getPlayerData(p).motm >= 10).length;
    if(total <= 1) return;
    legendaryIndex = (legendaryIndex + 1) % total;
    updateLegendaryPositions();
  }, 4000);
}
function stopLegendaryAuto() { if(autoRotateInterval) { clearInterval(autoRotateInterval); autoRotateInterval = null; } }

function setupLegendarySwipe() {
  const stage = $('#legendaryStage'); if(!stage) return;
  let startX = 0, startY = 0;
  stage.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    legendaryPaused = true;
  }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    const diffX = endX - startX;
    const diffY = endY - startY;
    if(Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
      const total = state.legendary.length + state.players.filter(p => getPlayerData(p).motm >= 10).length;
      if(diffX < 0) { legendaryIndex = (legendaryIndex + 1) % total; }
      else { legendaryIndex = (legendaryIndex - 1 + total) % total; }
      updateLegendaryPositions();
    }
    setTimeout(() => legendaryPaused = false, 5000);
  }, { passive: true });
}

window.showAddLegend = function() {
  tempLegendPhoto = '';
  openModal(`<h3>👑 كارت أسطوري جديد</h3><label class="form-label">الاسم *</label><input id="lg_name" placeholder="اسم اللاعب"><label class="form-label">المركز</label><select id="lg_pos"><option>حارس</option><option>مدافع</option><option>وسط</option><option>مهاجم</option></select><label class="form-label">صورة اللاعب</label><div id="lg_photo_preview" style="text-align:center; margin-bottom:10px; font-size:40px; color:var(--dim);">👤</div><button class="btn-purple btn-ghost" onclick="uploadLegendPhoto()" style="margin-bottom:10px">📷 اختيار صورة</button><div class="grid-3" style="margin-top:10px"><div><label class="form-label">سرعة</label><input id="lg_pace" type="number" value="90"></div><div><label class="form-label">تسديد</label><input id="lg_sho" type="number" value="90"></div><div><label class="form-label">تمرير</label><input id="lg_pas" type="number" value="90"></div><div><label class="form-label">مراوغة</label><input id="lg_dri" type="number" value="90"></div><div><label class="form-label">دفاع</label><input id="lg_def" type="number" value="90"></div><div><label class="form-label">بدنية</label><input id="lg_phy" type="number" value="90"></div></div><button class="btn-purple" onclick="saveNewLegend()" style="margin-top:18px">حفظ</button>`);
};
window.uploadLegendPhoto = function() { const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.onchange = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { const img = new Image(); img.onload = () => { const canvas = document.createElement('canvas'); const MAX = 250; let w = img.width, h = img.height; if(w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } } canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h); tempLegendPhoto = canvas.toDataURL('image/jpeg', 0.6); const prev = document.getElementById('lg_photo_preview'); if(prev) prev.innerHTML = `<img src="${tempLegendPhoto}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid var(--blue);">`; }; img.src = ev.target.result; }; reader.readAsDataURL(file); }; input.click(); };
window.saveNewLegend = async function() { const name = $('#lg_name').value.trim(); if(!name) return alert("اكتب الاسم"); const newLegend = { id: 'leg_' + uid(), name: name, position: $('#lg_pos').value, photo: tempLegendPhoto, stats: { pace: +$('#lg_pace').value, shooting: +$('#lg_sho').value, passing: +$('#lg_pas').value, dribbling: +$('#lg_dri').value, defending: +$('#lg_def').value, physical: +$('#lg_phy').value } }; state.legendary.push(newLegend); await save(); closeModal(); };
window.editLegend = function(id) { if(id.startsWith('leg_auto_')) return; const p = state.legendary.find(x => x.id === id); if(!p) return; const s = p.stats || { pace:90, shooting:90, passing:90, dribbling:90, defending:90, physical:90 }; openModal(`<h3>✏️ تعديل أسطورة</h3><label class="form-label">الاسم</label><input id="lg_name" value="${esc(p.name)}"><div class="grid-3" style="margin-top:10px"><div><label class="form-label">سرعة</label><input id="lg_pace" type="number" value="${s.pace}"></div><div><label class="form-label">تسديد</label><input id="lg_sho" type="number" value="${s.shooting}"></div><div><label class="form-label">تمرير</label><input id="lg_pas" type="number" value="${s.passing}"></div><div><label class="form-label">مراوغة</label><input id="lg_dri" type="number" value="${s.dribbling}"></div><div><label class="form-label">دفاع</label><input id="lg_def" type="number" value="${s.defending}"></div><div><label class="form-label">بدنية</label><input id="lg_phy" type="number" value="${s.physical}"></div></div><button class="btn-purple" onclick="saveEditLegend('${id}')" style="margin-top:18px">حفظ التعديلات</button>`); };
window.saveEditLegend = async function(id) { const p = state.legendary.find(x => x.id === id); if(!p) return; p.name = $('#lg_name').value; p.stats = { pace: +$('#lg_pace').value, shooting: +$('#lg_sho').value, passing: +$('#lg_pas').value, dribbling: +$('#lg_dri').value, defending: +$('#lg_def').value, physical: +$('#lg_phy').value }; await save(); closeModal(); };

window.previewCard = function(id, isLegend) { let p = isLegend ? state.legendary.find(x => x.id === id) : state.players.find(x => x.id === id); if(id.startsWith('leg_auto_')) p = state.players.find(x => 'leg_auto_' + x.id === id); if(!p) return; $('#previewContent').innerHTML = `<button class="preview-close" onclick="closePreview()">×</button>` + buildCardHTML(p, calculateOVR(p), isLegend?'legendary':getCardTier(calculateOVR(p)), isLegend, true, false); $('#previewOverlay').classList.add('show'); };

window.shareCard = async function(id) { const realId = id.startsWith('leg_auto_') ? id.substring(9) : id; const p = state.players.find(x => x.id === realId) || state.legendary.find(x => x.id === realId); if(!p) return; const captureDiv = document.getElementById('capture-container'); captureDiv.innerHTML = buildCardHTML(p, calculateOVR(p), getCardTier(calculateOVR(p)), false, false, true); const cardEl = captureDiv.firstElementChild; try { const canvas = await html2canvas(cardEl, { scale: 3, backgroundColor: null, useCORS: true }); const link = document.createElement('a'); link.download = `Card_${realId}.png`; link.href = canvas.toDataURL("image/png"); link.click(); captureDiv.innerHTML = ''; } catch(e) { alert("حدث خطأ: " + e.message); captureDiv.innerHTML = ''; } };

let countdownInterval;
window.switchMatchesTab = function(tab) { matchesSubTab = tab; renderMatches(); };

function renderMatches() {
  const el = $('#panel-2');
  let html = `<div class="cards-subtabs"><button class="subtabs-btn ${matchesSubTab==='active'?'active':''}" onclick="switchMatchesTab('active')">⚽ الحالية</button><button class="subtabs-btn ${matchesSubTab==='archived'?'active':''}" onclick="switchMatchesTab('archived')">📂 الأرشيف</button></div>`;
  
  if(isAdmin && matchesSubTab === 'active') {
    html += `<div class="match-form"><h3 style="margin-bottom:10px;font-size:14px;color:var(--blue-lt)">➕ إضافة ماتش</h3><label>التاريخ</label><input type="date" id="m_date"><label>الملعب</label><input type="text" id="m_place"><div class="row"><div style="flex:1"><label>من ساعة</label><input type="time" id="m_from" value="20:00"></div><div style="flex:1"><label>إلى ساعة</label><input type="time" id="m_to" value="21:30"></div></div><label>الفريقين</label><div class="row"><input type="text" id="m_t1" value="${esc(state.team.name)}"><div class="vs">VS</div><input type="text" id="m_t2" placeholder="الخصم"></div><button class="btn-purple" onclick="addMatch()" style="margin-top:10px">إضافة</button></div>`;
  }

  const today = new Date(); today.setHours(0,0,0,0);
  const upcomingMatches = state.matches.filter(m => !m.archived && new Date(m.date) >= today).sort((a,b) => new Date(a.date) - new Date(b.date));
  
  if(matchesSubTab === 'active' && upcomingMatches.length > 0) {
      const next = upcomingMatches[0];
      html += `<div class="countdown-box" id="countdownBox"><div class="countdown-title">⏳ الماتش الجاي ضد ${esc(next.opponentTeam)}</div><div class="countdown-timer" id="countdownTimer"><div class="cd-item"><div class="cd-val" id="cd-days">0</div><div class="cd-label">يوم</div></div><div class="cd-item"><div class="cd-val" id="cd-hours">0</div><div class="cd-label">ساعة</div></div><div class="cd-item"><div class="cd-val" id="cd-mins">0</div><div class="cd-label">دقيقة</div></div><div class="cd-item"><div class="cd-val" id="cd-secs">0</div><div class="cd-label">ثانية</div></div></div></div>`;
      if(countdownInterval) clearInterval(countdownInterval); setTimeout(() => startCountdown(next.date, next.timeFrom), 100);
  }

  let ms = state.matches.slice();
  if(matchesSubTab === 'active') ms = ms.filter(m => !m.archived);
  else ms = ms.filter(m => m.archived);
  ms.sort((a,b) => new Date(b.date) - new Date(a.date));

  html += `<div class="section-header">${matchesSubTab === 'active' ? '⚽ الماتشات الحالية' : '📂 الماتشات المؤرشفة'} <span class="count">${ms.length}</span></div>`;
  if(!ms.length) html += `<div class="empty-state">${matchesSubTab === 'active' ? 'مفيش ماتشات حالية' : 'الأرشيف فاضي'}</div>`;
  else ms.forEach(m => {
    const hasResult = m.ourScore !== null && m.theirScore !== null;
    let myRsvp = m.rsvp && m.rsvp[currentUserPhone] ? (m.rsvp[currentUserPhone] === 'yes' ? '✅ أنت جاي' : '❌ أنت مش جاي') : '';
    html += `<div class="match-item" onclick="openMatchDetail('${m.id}')"><div class="match-header"><span>📅 ${m.date}</span><span>⏰ ${m.timeFrom} - ${m.timeTo}</span></div><div class="match-teams"><div class="match-team">${esc(m.ourTeam)}</div><div class="match-score">${hasResult ? m.ourScore + ' - ' + m.theirScore : 'vs'}</div><div class="match-team">${esc(m.opponentTeam)}</div></div><div class="match-meta"><span>📍 ${esc(m.place)}</span><span>👥 ${(m.lineup||[]).length} في التشكيل</span>${myRsvp ? `<span style="color:var(--green); font-weight:bold;">${myRsvp}</span>` : ''}${m.archived?'<span style="color:var(--red)">مؤرشف 🔒</span>':''}</div></div>`;
  });
  el.innerHTML = html;
}
function startCountdown(dateStr, timeStr) { const matchDate = new Date(dateStr + 'T' + (timeStr || '00:00') + ':00').getTime(); countdownInterval = setInterval(() => { const now = new Date().getTime(); const distance = matchDate - now; if (distance < 0) { clearInterval(countdownInterval); const timerEl = document.getElementById('countdownTimer'); if(timerEl) timerEl.innerHTML = '<div style="color:var(--green);font-weight:900;font-size:18px;">الماتش بدأ! ⚽</div>'; return; } const days = Math.floor(distance / (1000 * 60 * 60 * 24)); const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)); const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)); const seconds = Math.floor((distance % (1000 * 60)) / 1000); const dEl = document.getElementById('cd-days'); if(dEl) dEl.innerText = days; const hEl = document.getElementById('cd-hours'); if(hEl) hEl.innerText = hours; const mEl = document.getElementById('cd-mins'); if(mEl) mEl.innerText = minutes; const sEl = document.getElementById('cd-secs'); if(sEl) sEl.innerText = seconds; }, 1000); }

window.addMatch = async function() { if(!isAdmin) return; const d = $('#m_date').value, place = $('#m_place').value; const t1 = $('#m_t1').value, t2 = $('#m_t2').value; if(!d || !t2) return alert("اكمل البيانات"); state.matches.push({ id: uid(), date: d, timeFrom: $('#m_from').value, timeTo: $('#m_to').value, ourTeam: t1, opponentTeam: t2, ourScore: null, theirScore: null, place: place, lineup: [], rsvp: {}, goals: {}, assists: {}, ratings: {}, motm: null, worst: null, bad: [], archived: false, comments: [], predictions: {} }); await save(); };

  if(!m.archived) {
      const myRsvp = m.rsvp && m.rsvp[currentUserPhone] ? m.rsvp[currentUserPhone] : '';

          } else {
              let predOptions = state.players.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
              html += `<div style="background:rgba(212,175,55,.1);border:1px solid var(--gold);padding:10px;border-radius:10px;margin-bottom:14px;text-align:center;"><div style="font-size:12px;color:var(--gold-lt);font-weight:800;margin-bottom:5px;">🔮 توقع مين هيكون نجم الماتش؟</div><div style="display:flex;gap:5px;"><select id="predictionSelect" style="flex:1;padding:8px;background:#000;border:1px solid #333;border-radius:6px;color:#fff;"><option value="">-- اختار --</option>${predOptions}</select><button class="btn-purple" style="width:auto;margin:0;padding:0 15px;" onclick="confirmPrediction('${m.id}')">تأكيد</button></div></div>`;
          }
      }
  }

  if(isAdmin && !m.archived) {
      html += `<div style="display:flex;gap:10px;margin-bottom:14px;background:rgba(0,0,0,.2);padding:10px;border-radius:10px;"><div style="flex:1"><label class="form-label" style="margin:0 0 5px;">أهدافنا</label><input type="number" value="${m.ourScore !== null ? m.ourScore : ''}" onchange="setMatchResult('${m.id}', 'ourScore', this.value)" style="width:100%;padding:8px;text-align:center;background:#000;border:1px solid #333;border-radius:6px;color:#fff;"></div><div style="flex:1"><label class="form-label" style="margin:0 0 5px;">أهدافهم</label><input type="number" value="${m.theirScore !== null ? m.theirScore : ''}" onchange="setMatchResult('${m.id}', 'theirScore', this.value)" style="width:100%;padding:8px;text-align:center;background:#000;border:1px solid #333;border-radius:6px;color:#fff;"></div></div>`;
  }

  html += `<div class="lineup-section"><div class="lineup-header" onclick="toggleMatchLineup()"><span class="lineup-title">${m.lineup.length ? `⚽ التشكيل (${m.lineup.length} لاعب)` : '⚽ لسه مفيش تشكيل'}</span><span class="lineup-toggle" id="lineupToggleIcon">▾</span></div><div class="lineup-body" id="lineupBody">`;
  if(!state.players.length) html += `<div class="lineup-empty">ضيف لاعبين الأول</div>`;
  else {
    state.players.forEach(p => {

    m.lineup.forEach(pid => {
      const p = state.players.find(x=>x.id===pid); if(!p) return;
      const g = (m.goals||{})[pid]||0, a = (m.assists||{})[pid]||0, r = (m.ratings||{})[pid]||0;
      const isBest = m.motm===pid, isWorst = m.worst===pid, isBad = (m.bad||[]).includes(pid);
      html += `<div class="pm-row"><div class="pm-name">${esc(p.name)} ${isBest?'<span class="pill pill-gold">⭐ أفضل</span>':''} ${isWorst?'<span class="pill pill-red">💩 أوحش</span>':''} ${isBad?'<span class="pill pill-gray">👎 وحش</span>':''}</div><div class="pm-controls"><div class="pm-ctrl"><label>أهداف</label><input type="number" value="${g}" ${canEdit?'':'disabled'} onchange="setStat('${m.id}','goals','${pid}',this.value)"></div><div class="pm-ctrl"><label>أسيست</label><input type="number" value="${a}" ${canEdit?'':'disabled'} onchange="setStat('${m.id}','assists','${pid}',this.value)"></div><div class="pm-ctrl"><label>تقييم</label><input type="number" value="${r}" ${canEdit?'':'disabled'} onchange="setStat('${m.id}','ratings','${pid}',this.value)"></div></div>${canEdit ? `<div class="pm-actions"><button class="pm-award best ${isBest?'active':''}" onclick="setAward('${m.id}','motm','${pid}')">⭐ أفضل</button><button class="pm-award worst ${isWorst?'active':''}" onclick="setAward('${m.id}','worst','${pid}')">💩 أوحش</button><button class="pm-award bad ${isBad?'active':''}" onclick="toggleBad('${m.id}','${pid}')">👎 وحش</button></div>` : ''}</div>`;
