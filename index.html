  if(isAdmin && !m.archived) html += `<button class="btn-purple btn-danger" style="margin-top:16px" onclick="archiveMatch('${m.id}')">🔒 أرشفة وقفل الماتش</button>`;
  if(isAdmin) html += `<button class="btn-purple btn-danger" style="margin-top:8px;background:transparent" onclick="deleteMatch('${m.id}')">🗑 حذف الماتش</button>`;
  openModal(html);
};

window.confirmPrediction = function(mid) {
    const sel = document.getElementById('predictionSelect');
    if(!sel || !sel.value) return alert("اختار لاعب الأول");
    const m = state.matches.find(x => x.id === mid); if(!m) return;
    if(!m.predictions) m.predictions = {};
    m.predictions[currentUserPhone] = sel.value;
    save(); openMatchDetail(mid);
};

window.setRsvp = async function(mid, status) { const m = state.matches.find(x => x.id === mid); if(!m) return; if(!m.rsvp) m.rsvp = {}; m.rsvp[currentUserPhone] = status; await save(); openMatchDetail(mid); };
window.setMatchResult = async function(mid, field, val) { const m = state.matches.find(x => x.id === mid); if(m) { m[field] = val !== '' ? +val : null; await save(); } };
window.addMatchComment = async function(mid) { const inp = document.getElementById('matchCommentInput'); if(!inp || !inp.value.trim()) return; const m = state.matches.find(x => x.id === mid); if(!m.comments) m.comments = []; m.comments.push({ author: currentUserPhone !== 'admin' ? currentUserPhone : 'المدير', text: inp.value.trim() }); await save(); openMatchDetail(mid); };
window.toggleMatchLineup = function() { const body = document.getElementById('lineupBody'); const icon = document.getElementById('lineupToggleIcon'); if(body && icon) { const isOpen = body.style.display === 'block' || body.classList.contains('open'); if(isOpen) { body.classList.remove('open'); body.style.display = 'none'; icon.textContent = '▾'; } else { body.classList.add('open'); body.style.display = 'block'; icon.textContent = '▴'; } } };
window.toggleLineup = async function(mid, pid, canEdit) { if(!canEdit) return; const m = state.matches.find(x => x.id === mid); if(m.lineup.includes(pid)) m.lineup = m.lineup.filter(x => x !== pid); else m.lineup.push(pid); await save(); openMatchDetail(mid); };
window.selectAllLineup = async function(mid) { const m = state.matches.find(x=>x.id===mid); m.lineup = state.players.map(p=>p.id); await save(); openMatchDetail(mid); };
window.clearLineup = async function(mid) { const m = state.matches.find(x=>x.id===mid); m.lineup = []; await save(); openMatchDetail(mid); };
window.setStat = async function(mid, field, pid, val) { const m = state.matches.find(x=>x.id===mid); if(!m[field]) m[field]={}; m[field][pid] = +val; await save(); };
window.setAward = async function(mid, field, pid) { const m = state.matches.find(x=>x.id===mid); m[field] = (m[field]===pid) ? null : pid; if(field==='motm' && m.worst===pid) m.worst=null; if(field==='worst' && m.motm===pid) m.motm=null; m.bad = m.bad.filter(x=>x!==pid); await save(); openMatchDetail(mid); };
window.toggleBad = async function(mid, pid) { const m = state.matches.find(x=>x.id===mid); if(m.bad.includes(pid)) m.bad = m.bad.filter(x=>x!==pid); else { m.bad.push(pid); if(m.motm===pid) m.motm=null; if(m.worst===pid) m.worst=null; } await save(); openMatchDetail(mid); };
window.archiveMatch = async function(id) { if(!confirm("أرشفة الماتش؟ مش هينفع تعدل تاني")) return; const m = state.matches.find(x=>x.id===id); m.archived=true; await save(); closeModal(); };
window.deleteMatch = async function(id) { if(!confirm("حذف الماتش؟")) return; state.matches = state.matches.filter(x=>x.id!==id); await save(); closeModal(); };

// ============ 4. الإحصائيات ============
function renderStats() {
  const el = $('#panel-3');
  if(!state.players.length) return el.innerHTML = '<div class="empty-state">ضيف لاعبين الأول</div>';
  
  const last7Days = new Date(); last7Days.setDate(last7Days.getDate() - 7); last7Days.setHours(0,0,0,0);
  let weekPoints = {};
  state.players.forEach(p => weekPoints[p.id] = { id: p.id, name: p.name, photo: p.photo, pts: 0 });
  
  state.matches.filter(m => m.archived && new Date(m.date) >= last7Days).forEach(m => {
      (m.lineup||[]).forEach(pid => { if(weekPoints[pid]) weekPoints[pid].pts += 1; });
      Object.entries(m.goals||{}).forEach(([pid,v]) => { if(weekPoints[pid]) weekPoints[pid].pts += (v * 3); });
      Object.entries(m.assists||{}).forEach(([pid,v]) => { if(weekPoints[pid]) weekPoints[pid].pts += (v * 2); });
  });
  let weekArr = Object.values(weekPoints).sort((a,b) => b.pts - a.pts).filter(p => p.pts > 0);
  
  let html = '';
  if(weekArr.length > 0) {
      let top3 = weekArr.slice(0, 3);
      html += `<div class="team-form-box" style="background:linear-gradient(135deg,#2a1e08,#0a0805);border-color:var(--gold);"><div class="team-form-title" style="color:var(--gold-lt);text-align:center;font-size:15px;margin-bottom:15px;">👑 ملك الأسبوع</div>`;
      html += `<div style="display:flex; justify-content:space-around; align-items:flex-end;">`;
      if(top3[1]) html += `<div style="text-align:center;"><img src="${top3[1].photo || 'https://via.placeholder.com/50/000/fff?text=👤'}" style="width:50px;height:50px;border-radius:50%;border:2px solid #c0c0c0;object-fit:cover;"><div style="font-size:11px;margin-top:5px;font-weight:700;">${esc(top3[1].name)}</div><div style="font-size:10px;color:#c0c0c0;font-weight:900;">${top3[1].pts} نقطة</div></div>`;
      html += `<div style="text-align:center;"><img src="${top3[0].photo || 'https://via.placeholder.com/70/000/fff?text=👤'}" style="width:70px;height:70px;border-radius:50%;border:3px solid var(--gold);object-fit:cover;"><div style="font-size:13px;margin-top:5px;font-weight:900;color:var(--gold-lt);">${esc(top3[0].name)}</div><div style="font-size:12px;color:var(--gold);font-weight:900;">${top3[0].pts} نقطة</div></div>`;
      if(top3[2]) html += `<div style="text-align:center;"><img src="${top3[2].photo || 'https://via.placeholder.com/50/000/fff?text=👤'}" style="width:50px;height:50px;border-radius:50%;border:2px solid #cd7f32;object-fit:cover;"><div style="font-size:11px;margin-top:5px;font-weight:700;">${esc(top3[2].name)}</div><div style="font-size:10px;color:#cd7f32;font-weight:900;">${top3[2].pts} نقطة</div></div>`;
      html += `</div></div>`;
  }

  html += `<button class="btn-purple" onclick="openDuel()" style="margin-bottom:20px; background:linear-gradient(135deg,#8e2de2,#4a00e0);">🤝 ديربي الأصحاب (مقارنة لاعبين)</button>`;

  const last5 = state.matches.filter(m => m.archived && m.ourScore !== null && m.theirScore !== null).sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
  html += `<div class="team-form-box"><div class="team-form-title">حالة الفريق (آخر 5 ماتشات)</div><div class="team-form-row">`;
  if(last5.length === 0) html += `<div style="font-size:12px;color:var(--dim);">لسه مفيش ماتشات مؤرشفة</div>`;
  else last5.forEach(m => { if(m.ourScore > m.theirScore) html += `<div class="tf-circle tf-w">W</div>`; else if(m.ourScore < m.theirScore) html += `<div class="tf-circle tf-l">L</div>`; else html += `<div class="tf-circle tf-d">D</div>`; });
  html += `</div></div>`;

  const data = state.players.map(p => getPlayerData(p));
  function buildCat(title, list, label, filterZero) {
    let arr = [...list].sort((a,b) => b[label] - a[label]); if(filterZero) arr = arr.filter(x => x[label] > 0); if(!arr.length) return '';
    const max = arr[0][label] || 1; let h = `<div class="stat-category"><div class="stat-cat-title">${title}</div><div class="stat-cards">`;
    arr.forEach((p, i) => {
      let rCls = i===0?'rank-1':(i===1?'rank-2':(i===2?'rank-3':'')); let rIcon = i===0?'🥇':(i===1?'🥈':(i===2?'🥉':(i+1))); let mCls = i===0?'medal-gold':(i===1?'medal-silver':(i===2?'medal-bronze':''));
      h += `<div class="stat-player-card ${rCls}"><div class="stat-rank ${mCls}">${rIcon}</div><div class="stat-photo">${p.photo?`<img src="${p.photo}">`:'👤'}</div><div class="stat-info"><div class="stat-name">${esc(p.name)}</div><div class="stat-pos">${p.position||'لاعب'}</div><div class="stat-progress"><div class="stat-progress-bar" style="width:${(p[label]/max)*100}%"></div></div></div><div class="stat-value-box"><div class="stat-value">${label==='avgRating'?p[label].toFixed(1):p[label]}</div><div class="stat-value-label">${label==='avgRating'?'تقييم':(label==='matches'?'ماتش':(label==='goals'?'هدف':(label==='assists'?'أسيست':(label==='motm'?'⭐':'👎'))))}</div></div></div>`;
    }); return h + '</div></div>';
  }
  html += buildCat('⚽ هدافين', data, 'goals', true);
  html += buildCat('🅰️ صناع', data, 'assists', true);
  html += buildCat('⭐ نجوم', data, 'motm', true);
  html += buildCat('👎 الوحشين', data, 'bad', true);
  html += buildCat('👥 مشاركة', data, 'matches', false);
  el.innerHTML = html;
}

window.openDuel = function() {
    let opts = state.players.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
    openModal(`<h3>🤝 ديربي الأصحاب</h3>
      <div class="duel-container">
        <div class="duel-player"><select id="duel_p1" onchange="updateDuel()" style="margin:0;">${opts}</select></div>
        <div class="duel-vs">VS</div>
        <div class="duel-player"><select id="duel_p2" onchange="updateDuel()" style="margin:0;">${opts}</select></div>
      </div>
      <div id="duel_results" style="margin-top:15px; background:#000; border-radius:12px; padding:10px;"></div>`);
    setTimeout(() => {
        if(state.players.length > 1) $('#duel_p2').selectedIndex = 1;
        updateDuel();
    }, 100);
};

window.updateDuel = function() {
    const p1id = $('#duel_p1').value; const p2id = $('#duel_p2').value;
    const p1 = getPlayerData(state.players.find(x=>x.id===p1id)); const p2 = getPlayerData(state.players.find(x=>x.id===p2id));
    if(!p1 || !p2) return;
    const resDiv = $('#duel_results');
    
    function row(name, v1, v2, higherIsBetter = true) {
        let c1 = '', c2 = '';
        if(v1 !== v2) {
            if(higherIsBetter) { if(v1 > v2) c1 = 'duel-stat-winner'; else c2 = 'duel-stat-winner'; }
            else { if(v1 < v2) c1 = 'duel-stat-winner'; else c2 = 'duel-stat-winner'; }
        }
        return `<div class="duel-stat-row"><div class="duel-stat-val ${c1}">${v1}</div><div class="duel-stat-name">${name}</div><div class="duel-stat-val ${c2}">${v2}</div></div>`;
    }

    resDiv.innerHTML = 
        row('التقييم', calculateOVR(p1), calculateOVR(p2)) +
        row('ماتشات', p1.matches, p2.matches) +
        row('أهداف', p1.goals, p2.goals) +
        row('أسيست', p1.assists, p2.assists) +
        row('نجوم', p1.motm, p2.motm) +
        row('سرعة', (p1.stats?.pace||70), (p2.stats?.pace||70)) +
        row('تسديد', (p1.stats?.shooting||70), (p2.stats?.shooting||70));
};

// ============ 5. عرش النجوم ============
function renderHallOfFame() {
  const el = $('#panel-4');
  const data = state.players.map(p => getPlayerData(p)).filter(p => p.motm > 0).sort((a,b) => b.motm - a.motm);
  if(!data.length) return el.innerHTML = '<div class="empty-state" style="padding-top:100px;"><div class="empty-icon">👑</div><div>لسه مفيش نجوم في الفريق<br>اختار أفضل لاعب في ماتش وأرشف الماتش عشان يظهر هنا.</div></div>';
  let html = `<div class="hall-bg"><div class="marquee-container"><div class="marquee-text">🌟 عرش النجوم - هنا يتواجد أساطير فريق بني برزه 🌟 عرش النجوم - هنا يتواجد أساطير فريق بني برزه 🌟</div></div><div class="hall-title">👑 عرش النجوم 👑</div>`;
  const currentMonthStr = new Date().toISOString().slice(0, 7); const monthNames = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"]; const currentMonthName = monthNames[new Date().getMonth()];
  let monthStats = {}; state.players.forEach(p => monthStats[p.id] = { id: p.id, name: p.name, photo: p.photo, stars: 0, ratingSum: 0, ratingCount: 0 });
  state.matches.forEach(m => { if(m.archived && m.date && m.date.startsWith(currentMonthStr)) { if (m.motm && monthStats[m.motm]) monthStats[m.motm].stars++; if (m.ratings) { for (let pid in m.ratings) { if (monthStats[pid] && m.ratings[pid] > 0) { monthStats[pid].ratingSum += Number(m.ratings[pid]); monthStats[pid].ratingCount++; } } } } });
  let monthlyArray = Object.values(monthStats).map(p => { p.avgRating = p.ratingCount > 0 ? (p.ratingSum / p.ratingCount) : 0; p.score = (p.stars * 10) + p.avgRating; return p; }).filter(p => p.stars > 0 || p.ratingCount > 0); monthlyArray.sort((a,b) => b.score - a.score); let monthlyTop = monthlyArray[0];
  html += `<div class="star-month-banner" onclick="triggerSparkles(event)"><div class="month-title">🌟 نجم شهر ${currentMonthName} 🌟</div>`;
  if(monthlyTop && monthlyTop.score > 0) { let ratingDisplay = monthlyTop.avgRating > 0 ? monthlyTop.avgRating.toFixed(1) : '0'; html += `<img src="${monthlyTop.photo || 'https://via.placeholder.com/100/050a15/3b82f6?text=👤'}" class="month-star-img"><div class="month-star-name">${esc(monthlyTop.name)}</div><div style="margin-top:5px; display:flex; justify-content:center; gap:5px;"><div class="month-star-count count-up" data-target="${monthlyTop.stars}">⭐ 0 نجمة</div><div class="month-star-count" style="background:var(--blue); color:#fff;">📈 ${ratingDisplay}/10</div></div>`; } 
  else { html += `<div style="font-size:40px;margin:10px 0;opacity:0.5;">🌙</div><div class="month-star-name" style="font-size:16px;color:var(--dim);">لسه مفيش نجم للشهر ده</div><div class="month-star-count" style="background:var(--dim);color:#000;">اختار أفضل لاعب وأرشف الماتش!</div>`; }
  html += `</div>`;
  html += `<div class="podium-container">`;
  if(data[1]) html += `<div class="podium p2" onclick="triggerSparkles(event)"><img src="${data[1].photo || 'https://via.placeholder.com/60/000/fff?text=👤'}" class="podium-avatar"><div class="podium-name">${esc(data[1].name)}</div><div class="podium-stars count-up" data-target="${data[1].motm}">🥈 0</div></div>`;
  html += `<div class="podium p1" onclick="triggerSparkles(event)"><div class="crown-p1">👑</div><img src="${data[0].photo || 'https://via.placeholder.com/80/000/fff?text=👤'}" class="podium-avatar"><div class="podium-name">${esc(data[0].name)}</div><div class="podium-stars count-up" data-target="${data[0].motm}">🥇 0</div></div>`;
  if(data[2]) html += `<div class="podium p3" onclick="triggerSparkles(event)"><img src="${data[2].photo || 'https://via.placeholder.com/60/000/fff?text=👤'}" class="podium-avatar"><div class="podium-name">${esc(data[2].name)}</div><div class="podium-stars count-up" data-target="${data[2].motm}">🥉 0</div></div>`;
  html += `</div>`;
  if(data.length > 3) { html += `<div class="hall-list">`; for(let i=3; i<data.length; i++) { html += `<div class="hall-row" onclick="triggerSparkles(event)"><div class="hall-rank">#${i+1}</div><img src="${data[i].photo || 'https://via.placeholder.com/40/000/fff?text=👤'}" class="hall-avatar"><div class="hall-name">${esc(data[i].name)}</div><div class="hall-count count-up" data-target="${data[i].motm}">⭐ 0</div></div>`; } html += `</div>`; }
  html += `</div>`;
  el.innerHTML = html;
  if(!hallAnimated) { hallAnimated = true; setTimeout(() => { document.querySelectorAll('.count-up').forEach(el => { let target = parseInt(el.getAttribute('data-target')); let current = 0; let prefix = el.innerText.replace(/[0-9]/g, '').trim(); let step = target / 30; let timer = setInterval(() => { current += step; if(current >= target) { current = target; clearInterval(timer); } el.innerText = `${prefix} ${Math.floor(current)}`; }, 30); }); }, 500); } 
  else { document.querySelectorAll('.count-up').forEach(el => { let target = parseInt(el.getAttribute('data-target')); let prefix = el.innerText.replace(/[0-9]/g, '').trim(); el.innerText = `${prefix} ${target}`; }); }
}
window.triggerSparkles = function(e) { const emojis = ['✨', '⭐', '🌟', '👑']; for(let i=0; i<6; i++) { let sparkle = document.createElement('div'); sparkle.className = 'sparkle'; sparkle.innerText = emojis[Math.floor(Math.random() * emojis.length)]; sparkle.style.left = e.pageX + 'px'; sparkle.style.top = e.pageY + 'px'; let tx = (Math.random() - 0.5) * 200; let ty = (Math.random() - 0.5) * 200 - 50; sparkle.style.setProperty('--tx', tx + 'px'); sparkle.style.setProperty('--ty', ty + 'px'); document.body.appendChild(sparkle); setTimeout(() => sparkle.remove(), 800); };

// ============ 6. المجتمع ============
window.switchCommunityTab = function(t) { communityTab = t; renderCommunity(); };
function renderCommunity() {
  const el = $('#panel-5');
  let html = `<div class="cards-subtabs"><button class="subtabs-btn ${communityTab==='moments'?'active':''}" onclick="switchCommunityTab('moments')">📸 لقطات اللاعيبة</button><button class="subtabs-btn ${communityTab==='board'?'active':''}" onclick="switchCommunityTab('board')">💬 لوحة النقاش</button></div>`;

  if(communityTab === 'moments') {
      html += `<button class="btn-purple" onclick="uploadMoment()" style="margin-bottom:15px; background:linear-gradient(135deg,#d4af37,#8a6d1f); color:#000;">📷 شارك لقطة جديدة</button>`;
      if(!state.moments || !state.moments.length) html += `<div class="empty-state">مفيش لقطات لسه، كن أول واحد يشارك!</div>`;
      else {
          html += `<div class="moments-grid">`;
          state.moments.slice().reverse().forEach(m => {
              let authorName = 'لاعب';
              const u = approvedUsers.find(x => x.phone === m.authorPhone);
              if(u) authorName = u.name;
              else if (m.authorPhone === 'admin') authorName = 'المدير';
              
              html += `<div class="moment-card"><img src="${m.photo}" class="moment-img"><div class="moment-body"><div class="moment-author">${esc(authorName)}</div><div class="moment-text">${esc(m.text)}</div><div class="reaction-row">`;
              let reacts = m.reactions || {};
              ['🔥','❤️','😂'].forEach(emo => { let users = reacts[emo] || []; let active = users.includes(currentUserPhone) ? 'active' : ''; html += `<button class="reaction-btn ${active}" onclick="toggleReaction('${m.id}', '${emo}')" ondblclick="showReactors('${m.id}', '${emo}')">${emo} <span>${users.length}</span></button>`; });
              html += `</div>`;
              if(isAdmin || currentUserPhone === m.authorPhone) { html += `<button onclick="deleteMoment('${m.id}')" style="background:none;border:none;color:var(--red);font-size:12px;margin-top:5px;cursor:pointer;">🗑 حذف</button>`; }
              html += `</div></div>`;
          });
          html += `</div>`;
      }
  } else {
      html += `<div style="display:flex;gap:6px;margin-bottom:15px;"><input type="text" id="boardMsgInput" placeholder="اكتب رسالة للفريق..." style="flex:1;padding:12px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;color:#fff;"><button class="btn-purple" onclick="addBoardMsg()" style="width:auto;margin:0;padding:0 20px;">نشر</button></div>`;
      if(!state.board || !state.board.length) html += `<div class="empty-state">مفيش رسايل لسه.</div>`;
      else state.board.slice().reverse().forEach(b => {
        html += `<div class="info-card" style="padding:10px 14px;"><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-size:11px;font-weight:800;color:var(--blue-lt);">${esc(b.author)}</span><span style="font-size:10px;color:var(--dim);">${new Date(b.date).toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})}</span></div><div style="font-size:13px;color:#eee;margin-bottom:8px;">${esc(b.text)}</div><div class="reaction-row">`;
        let reacts = b.reactions || {};
        ['👍','👏','😂'].forEach(emo => { let users = reacts[emo] || []; let active = users.includes(currentUserPhone) ? 'active' : ''; html += `<button class="reaction-btn ${active}" onclick="toggleBoardReaction('${b.id}', '${emo}')">${emo} <span>${users.length}</span></button>`; });
        html += `</div>`;
        if(isAdmin) html += `<button onclick="delBoardMsg('${b.id}')" style="background:none;border:none;color:var(--red);font-size:12px;margin-top:5px;cursor:pointer;">🗑 حذف الرسالة</button>`;
        html += `</div>`;
      });
  }
  el.innerHTML = html;
}

window.showReactors = function(mid, emo) {
    const m = state.moments.find(x => x.id === mid); if(!m) return;
    const users = (m.reactions && m.reactions[emo]) || [];
    let names = [];
    users.forEach(phone => {
        if(phone === 'admin') names.push('المدير');
        else {
            const u = approvedUsers.find(x => x.phone === phone);
            names.push(u ? u.name : phone);
        }
    });
    if(!names.length) return alert("مفيش حد عمل رياكشن ده");
    openModal(`<h3>${emo} المتفاعلين (${names.length})</h3><div style="font-size:14px;line-height:1.8;color:#fff">${names.map(n => '• ' + esc(n)).join('<br>')}</div>`);
};

window.delBoardMsg = async function(id) { if(!confirm('حذف الرسالة؟')) return; state.board = state.board.filter(b => b.id !== id); await save(); };
window.uploadMoment = function() { openModal(`<h3>📸 لقطة جديدة</h3><input type="file" id="moment_file" accept="image/*" style="margin-bottom:10px;"><textarea id="moment_text" placeholder="اكتب تعليقك..." style="width:100%;padding:12px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;color:#fff;min-height:70px;margin-bottom:10px;"></textarea><button class="btn-purple" onclick="saveMoment()">نشر اللقطة</button>`); };
window.saveMoment = async function() {
    const fileInp = document.getElementById('moment_file'); const text = document.getElementById('moment_text').value;
    if(!fileInp.files || !fileInp.files[0]) return alert("اختار صورة!");
    const file = fileInp.files[0]; const reader = new FileReader();
    reader.onload = (ev) => {
        const img = new Image();
        img.onload = async () => {
            const canvas = document.createElement('canvas'); const MAX = 600; let w = img.width, h = img.height;
            if(w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } }
            canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const base64 = canvas.toDataURL('image/jpeg', 0.5);
            if(!state.moments) state.moments = [];
            state.moments.push({ id: uid(), author: currentUserPhone !== 'admin' ? currentUserPhone : 'المدير', authorPhone: currentUserPhone, text: text, photo: base64, reactions: {}, date: new Date().toISOString() });
            await save(); closeModal();
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
};
window.deleteMoment = async function(id) { if(!confirm('حذف اللقطة؟')) return; state.moments = state.moments.filter(m => m.id !== id); await save(); };
window.toggleReaction = async function(mid, emo) { const m = state.moments.find(x => x.id === mid); if(!m) return; if(!m.reactions) m.reactions = {}; if(!m.reactions[emo]) m.reactions[emo] = []; const idx = m.reactions[emo].indexOf(currentUserPhone); if(idx > -1) m.reactions[emo].splice(idx, 1); else m.reactions[emo].push(currentUserPhone); await save(); };
window.toggleBoardReaction = async function(bid, emo) { const b = state.board.find(x => x.id === bid); if(!b) return; if(!b.reactions) b.reactions = {}; if(!b.reactions[emo]) b.reactions[emo] = []; const idx = b.reactions[emo].indexOf(currentUserPhone); if(idx > -1) b.reactions[emo].splice(idx, 1); else b.reactions[emo].push(currentUserPhone); await save(); };
window.addBoardMsg = async function() { const inp = $('#boardMsgInput'); if(!inp || !inp.value.trim()) return; if(!state.board) state.board = []; state.board.push({ id: uid(), author: currentUserPhone !== 'admin' ? currentUserPhone : 'المدير', text: inp.value.trim(), date: new Date().toISOString(), reactions: {} }); await save(); };

// ============ 7. الإعلانات ============
function renderAnns() {
  const el = $('#panel-6');
  let html = `<div class="section-header">📢 الإعلانات الرسمية</div>`;
  if(isAdmin || isCoach) html += `<div class="info-card"><input id="annText" placeholder="عنوان الإعلان" style="width:100%;padding:12px;background:rgba(0,0,0,.4);border:1px solid rgba(59,130,246,.25);border-radius:10px;color:#fff;margin-bottom:8px"><button class="btn-purple" onclick="addAnn()">نشر</button></div>`;
  if(!state.announcements.length) html += `<div class="empty-state">مفيش إعلانات</div>`;
  else state.announcements.slice().reverse().forEach(a => { html += `<div class="info-card"><div class="info-card-title"><span>${esc(a.text)}</span>${isAdmin?`<button onclick="delAnn('${a.id}')" style="background:none;border:none;color:var(--red);cursor:pointer">🗑</button>`:''}</div><div class="info-card-meta">${new Date(a.date).toLocaleString('ar-EG')}</div></div>`; });
  el.innerHTML = html;
}
window.addAnn = async function() { const t = $('#annText').value; if(!t) return; state.announcements.push({id:uid(), text:t, date:new Date().toISOString()}); await save(); };
window.delAnn = async function(id) { if(!confirm('حذف؟')) return; state.announcements = state.announcements.filter(x=>x.id!==id); await save(); };

window.showPendingModal = function() {
  let html = `<h3>🔔 طلبات الانضمام (${pendingUsers.length})</h3>`;
  if(!pendingUsers.length) html += `<div class="empty-state">مفيش طلبات جديدة</div>`;
  else pendingUsers.forEach(u => { html += `<div class="pending-request"><div class="pr-info"><div class="pr-name">${esc(u.name)}</div><div class="pr-phone">📱 ${esc(u.phone)}</div><div class="pr-date">🎂 ${esc(u.dob)}</div></div><div class="pr-actions"><button class="btn-approve" onclick="approveUser('${u.uid}')">✓</button><button class="btn-reject" onclick="rejectUser('${u.uid}')">✗</button></div></div>`; });
  openModal(html);
};
function renderAdmin() {
  if(!isAdmin) return;
  const el = $('#panel-7');
  let html = `<div class="admin-section"><div class="admin-section-header"><div class="admin-section-icon">🛡️</div><div class="admin-section-title">شعار الفريق واسمه</div></div><div class="admin-card"><div class="admin-logo-row"><div class="admin-logo-preview">${state.team.logo?`<img src="${state.team.logo}">`:'⚽'}</div><div class="admin-logo-info"><input id="teamNameInput" value="${esc(state.team.name)}"><button class="btn-purple btn-sm" onclick="saveTeamName()">حفظ الاسم</button><button class="btn-purple btn-sm btn-ghost" onclick="uploadLogo()">📤 رفع شعار</button></div></div></div></div>
    <div class="admin-section"><div class="admin-section-header"><div class="admin-section-icon">🖼️</div><div class="admin-section-title">خلفية شاشة الدخول</div></div><div class="admin-card"><div class="admin-bg-preview" style="${state.team.loginBg?`background-image:url(${state.team.loginBg})`:''}">${!state.team.loginBg?'مفيش خلفية':''}</div><div class="admin-bg-actions"><button class="btn-purple" onclick="uploadLoginBg()">📤 تغيير</button><button class="btn-purple btn-danger" onclick="removeLoginBg()">🗑 إزالة</button></div></div></div>
    <div class="admin-section"><div class="admin-section-header"><div class="admin-section-icon">🔥</div><div class="admin-section-title">رسالة التحفيز الأسبوعية</div></div><div class="admin-card"><input id="motivationInput" value="${esc(state.team.motivation||'')}" placeholder="سيبها فاضية لرسائل تلقائية" style="width:100%;padding:10px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:8px;color:#fff;margin-bottom:8px"><button class="btn-purple btn-sm" onclick="saveMotivation()">حفظ</button></div></div>
    <div class="admin-section"><div class="admin-section-header"><div class="admin-section-icon">📨</div><div class="admin-section-title">طلبات الانضمام (${pendingUsers.length})</div></div><div class="admin-card">`;
  if(!pendingUsers.length) html += `<div style="text-align:center;color:var(--dim);font-size:12px;padding:12px">مفيش طلبات</div>`;
  else pendingUsers.forEach(u => { html += `<div class="pending-request"><div class="pr-info"><div class="pr-name">${esc(u.name)}</div><div class="pr-phone">📱 ${esc(u.phone)}</div><div class="pr-date">🎂 ${esc(u.dob)}</div></div><div class="pr-actions"><button class="btn-approve" onclick="approveUser('${u.uid}')">✓</button><button class="btn-reject" onclick="rejectUser('${u.uid}')">✗</button></div></div>`; });
  html += `</div></div>
    <div class="admin-section"><div class="admin-section-header"><div class="admin-section-icon">👑</div><div class="admin-section-title">الصلاحيات (${approvedUsers.length})</div></div><div class="admin-card">`;
  approvedUsers.forEach(u => {
    const isMain = u.phone === 'admin';
    html += `<div class="perm-row ${isMain?'main':''}"><div class="perm-info"><div class="perm-name">${esc(u.name)} ${isMain?'👑':''}</div><div class="perm-meta"><span class="perm-role ${isMain?'role-main':'role-'+u.role}">${isMain?'الأدمن الرئيسي':(u.role==='coach'?'مدير فني':(u.role==='supervisor'?'مشرف':'لاعب'))}</span><span>${esc(u.phone)}</span></div></div>`;
    if(isMain) html += `<div class="perm-lock">🔒</div>`;
    else html += `<select onchange="changeRole('${u.uid}', this.value)" style="width:auto;padding:6px;font-size:11px;background:rgba(0,0,0,.5);border:1px solid rgba(59,130,246,.35);border-radius:8px;color:#fff"><option value="player" ${u.role==='player'?'selected':''}>لاعب</option><option value="coach" ${u.role==='coach'?'selected':''}>مدير فني</option><option value="supervisor" ${u.role==='supervisor'?'selected':''}>مشرف</option></select>`;
    html += `</div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
}
window.saveMotivation = async function() { state.team.motivation = $('#motivationInput').value; await save(); alert('تم الحفظ'); };
window.saveTeamName = async function() { state.team.name = $('#teamNameInput').value || 'فريق بني برزه'; await save(); updateUI(); };
window.uploadLogo = function() { const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.onchange = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { const img = new Image(); img.onload = async () => { const canvas = document.createElement('canvas'); const MAX = 200; let w = img.width, h = img.height; if(w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } } canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h); state.team.logo = canvas.toDataURL('image/jpeg', 0.7); await save(); updateUI(); }; img.src = ev.target.result; }; reader.readAsDataURL(file); }; input.click(); };
window.uploadLoginBg = function() { const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.onchange = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { const img = new Image(); img.onload = async () => { const canvas = document.createElement('canvas'); const MAX = 800; let w = img.width, h = img.height; if(w > h) { if(w > MAX) { h *= MAX/w; w = MAX; } } else { if(h > MAX) { w *= MAX/h; h = MAX; } } canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h); state.team.loginBg = canvas.toDataURL('image/jpeg', 0.5); await save(); }; img.src = ev.target.result; }; reader.readAsDataURL(file); }; input.click(); };
window.removeLoginBg = async function() { state.team.loginBg = ""; await save(); };
/* ✨ NEW: isJoker: false افتراضي لما يوافق على لاعب جديد */
window.approveUser = async function(uid) { if(!isAdmin) return; const snap = await getDoc(doc(db, "users", uid)); if(snap.exists()) { const data = snap.data(); const exists = state.players.find(p => p.name === data.name && p.phone === data.phone); if(!exists) { state.players.push({ id: uid, name: data.name, phone: data.phone, position: 'لاعب', photo: '', profileBg: '', challenge: null, isJoker: false, stats: { pace:70, shooting:70, passing:70, dribbling:70, defending:70, physical:70 } }); await save(); } } await updateDoc(doc(db, "users", uid), { role: 'player' }); closeModal(); };
window.rejectUser = async function(uid) { await updateDoc(doc(db, "users", uid), { role: 'rejected' }); closeModal(); };
window.changeRole = async function(uid, role) { await updateDoc(doc(db, "users", uid), { role: role }); };

window.openModal = function(html) { $('#modalContent').innerHTML = html; $('#modalBg').classList.add('show'); };
window.closeModal = function() { $('#modalBg').classList.remove('show'); };

window.showView('login');
