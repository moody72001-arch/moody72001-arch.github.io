<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050a15">
<title>FC ARENA</title>
<style>
:root{
  --gold:#d4af37;--gold-lt:#f5d76e;--gold-dk:#8a6d1f;
  --blue:#3b82f6;--blue-lt:#93c5fd;--blue-dk:#1e40af;--blue-mid:#2563eb;
  --bg:#050a15;--card:#0c1425;--card-2:#131d33;
  --text:#fff;--dim:#7a8499;--red:#e74c3c;--green:#27ae60;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
input,select,button,textarea{font-family:inherit}

/* AUTH (gold, unchanged) */
.bg-anim{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 20% 20%,rgba(212,175,55,.18),transparent 45%),radial-gradient(ellipse at 80% 80%,rgba(212,175,55,.12),transparent 45%),linear-gradient(135deg,#000,#0a0805 50%,#000);overflow:hidden}
.ball{position:absolute;font-size:44px;opacity:.07;animation:drift 30s linear infinite}
.ball-1{top:10%;left:15%}.ball-2{top:70%;left:80%;animation-delay:-5s}.ball-3{top:30%;left:70%;animation-delay:-10s}.ball-4{top:80%;left:20%;animation-delay:-15s}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(30px,-40px) rotate(90deg)}50%{transform:translate(-20px,30px) rotate(180deg)}75%{transform:translate(40px,20px) rotate(270deg)}100%{transform:translate(0,0) rotate(360deg)}}
.auth-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.auth-card{position:relative;z-index:1;width:100%;max-width:400px;background:rgba(15,12,8,.88);backdrop-filter:blur(20px);border:1px solid rgba(212,175,55,.35);border-radius:24px;padding:28px 22px;box-shadow:0 0 100px rgba(212,175,55,.12),0 20px 60px rgba(0,0,0,.8)}
.auth-logo{display:flex;justify-content:center;margin-bottom:8px}
.logo-circle{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 40px rgba(212,175,55,.6)}
.auth-brand{text-align:center;font-size:26px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.auth-sub{text-align:center;font-size:12px;color:var(--dim);margin-bottom:22px}
.field{position:relative;margin-bottom:12px}
.field-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:17px;pointer-events:none;opacity:.8}
.field input{width:100%;padding:15px 46px 15px 14px;background:rgba(0,0,0,.4);border:1px solid rgba(212,175,55,.2);border-radius:12px;color:var(--text);font-size:14px}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
.btn-gold{position:relative;width:100%;padding:15px;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);border:none;border-radius:12px;color:#000;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px}
.auth-switch{text-align:center;font-size:13px;color:var(--dim);margin-top:18px}
.auth-switch a{color:var(--gold);font-weight:700;cursor:pointer}
.pending-icon{text-align:center;font-size:70px;margin:10px 0}
.pending-title{text-align:center;font-size:20px;font-weight:800;color:var(--gold-lt);margin-bottom:10px}
.pending-text{text-align:center;font-size:13px;color:var(--dim);line-height:1.7;margin-bottom:24px}

/* APP (blue) */
.app{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:linear-gradient(180deg,#050912,#050a15 40%,#050912)}
.app.show{display:flex}
.app-header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,#0a1424,#0f1a30);border-bottom:2px solid var(--blue-mid);box-shadow:0 4px 24px rgba(37,99,235,.25)}
.app-logo{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#3b82f6,#1e40af);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;box-shadow:0 0 18px rgba(59,130,246,.5)}
.app-logo img{width:100%;height:100%;object-fit:cover}
.app-title{flex:1;font-size:16px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#93c5fd,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.icon-btn{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);color:var(--blue-lt);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
.tabs-nav{flex-shrink:0;background:#0a1424;border-bottom:1px solid rgba(59,130,246,.18);overflow-x:auto;scrollbar-width:none}
.tabs-nav::-webkit-scrollbar{display:none}
.tabs-scroll{display:flex;gap:6px;padding:10px 12px;min-width:max-content}
.tab-btn{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);color:var(--dim);padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:600;transition:all .2s}
.tab-btn.active{background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff;border-color:var(--blue);box-shadow:0 4px 18px rgba(59,130,246,.5)}
.tabs-container{flex:1;overflow-y:auto;overflow-x:hidden}
.tab-panel{display:none;width:100%;height:100%;overflow-y:auto;padding:16px;padding-bottom:60px}
.tab-panel.active{display:block;animation:panelIn .25s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.section-header{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;color:var(--blue-lt);margin:8px 0 14px;padding-bottom:10px;border-bottom:1px solid rgba(59,130,246,.25)}
.section-header .count{background:rgba(59,130,246,.18);color:var(--blue-lt);padding:2px 10px;border-radius:10px;font-size:12px;font-weight:700}
.empty-state{text-align:center;padding:50px 20px;color:var(--dim);font-size:14px}
.empty-icon{font-size:60px;opacity:.4;margin-bottom:12px}
.btn-purple{position:relative;width:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#1e40af);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px;box-shadow:0 4px 18px rgba(59,130,246,.35)}
.btn-purple:active{transform:scale(.98)}

/* Players */
.player-list{display:flex;flex-direction:column;gap:10px}
.player-card{display:flex;align-items:center;gap:8px;padding:12px;background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.2);border-radius:16px}
.player-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#1a2a44,#050a15);border:2px solid var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;box-shadow:0 0 15px rgba(59,130,246,.25)}
.player-avatar img{width:100%;height:100%;object-fit:cover}
.player-info{flex:1;min-width:0}
.player-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-pos{font-size:11px;color:var(--blue-lt);margin-top:2px;font-weight:600}
.player-actions{display:flex;gap:3px;flex-shrink:0}
.icon-action{width:32px;height:32px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.28);border-radius:9px;color:var(--blue-lt);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-action:active{transform:scale(.9);background:rgba(59,130,246,.25)}
.icon-action.danger{color:var(--red);border-color:rgba(231,76,60,.4);background:rgba(231,76,60,.08)}
.icon-action.danger:active{background:rgba(231,76,60,.25)}

/* CARDS SUBTABS */
.cards-subtabs{display:flex;gap:6px;margin-bottom:14px;background:rgba(59,130,246,.06);padding:4px;border-radius:14px;border:1px solid rgba(59,130,246,.2)}
.subtabs-btn{flex:1;padding:10px;background:transparent;border:none;color:var(--dim);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.subtabs-btn.active{background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.4)}

/* FIFA CARDS */
.cards-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cards-toolbar button{flex:1;min-width:140px;padding:10px;background:linear-gradient(135deg,#3b82f6,#1e40af);border:none;border-radius:10px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 3px 12px rgba(59,130,246,.3);transition:all .2s}
.cards-toolbar button:active{transform:scale(.97)}
.cards-toolbar button.active{background:linear-gradient(135deg,#f5d76e,#d4af37);color:#000}

.cards-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.fifa-card-wrap{width:100%;max-width:none;min-width:0;perspective:1200px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.fifa-card-3d{position:relative;width:100%;aspect-ratio:2/3;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.9,.3,1);will-change:transform}

@keyframes cardSway{0%,100%{transform:rotateY(-8deg) rotateX(4deg) scale(1)}50%{transform:rotateY(8deg) rotateX(-4deg) scale(1.02)}}
.cards-grid-2.motion .fifa-card-3d{animation:cardSway 3s ease-in-out infinite}
.cards-grid-2.motion .fifa-card-wrap:nth-child(2n) .fifa-card-3d{animation-delay:-1.5s}
.cards-grid-2.motion .fifa-card-wrap:nth-child(3n) .fifa-card-3d{animation-delay:-1s}

.fifa-card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.2,.2,1)}
.fifa-card.flipped{transform:rotateY(180deg)}

/* CHAMFERED FACE */
.fifa-face{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  clip-path:polygon(16px 0%,calc(100% - 16px) 0%,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0% calc(100% - 16px),0% 16px);
  background:linear-gradient(135deg,#1e40af,#0a1428,#1e40af);
  box-shadow:0 8px 24px rgba(0,0,0,.7);
}
.fifa-face.fifa-back{transform:rotateY(180deg)}

.fifa-content{
  position:absolute;inset:2px;
  clip-path:polygon(15px 0%,calc(100% - 15px) 0%,100% 15px,100% calc(100% - 15px),calc(100% - 15px) 100%,15px 100%,0% calc(100% - 15px),0% 15px);
  padding:8px;display:flex;flex-direction:column;
  overflow:hidden;position:relative;
  background:linear-gradient(160deg,#0a1428,#050a15);
}
.fifa-content::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);
  background-size:200% 100%;
  animation:shineSweep 4s ease-in-out infinite;
  pointer-events:none;z-index:6;
}
@keyframes shineSweep{0%{background-position:-100% 0}100%{background-position:200% 0}}

/* Tier colors */
[data-tier="gold"] .fifa-face{background:linear-gradient(135deg,#f5d76e,#8a6d1f,#f5d76e)}
[data-tier="gold"] .fifa-content{background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.5),transparent 45%),linear-gradient(160deg,#b8942a,#f5d76e 18%,#d4af37 40%,#8a6d1f 60%,#d4af37 82%,#b8942a)}
[data-tier="silver"] .fifa-face{background:linear-gradient(135deg,#e8e8e8,#5a5a5a,#e8e8e8)}
[data-tier="silver"] .fifa-content{background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.6),transparent 45%),linear-gradient(160deg,#9a9a9a,#e8e8e8 18%,#c8c8c8 40%,#787878 60%,#c8c8c8 82%,#9a9a9a)}
[data-tier="bronze"] .fifa-face{background:linear-gradient(135deg,#d4a373,#4a2f15,#d4a373)}
[data-tier="bronze"] .fifa-content{background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.3),transparent 45%),linear-gradient(160deg,#7a4a20,#d4a373 18%,#b8865f 40%,#6b4423 60%,#b8865f 82%,#7a4a20)}
[data-tier="icon"] .fifa-face{background:linear-gradient(135deg,#d4af37,#000,#d4af37,#8a6d1f,#d4af37)}
[data-tier="icon"] .fifa-content{background:radial-gradient(circle at 50% 15%,rgba(212,175,55,.35),transparent 60%),linear-gradient(160deg,#0a0805,#2a1e08 25%,#000 50%,#2a1e08 75%,#0a0805)}

/* LEGENDARY tier */
[data-tier="legendary"] .fifa-face{
  background:linear-gradient(135deg,#f5d76e 0%,#000 20%,#d4af37 40%,#000 60%,#f5d76e 80%,#8a6d1f 100%);
  background-size:200% 200%;
  animation:legendaryShift 4s ease-in-out infinite;
}
@keyframes legendaryShift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
[data-tier="legendary"] .fifa-content{
  background:
    radial-gradient(circle at 50% 20%,rgba(245,215,110,.2),transparent 55%),
    conic-gradient(from 45deg at 50% 50%,#0a0a0a 0deg,#1a1208 90deg,#0a0a0a 180deg,#1a1208 270deg,#0a0a0a 360deg);
}
[data-tier="legendary"] .fifa-content::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(45deg,transparent 40%,rgba(245,215,110,.25) 50%,transparent 60%);
  background-size:200% 200%;
  animation:shineSweep 3s ease-in-out infinite;
  pointer-events:none;z-index:5;
}

.fifa-expand{position:absolute;top:6px;right:6px;width:32px;height:32px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);border-radius:50%;color:#fff;font-size:14px;cursor:pointer;z-index:15;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.fifa-expand:active{transform:scale(.9);background:rgba(0,0,0,.8)}
.fifa-del{position:absolute;top:6px;left:6px;width:32px;height:32px;background:rgba(231,76,60,.85);border:1px solid rgba(255,255,255,.4);border-radius:50%;color:#fff;font-size:14px;cursor:pointer;z-index:15;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.fifa-del:active{transform:scale(.9)}
.fifa-edit{position:absolute;top:44px;left:6px;width:32px;height:32px;background:rgba(59,130,246,.85);border:1px solid rgba(255,255,255,.4);border-radius:50%;color:#fff;font-size:14px;cursor:pointer;z-index:15;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.fifa-edit:active{transform:scale(.9)}

.fifa-top{display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;position:relative;z-index:2}
.fifa-rating-block{display:flex;flex-direction:column;align-items:center;padding:3px 8px;border-radius:6px;min-width:46px;flex-shrink:0}
.fifa-overall{font-size:22px;font-weight:900;line-height:1}
.fifa-position{font-size:9px;font-weight:800;margin-top:1px;letter-spacing:.5px}

[data-tier="gold"] .fifa-rating-block{background:linear-gradient(135deg,#1a1208,#2a1e08);color:#f5d76e;border:1px solid rgba(245,215,110,.5)}
[data-tier="silver"] .fifa-rating-block{background:linear-gradient(135deg,#1a1a1a,#2a2a2a);color:#e8e8e8;border:1px solid rgba(232,232,232,.45)}
[data-tier="bronze"] .fifa-rating-block{background:linear-gradient(135deg,#1a1208,#2a1e08);color:#d4a373;border:1px solid rgba(212,163,115,.5)}
[data-tier="icon"] .fifa-rating-block{background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);color:#1a1208;border:1px solid #f5d76e;box-shadow:0 0 20px rgba(245,215,110,.6)}
[data-tier="legendary"] .fifa-rating-block{background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);color:#1a1208;border:1px solid #f5d76e;box-shadow:0 0 25px rgba(245,215,110,.8)}

.fifa-photo-wrap{flex:1;display:flex;justify-content:center;align-items:flex-start;padding-top:2px}
.fifa-photo-circle{width:72px;height:72px;border-radius:50%;overflow:hidden;border:2.5px solid;box-shadow:0 4px 10px rgba(0,0,0,.4);background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:26px}
[data-tier="gold"] .fifa-photo-circle{border-color:#1a1208}
[data-tier="silver"] .fifa-photo-circle{border-color:#1a1a1a}
[data-tier="bronze"] .fifa-photo-circle{border-color:#1a1208}
[data-tier="icon"] .fifa-photo-circle{border-color:#f5d76e;box-shadow:0 0 18px rgba(245,215,110,.6)}
[data-tier="legendary"] .fifa-photo-circle{border-color:#f5d76e;box-shadow:0 0 25px rgba(245,215,110,.7)}
.fifa-photo-circle img{width:100%;height:100%;object-fit:cover}

.fifa-name-bar{margin-top:auto;margin-bottom:4px;padding:4px 8px;border-top:1px solid rgba(0,0,0,.2);border-bottom:1px solid rgba(0,0,0,.2);position:relative;z-index:2}
.fifa-name{font-size:11px;font-weight:900;text-align:center;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-tier="gold"] .fifa-name{color:#1a1208}
[data-tier="silver"] .fifa-name{color:#1a1a1a}
[data-tier="bronze"] .fifa-name{color:#1a1208}
[data-tier="icon"] .fifa-name{color:#f5d76e;text-shadow:0 0 8px rgba(245,215,110,.5)}
[data-tier="legendary"] .fifa-name{color:#f5d76e;text-shadow:0 0 10px rgba(245,215,110,.7);font-size:11px}

.fifa-stats{position:relative;z-index:2;padding:2px 0;direction:ltr}
.fifa-stat-row{display:flex;gap:3px;margin-bottom:3px}
.fifa-stat{flex:1;text-align:center;padding:2px;border-radius:3px;background:rgba(0,0,0,.15)}
.fifa-stat b{display:block;font-size:13px;font-weight:900;line-height:1}
.fifa-stat span{font-size:7px;font-weight:700;letter-spacing:.3px;display:block;margin-top:1px}
[data-tier="gold"] .fifa-stat b{color:#1a1208}
[data-tier="gold"] .fifa-stat span{color:rgba(26,18,8,.7)}
[data-tier="silver"] .fifa-stat b{color:#1a1a1a}
[data-tier="silver"] .fifa-stat span{color:rgba(26,26,26,.7)}
[data-tier="bronze"] .fifa-stat b{color:#1a1208}
[data-tier="bronze"] .fifa-stat span{color:rgba(26,18,8,.7)}
[data-tier="icon"] .fifa-stat{background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.2)}
[data-tier="icon"] .fifa-stat b{color:#f5d76e}
[data-tier="icon"] .fifa-stat span{color:rgba(245,215,110,.65)}
[data-tier="legendary"] .fifa-stat{background:rgba(245,215,110,.15);border:1px solid rgba(245,215,110,.3)}
[data-tier="legendary"] .fifa-stat b{color:#f5d76e}
[data-tier="legendary"] .fifa-stat span{color:rgba(245,215,110,.75)}

.fifa-extra{display:flex;justify-content:space-between;align-items:center;padding:3px 2px 0;border-top:1px solid rgba(0,0,0,.15);font-size:9px;font-weight:800;position:relative;z-index:2;margin-top:3px}
.fifa-stars{letter-spacing:-.5px;font-size:10px}
[data-tier="gold"] .fifa-extra{color:#1a1208}
[data-tier="silver"] .fifa-extra{color:#1a1a1a}
[data-tier="bronze"] .fifa-extra{color:#1a1208}
[data-tier="icon"] .fifa-extra{color:#f5d76e}
[data-tier="legendary"] .fifa-extra{color:#f5d76e}

/* BACK face content */
.fifa-back-content{margin-top:auto;padding:10px 8px;position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.fifa-back-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,9,25,.3),rgba(10,6,18,.9));z-index:0}
.fifa-back-top{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:3}
.fifa-back-btn{width:30px;height:30px;background:rgba(0,0,0,.7);border:1px solid var(--blue);border-radius:50%;color:var(--blue-lt);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.fifa-back-btn:active{transform:scale(.9)}
.fifa-back-ovr{font-size:32px;font-weight:900;color:var(--blue-lt);line-height:1;text-shadow:0 2px 12px rgba(59,130,246,.7)}
.fifa-back-name{font-size:14px;font-weight:900;color:#fff;margin-top:4px;letter-spacing:.8px;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.fifa-back-pos{font-size:10px;color:var(--blue-lt);margin-top:3px;letter-spacing:2px;font-weight:700;opacity:.85}
.fifa-back-brand{font-size:8px;color:rgba(147,197,253,.6);margin-top:8px;letter-spacing:2px;font-weight:700}
[data-tier="legendary"] .fifa-back-ovr{color:#f5d76e;text-shadow:0 0 20px rgba(245,215,110,.8)}
[data-tier="legendary"] .fifa-back-pos{color:#f5d76e}
[data-tier="legendary"] .fifa-back-btn{border-color:#f5d76e;color:#f5d76e}

/* LEGENDARY CAROUSEL (Coverflow) */
.legendary-toolbar{display:flex;gap:8px;margin-bottom:10px}
.legendary-toolbar button{flex:1;padding:10px;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);border:none;border-radius:10px;color:#000;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 3px 14px rgba(212,175,55,.4)}
.legendary-carousel{position:relative;height:400px;perspective:1400px;overflow:hidden;margin:0 -16px;padding:0 16px}
.legendary-stage{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.legendary-card{position:absolute;left:50%;top:50%;width:200px;height:300px;margin-left:-100px;margin-top:-150px;transition:all .7s cubic-bezier(.2,.9,.3,1);cursor:pointer;transform-origin:center center}
.legendary-card .fifa-card-wrap{width:100%;height:100%;perspective:none}
.legendary-card .fifa-card-3d{width:100%;height:100%;aspect-ratio:auto}
.legendary-card .fifa-card{width:100%;height:100%}
.legendary-card.active .fifa-card-3d{animation:legendFloat 3s ease-in-out infinite}
@keyframes legendFloat{0%,100%{transform:translateY(-4px) rotateY(0deg)}50%{transform:translateY(4px) rotateY(0deg)}}
.legendary-indicator{text-align:center;color:var(--gold-lt);font-size:12px;font-weight:700;margin-top:10px;letter-spacing:2px}

/* PREVIEW */
.preview-overlay{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,rgba(59,130,246,.2),rgba(0,0,0,.96));backdrop-filter:blur(8px);animation:fadeIn .3s ease}
.preview-overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.preview-content{max-width:300px;width:100%;position:relative;animation:packOpen .8s cubic-bezier(.2,.9,.3,1)}
@keyframes packOpen{0%{opacity:0;transform:scale(.2) rotateY(180deg) rotateZ(-15deg)}60%{transform:scale(1.05) rotateY(0) rotateZ(2deg)}100%{opacity:1;transform:scale(1) rotateY(0) rotateZ(0)}}
.preview-close{position:absolute;top:-50px;right:0;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer;backdrop-filter:blur(6px)}
.preview-content .fifa-card-wrap{width:100%;max-width:none;min-width:0;cursor:pointer}

/* MATCHES */
.match-item{background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.25);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.match-item:active{transform:scale(.99);border-color:var(--blue)}
.match-title{font-size:14px;font-weight:800;color:var(--blue-lt)}
.match-sub{font-size:12px;color:var(--dim);margin-top:3px}

/* STATS */
.stat-category{margin-bottom:22px}
.stat-cat-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--blue-lt);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(59,130,246,.25)}
.stat-cards{display:flex;flex-direction:column;gap:8px}
.stat-player-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.2);border-radius:14px}
.stat-player-card.rank-1{border-color:var(--blue);background:linear-gradient(135deg,#1a2a44,#1e3a5f);box-shadow:0 0 24px rgba(59,130,246,.3)}
.stat-player-card.rank-2{border-color:rgba(59,130,246,.6);background:linear-gradient(135deg,#152238,#1c2e48)}
.stat-player-card.rank-3{border-color:rgba(59,130,246,.45)}
.stat-rank{width:38px;height:38px;border-radius:50%;background:rgba(59,130,246,.15);border:1.5px solid rgba(59,130,246,.35);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:var(--blue-lt);flex-shrink:0}
.stat-rank.medal{font-size:18px;background:linear-gradient(135deg,#f5d76e,#d4af37,#8a6d1f);color:#000;border-color:#f5d76e;box-shadow:0 0 15px rgba(212,175,55,.5)}
.stat-player-info{flex:1;min-width:0}
.stat-player-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-player-pos{font-size:11px;color:var(--blue-lt);margin-top:2px;font-weight:600;opacity:.85}
.stat-value-box{display:flex;flex-direction:column;align-items:center;padding:6px 14px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.35);border-radius:12px;min-width:60px}
.stat-value{font-size:20px;font-weight:900;color:var(--blue-lt);line-height:1}
.stat-value-label{font-size:9px;color:var(--dim);margin-top:3px;font-weight:600}

/* Forms */
.form-label{display:block;color:var(--blue-lt);font-size:12px;font-weight:700;margin:12px 0 4px}
.modal input,.modal select,.modal textarea{width:100%;padding:12px;background:rgba(0,0,0,.4);border:1px solid rgba(59,130,246,.25);border-radius:10px;color:var(--text);font-size:14px}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--blue)}
.modal textarea{resize:vertical;min-height:70px}
.modal input[type=file]{cursor:pointer;padding:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid-2>div>input,.grid-3>div>input{margin-top:4px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:linear-gradient(135deg,#0d1728,#141e30);border:1px solid rgba(59,130,246,.4);border-radius:20px;padding:22px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto}
.modal h3{color:var(--blue-lt);font-size:18px;font-weight:800;text-align:center;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid rgba(59,130,246,.25)}

/* PROFILE */
.profile-view{position:fixed;inset:0;z-index:60;overflow-y:auto;background:linear-gradient(135deg,#050a15,#0d1728,#050a15);display:none}
.profile-view.show{display:block}
.profile-bg-img{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(40px) brightness(.25);transform:scale(1.2);z-index:0}
.profile-overlay{position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,10,21,.3),rgba(5,10,21,.7) 50%,rgba(5,10,21,.95));z-index:1}
.profile-content{position:relative;z-index:2;min-height:100%;padding:60px 20px 40px;display:flex;flex-direction:column;align-items:center}
.profile-back{position:fixed;top:16px;right:16px;background:rgba(0,0,0,.6);border:1px solid rgba(59,130,246,.5);color:var(--blue-lt);padding:10px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;z-index:3}
.profile-avatar{width:140px;height:140px;border-radius:50%;border:4px solid var(--blue-mid);background:linear-gradient(135deg,#1a2a44,#050a15);display:flex;align-items:center;justify-content:center;font-size:60px;overflow:hidden;box-shadow:0 0 60px rgba(59,130,246,.6);margin-bottom:20px}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:26px;font-weight:900;color:var(--blue-lt);text-align:center;margin-bottom:6px}
.profile-pos{display:inline-block;background:linear-gradient(135deg,#3b82f6,#1e40af);color:#fff;padding:4px 16px;border-radius:20px;font-size:12px;font-weight:800;margin-bottom:24px}
.profile-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:400px;margin-bottom:20px}
.stat-box{background:rgba(12,20,37,.75);border:1px solid rgba(59,130,246,.35);border-radius:14px;padding:14px 8px;text-align:center}
.stat-box b{display:block;font-size:22px;font-weight:900;color:var(--blue-lt);margin-bottom:2px}
.stat-box span{font-size:11px;color:var(--dim);font-weight:600}
.profile-details{width:100%;max-width:400px;background:rgba(12,20,37,.75);border:1px solid rgba(59,130,246,.3);border-radius:14px;padding:16px;font-size:14px;line-height:2;color:#ddd;text-align:center;margin-bottom:24px}
.profile-delete-btn{width:100%;max-width:400px;padding:14px;background:rgba(231,76,60,.1);border:1px solid var(--red);color:var(--red);font-size:14px;font-weight:800;border-radius:14px;cursor:pointer;margin-top:8px}
.profile-delete-btn:active{background:rgba(231,76,60,.25)}

.pending-request{display:flex;gap:12px;padding:14px;background:rgba(0,0,0,.4);border:1px solid rgba(59,130,246,.2);border-radius:12px;margin-bottom:10px}
.pr-info{flex:1}
.pr-name{font-size:15px;font-weight:800;margin-bottom:4px}
.pr-phone,.pr-date{font-size:12px;color:var(--dim);margin-top:2px}
.pr-actions{display:flex;flex-direction:column;gap:6px}
.btn-approve,.btn-reject{width:40px;height:40px;border-radius:10px;border:none;font-size:18px;font-weight:800;cursor:pointer}
.btn-approve{background:linear-gradient(135deg,#27ae60,#1e8449);color:#fff}
.btn-reject{background:rgba(231,76,60,.15);border:1px solid var(--red);color:var(--red)}

.pm-row{background:#0a1424;border:1px solid #1a2a44;border-radius:10px;padding:10px;margin-bottom:8px}
.pm-name{font-size:13px;font-weight:700;color:var(--blue-lt);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.pm-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pm-ctrl{text-align:center;font-size:11px;color:var(--dim)}
.pm-ctrl label{display:block;margin-bottom:2px}
.pm-ctrl input{padding:6px;font-size:14px;text-align:center;margin:0}
.pm-actions{display:flex;gap:6px;margin-top:8px}
.star-btn,.poop-btn{flex:1;background:#0d1728;border:1px solid #333;color:#666;padding:6px;border-radius:8px;cursor:pointer;font-size:12px}
.star-btn.active{background:rgba(59,130,246,.25);border-color:var(--blue);color:var(--blue-lt)}
.poop-btn.active{background:rgba(231,76,60,.15);border-color:var(--red);color:var(--red)}

.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:rgba(59,130,246,.18);color:var(--blue-lt);border:1px solid rgba(59,130,246,.35)}
.pill-red{background:rgba(231,76,60,.15);color:var(--red);border-color:var(--red)}
.role-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;margin-right:4px}
.role-admin{background:rgba(59,130,246,.22);color:var(--blue-lt)}
.role-player{background:rgba(100,150,255,.15);color:#79a7ff}
.role-coach{background:rgba(39,174,96,.2);color:var(--green)}
.role-supervisor{background:rgba(230,126,34,.2);color:#e67e22}

/* Photo picker grid */
.photo-pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.photo-pick-cell{aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid rgba(59,130,246,.3);cursor:pointer;background:#0a1424;display:flex;align-items:center;justify-content:center;font-size:20px}
.photo-pick-cell img{width:100%;height:100%;object-fit:cover}
.photo-pick-cell.selected{border-color:var(--blue);box-shadow:0 0 12px rgba(59,130,246,.6)}
</style>
</head>
<body>

<div class="bg-anim"><span class="ball ball-1">⚽</span><span class="ball ball-2">⚽</span><span class="ball ball-3">⚽</span><span class="ball ball-4">⚽</span></div>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo"><div class="logo-circle">⚽</div></div>
    <div class="auth-brand">FC ARENA</div>
    <div class="auth-sub">إدارة فريقك باحترافية</div>
    <div id="loginView">
      <div class="field"><span class="field-icon">📱</span><input type="tel" id="loginPhone" placeholder="رقم الموبايل"></div>
      <div class="field"><span class="field-icon">🔒</span><input type="password" id="loginPassword" placeholder="الباسورد"></div>
      <button class="btn-gold" onclick="handleLogin()">تسجيل الدخول</button>
      <div class="auth-switch">ماعندكش حساب؟ <a onclick="showView('signup')">أنشئ حساب</a></div>
    </div>
    <div id="signupView" style="display:none">
      <div class="field"><span class="field-icon">👤</span><input type="text" id="suName" placeholder="اسمك"></div>
      <div class="field"><span class="field-icon">📱</span><input type="tel" id="suPhone" placeholder="رقم الموبايل"></div>
      <div class="field"><span class="field-icon">🎂</span><input type="date" id="suBirth"></div>
      <div class="field"><span class="field-icon">🔒</span><input type="password" id="suPass" placeholder="الباسورد"></div>
      <div class="field"><span class="field-icon">✓</span><input type="password" id="suConfirm" placeholder="تأكيد الباسورد"></div>
      <button class="btn-gold" onclick="handleSignup()">إنشاء الحساب</button>
      <div class="auth-switch">عندك حساب؟ <a onclick="showView('login')">سجل دخول</a></div>
    </div>
    <div id="pendingView" style="display:none">
      <div class="pending-icon">⏳</div>
      <div class="pending-title">طلبك قيد المراجعة</div>
      <div class="pending-text">حسابك اتحول للمدير للموافقة</div>
      <button class="btn-gold" onclick="showView('login')">رجوع</button>
    </div>
  </div>
</div>

<div id="app" class="app">
  <header class="app-header">
    <div class="app-logo">⚽</div>
    <div class="app-title">FC ARENA</div>
    <button class="icon-btn" id="notifBtn" onclick="showPendingModal()" style="display:none">🔔<span class="badge" id="notifBadge" style="display:none">0</span></button>
    <button class="icon-btn" onclick="logout()">🚪</button>
  </header>
  <nav class="tabs-nav">
    <div class="tabs-scroll">
      <button class="tab-btn active" data-tab="0">👥 اللاعبين</button>
      <button class="tab-btn" data-tab="1">🎴 الكروت</button>
      <button class="tab-btn" data-tab="2">⚽ الماتشات</button>
      <button class="tab-btn" data-tab="3">📊 الإحصائيات</button>
      <button class="tab-btn" data-tab="4">📋 القوانين</button>
      <button class="tab-btn" data-tab="5">📢 الإعلانات</button>
      <button class="tab-btn" data-tab="6">⚙️ الإدارة</button>
    </div>
  </nav>
  <div class="tabs-container" id="tabsContainer">
    <section class="tab-panel active" id="panel-0"></section>
    <section class="tab-panel" id="panel-1"></section>
    <section class="tab-panel" id="panel-2"></section>
    <section class="tab-panel" id="panel-3"></section>
    <section class="tab-panel" id="panel-4"></section>
    <section class="tab-panel" id="panel-5"></section>
    <section class="tab-panel" id="panel-6"></section>
  </div>
</div>

<div id="profileView" class="profile-view">
  <div class="profile-bg-img" id="profileBgImg"></div>
  <div class="profile-overlay"></div>
  <div class="profile-content">
    <button class="profile-back" onclick="closeProfile()">← رجوع</button>
    <div class="profile-avatar" id="profileAvatar"></div>
    <h1 class="profile-name" id="profileName"></h1>
    <div class="profile-pos" id="profilePos"></div>
    <div class="profile-stats-grid" id="profileStats"></div>
    <div class="profile-details" id="profileDetails"></div>
    <button class="profile-delete-btn" id="profileDeleteBtn" onclick="deleteFromProfile()">🗑 حذف اللاعب</button>
  </div>
</div>

<div id="previewOverlay" class="preview-overlay" onclick="if(event.target===this)closePreview()">
  <div id="previewContent" class="preview-content"></div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ============ STORAGE ============
var K={users:'fca_users',players:'fca_players',session:'fca_session',matches:'fca_matches',rules:'fca_rules',anns:'fca_anns',team:'fca_team',notif:'fca_notif',legendary:'fca_legendary'};
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('المساحة ممتلئة — جرب صورة أصغر');return false}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function getUsers(){return load(K.users,[])}function setUsers(v){return save(K.users,v)}
function getPlayers(){return load(K.players,[])}function setPlayers(v){return save(K.players,v)}
function getMatches(){return load(K.matches,[])}function setMatches(v){return save(K.matches,v)}
function getRules(){return load(K.rules,[])}function setRules(v){return save(K.rules,v)}
function getAnns(){return load(K.anns,[])}function setAnns(v){return save(K.anns,v)}
function getTeam(){return load(K.team,{name:'FC ARENA',logo:''})}function setTeam(v){return save(K.team,v)}
function getNotifs(){return load(K.notif,[])}function setNotifs(v){return save(K.notif,v)}
function getLegendary(){return load(K.legendary,[])}function setLegendary(v){return save(K.legendary,v)}
function getSession(){return localStorage.getItem(K.session)}
function setSession(id){if(id)localStorage.setItem(K.session,id);else localStorage.removeItem(K.session)}
function me(){var id=getSession();if(!id)return null;var us=getUsers();for(var i=0;i<us.length;i++)if(us[i].id===id)return us[i];return null}
function isAdmin(){var u=me();return u&&u.role==='admin'}
function getPlayerById(id){var ps=getPlayers();for(var i=0;i<ps.length;i++)if(ps[i].id===id)return ps[i];return null}
function getLegendaryById(id){var ls=getLegendary();for(var i=0;i<ls.length;i++)if(ls[i].id===id)return ls[i];return null}

// ============ AUTH ============
function showView(v){
  document.getElementById('loginView').style.display=v==='login'?'block':'none';
  document.getElementById('signupView').style.display=v==='signup'?'block':'none';
  document.getElementById('pendingView').style.display=v==='pending'?'block':'none';
}
function handleLogin(){
  var phone=document.getElementById('loginPhone').value.trim();
  var pass=document.getElementById('loginPassword').value;
  if(!phone||!pass)return alert('اكتب الرقم والباسورد');
  var us=getUsers(),u=null;
  for(var i=0;i<us.length;i++)if(us[i].phone===phone&&us[i].password===pass){u=us[i];break}
  if(!u)return alert('بيانات الدخول غلط');
  if(u.status==='pending')return alert('حسابك في انتظار الموافقة');
  if(u.status==='rejected')return alert('تم رفض حسابك');
  setSession(u.id);enterApp();
}
function handleSignup(){
  var name=document.getElementById('suName').value.trim();
  var phone=document.getElementById('suPhone').value.trim();
  var birth=document.getElementById('suBirth').value;
  var pass=document.getElementById('suPass').value;
  var conf=document.getElementById('suConfirm').value;
  if(!name||!phone||!birth||!pass)return alert('كمل كل الحقول');
  if(pass.length<4)return alert('الباسورد 4 حروف على الأقل');
  if(pass!==conf)return alert('الباسورد مش متطابق');
  var us=getUsers();
  for(var i=0;i<us.length;i++)if(us[i].phone===phone)return alert('الرقم مسجل');
  var isFirst=us.length===0;
  var u={id:uid(),name:name,phone:phone,birthDate:birth,password:pass,status:isFirst?'approved':'pending',role:isFirst?'admin':'player',playerId:null,createdAt:Date.now()};
  us.push(u);setUsers(us);
  if(isFirst){
    var ps=getPlayers();
    var p={id:uid(),name:name,phone:phone,birthDate:birth,position:'لاعب',photo:'',cardBackImage:'',
      stats:{goals:0,assists:0,matches:0,motm:0,rating:0,pace:70,shooting:70,passing:70,dribbling:70,defending:70,physical:70,skills:3,weakFoot:3,jerseyNumber:0}};
    ps.push(p);setPlayers(ps);
    u.playerId=p.id;setUsers(us);setSession(u.id);enterApp();
  }else{
    showView('pending');
    ['suName','suPhone','suBirth','suPass','suConfirm'].forEach(function(id){document.getElementById(id).value=''});
  }
}
function logout(){
  if(!confirm('تسجيل الخروج؟'))return;
  setSession(null);
  document.getElementById('app').classList.remove('show');
  document.getElementById('authScreen').style.display='flex';
  showView('login');
}
function enterApp(){
  var u=me();
  if(!u||u.status!=='approved'){document.getElementById('authScreen').style.display='flex';document.getElementById('app').classList.remove('show');return}
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').classList.add('show');
  var t=getTeam(),lg=document.querySelector('.app-logo');
  if(lg&&t.logo)lg.innerHTML='<img src="'+t.logo+'">';
  renderAll();goTab(0);
}

// ============ TABS ============
var currentTab=0;
function goTab(idx){
  currentTab=idx;
  var panels=document.querySelectorAll('.tab-panel');
  for(var i=0;i<panels.length;i++)panels[i].classList.toggle('active',i===idx);
  var btns=document.querySelectorAll('.tab-btn');
  for(var i=0;i<btns.length;i++)btns[i].classList.toggle('active',i===idx);

function openPhotoUpload(playerId,type){
  var titles={avatar:'📷 صورة اللاعب',back:'🖼️ صورة ظهر الكارت',logo:'🛡️ شعار الفريق'};
  openModal('<h3>'+(titles[type]||'رفع صورة')+'</h3>'+
    '<input type="file" id="photoFileInput" accept="image/*" style="display:block">'+
    '<div id="photoPreview" style="margin:14px 0;text-align:center"></div>'+
    '<button class="btn-purple" onclick="savePhoto(\''+playerId+'\',\''+type+'\')">حفظ الصورة</button>');
  setTimeout(function(){
    var inp=document.getElementById('photoFileInput');
    if(!inp)return;
    inp.onchange=function(e){
      var f=e.target.files&&e.target.files[0];if(!f)return;
      var reader=new FileReader();
      reader.onload=function(ev){
        var prev=document.getElementById('photoPreview');
        if(prev)prev.innerHTML='<img src="'+ev.target.result+'" style="max-width:100%;max-height:200px;border-radius:10px;border:2px solid var(--blue)">';
      };
      reader.readAsDataURL(f);
    };
  },80);
}
function savePhoto(playerId,type){
  var inp=document.getElementById('photoFileInput');
  if(!inp||!inp.files||!inp.files[0])return alert('اختر صورة أول');
  var file=inp.files[0];
  if(file.size>10*1024*1024)return alert('الصورة كبيرة جدًا');
  compressImage(file,type==='avatar'?400:700,0.7).then(function(dataUrl){
    if(type==='logo'){
      var t=getTeam();t.logo=dataUrl;if(!setTeam(t))return;
      document.querySelector('.app-logo').innerHTML='<img src="'+dataUrl+'">';renderAdmin();
    }else{
      var ps=getPlayers(),found=false;
      for(var i=0;i<ps.length;i++)if(ps[i].id===playerId){
        if(type==='avatar')ps[i].photo=dataUrl;else ps[i].cardBackImage=dataUrl;
        found=true;break;
      }
      if(!found)return alert('اللاعب غير موجود');
      if(!setPlayers(ps))return;
      renderPlayers();renderCards();
    }
    closeModal();alert('✓ تم حفظ الصورة');
  }).catch(function(err){alert('فشل: '+err.message)});
}
function compressImage(file,maxW,quality){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        try{
          var canvas=document.createElement('canvas');
          var w=img.width,h=img.height;
          if(w>maxW){h=h*maxW/w;w=maxW}
          if(h>maxW){w=w*maxW/h;h=maxW}
          canvas.width=w;canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg',quality));
        }catch(e){reject(e)}
      };
      img.onerror=function(){reject(new Error('فشل تحميل الصورة'))};
      img.src=reader.result;
    };
    reader.onerror=function(){reject(new Error('فشل قراءة الملف'))};
    reader.readAsDataURL(file);
  });
}

// ============ POSITION & TIER ============
var posMap={'حارس':'GK','مدافع':'CB','وسط':'CM','مهاجم':'ST'};
function posAbbr(pos){return posMap[pos]||'PLAYER'}
function getCardTier(ovr){if(ovr>=90)return 'icon';if(ovr>=80)return 'gold';if(ovr>=70)return 'silver';return 'bronze'}
function calcOverall(p){
  var s=p.stats||{};
  var pace=+s.pace||70,sho=+s.shooting||70,pas=+s.passing||70,dri=+s.dribbling||70,def=+s.defending||70,phy=+s.physical||70;
  var w;
  if(p.position==='حارس')w={pace:.5,sho:.2,pas:1,dri:.8,def:2.5,phy:2};
  else if(p.position==='مدافع')w={pace:1.2,sho:.5,pas:1,dri:.8,def:2.5,phy:2};
  else if(p.position==='وسط')w={pace:1.5,sho:1,pas:2.5,dri:2,def:1,phy:1};
  else w={pace:2,sho:2.5,pas:1,dri:2,def:.3,phy:1.2};
  var total=pace*w.pace+sho*w.sho+pas*w.pas+dri*w.dri+def*w.def+phy*w.phy;
  var wsum=w.pace+w.sho+w.pas+w.dri+w.def+w.phy;
  return Math.round(total/wsum);
}

function updateLegendaryPositions(){
  var stage=document.getElementById('legendaryStage');
  if(!stage)return;
  var cards=stage.querySelectorAll('.legendary-card');
  var total=cards.length;
  if(!total)return;
  for(var i=0;i<cards.length;i++){
    var offset=i-legendaryIndex;
    // wrap around for carousel feel
    if(offset>total/2)offset-=total;
    if(offset<-total/2)offset+=total;
    var abs=Math.abs(offset);
    var card=cards[i];
    if(abs>3){card.style.opacity='0';card.style.pointerEvents='none';card.style.transform='translateX('+(offset>0?400:-400)+'px) scale(0.3)';continue;}
    var translateX=offset*90;
    var translateZ=-abs*80;
    var scale=1-abs*0.12;
    var rotateY=offset*-15;
    var opacity=abs===0?1:(abs===1?0.85:(abs===2?0.55:0.25));
    var zIndex=100-abs;
    card.style.opacity=opacity;
    card.style.pointerEvents='auto';
    card.style.zIndex=zIndex;
    card.style.transform='translateX('+translateX+'px) translateZ('+translateZ+'px) scale('+scale+') rotateY('+rotateY+'deg)';
    card.classList.toggle('active',abs===0);
  }
  var ind=document.getElementById('legendaryIndicator');
  if(ind)ind.textContent=(legendaryIndex+1)+' / '+total;
}

function onLegendaryClick(e,i,el){

  }else{
    legendaryIndex=i;
    updateLegendaryPositions();
    pauseLegendaryAuto(false);
  }
}

function fmtDate(dt){try{var d=new Date(dt);return d.toLocaleDateString('ar-EG',{day:'numeric',month:'short'})+' — '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}catch(e){return dt}}
function openMatchDetail(id){
  var ms=getMatches(),m=null;
  for(var i=0;i<ms.length;i++)if(ms[i].id===id){m=ms[i];break}
  if(!m)return;
  var players=getPlayers(),admin=isAdmin(),rows='';
  for(var j=0;j<players.length;j++){
    var p=players[j];
    var att=(m.attendees||[]).indexOf(p.id)!==-1;
    var g=(m.goals||{})[p.id]||0,a=(m.assists||{})[p.id]||0,r=(m.ratings||{})[p.id]||0;
    rows+='<div class="pm-row"><div class="pm-name"><input type="checkbox" '+(att?'checked':'')+' '+(admin?'':'disabled')+' onchange="toggleAttendee(\''+m.id+'\',\''+p.id+'\',this.checked)" style="width:auto;margin:0">'+esc(p.name)+(m.motm===p.id?' <span class="pill">⭐ أفضل</span>':'')+(m.worst===p.id?' <span class="pill pill-red">💩 أوحش</span>':'')+'</div><div class="pm-controls"><div class="pm-ctrl"><label>أهداف</label><input type="number" min="0" value="'+g+'" '+(admin?'':'disabled')+' onchange="setMatchStat(\''+m.id+'\',\'goals\',\''+p.id+'\',this.value)"></div><div class="pm-ctrl"><label>أسيست</label><input type="number" min="0" value="'+a+'" '+(admin?'':'disabled')+' onchange="setMatchStat(\''+m.id+'\',\'assists\',\''+p.id+'\',this.value)"></div><div class="pm-ctrl"><label>تقييم</label><input type="number" min="0" max="10" value="'+r+'" '+(admin?'':'disabled')+' onchange="setMatchStat(\''+m.id+'\',\'ratings\',\''+p.id+'\',this.value)"></div></div>';
    if(admin){rows+='<div class="pm-actions"><button class="star-btn '+(m.motm===p.id?'active':'')+'" onclick="setAward(\''+m.id+'\',\'motm\',\''+p.id+'\')">⭐ أفضل</button><button class="poop-btn '+(m.worst===p.id?'active':'')+'" onclick="setAward(\''+m.id+'\',\'worst\',\''+p.id+'\')">💩 أوحش</button></div>';}

  }

function toggleAttendee(mid,pid,on){
  var ms=getMatches();
  for(var i=0;i<ms.length;i++)if(ms[i].id===mid){
    if(!ms[i].attendees)ms[i].attendees=[];
    if(on&&ms[i].attendees.indexOf(pid)===-1)ms[i].attendees.push(pid);
    if(!on)ms[i].attendees=ms[i].attendees.filter(function(x){return x!==pid});
    break;
  }
  setMatches(ms);renderMatches();
}
function setMatchStat(mid,field,pid,val){
  var ms=getMatches();
  for(var i=0;i<ms.length;i++)if(ms[i].id===mid){
    if(!ms[i][field])ms[i][field]={};
    ms[i][field][pid]=Math.max(0,+val||0);
    break;
  }
  setMatches(ms);
}
function setAward(mid,field,pid){
  var ms=getMatches();
  for(var i=0;i<ms.length;i++)if(ms[i].id===mid){
    ms[i][field]=(ms[i][field]===pid)?null:pid;
    break;
  }
  setMatches(ms);openMatchDetail(mid);
}
function deleteMatch(id){
  if(!confirm('حذف الماتش؟'))return;
  setMatches(getMatches().filter(function(m){return m.id!==id}));
  closeModal();renderMatches();renderStats();
}

// ============ STATS ============
function renderStats(){
  var el=document.getElementById('panel-3');
  var players=getPlayers(),ms=getMatches();
  if(!players.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">📊</div><div>ضيف لاعبين الأول</div></div>';return}
  var agg={};
  for(var i=0;i<players.length;i++){var p=players[i];agg[p.id]={id:p.id,name:p.name,pos:p.position,goals:0,assists:0,matches:0,motm:0,rsum:0,rcount:0}}
  for(var j=0;j<ms.length;j++){
    var m=ms[j],atts=m.attendees||[];
    for(var k=0;k<atts.length;k++)if(agg[atts[k]])agg[atts[k]].matches++;
    var gs=m.goals||{};for(var gid in gs)if(agg[gid])agg[gid].goals+=+gs[gid]||0;
    var as=m.assists||{};for(var aid in as)if(agg[aid])agg[aid].assists+=+as[aid]||0;
    var rs=m.ratings||{};for(var rid in rs)if(agg[rid]&&rs[rid]){agg[rid].rsum+=+rs[rid];agg[rid].rcount++}
    if(m.motm&&agg[m.motm])agg[m.motm].motm++;
  }
  var arr=[];for(var id in agg){var a=agg[id];a.avg=a.rcount?a.rsum/a.rcount:0;arr.push(a)}
  function cat(title,list,label){
    if(!list.length)return '';
    var h='<div class="stat-category"><div class="stat-cat-title">'+title+'</div><div class="stat-cards">';
    for(var i=0;i<list.length;i++){var r=list[i];
      var rc=i===0?'rank-1':(i===1?'rank-2':(i===2?'rank-3':''));
      var ri=i===0?'🥇':(i===1?'🥈':(i===2?'🥉':(i+1)));
      var rm=i<3?'medal':'';
      h+='<div class="stat-player-card '+rc+'"><div class="stat-rank '+rm+'">'+ri+'</div><div class="stat-player-info"><div class="stat-player-name">'+esc(r.name)+'</div><div class="stat-player-pos">'+esc(r.pos||'لاعب')+'</div></div><div class="stat-value-box"><div class="stat-value">'+r.val+'</div><div class="stat-value-label">'+label+'</div></div></div>';}
    return h+'</div></div>';
  }
  function srt(key,filter){var l=arr.slice().sort(function(a,b){return b[key]-a[key]});if(filter)l=l.filter(function(a){return a[key]>0});return l.map(function(a){return{name:a.name,pos:a.pos,val:key==='avg'?a[key].toFixed(1):a[key]}})}
  var html='';
  html+=cat('⚽ هدافين',srt('goals',true),'أهداف');
  html+=cat('🅰️ صناع',srt('assists',true),'أسيست');
  html+=cat('⭐ نجوم',srt('motm',true),'مرات');
  html+=cat('🏆 أفضل تقييم',srt('avg',true),'متوسط');
  html+=cat('👥 مشاركة',srt('matches',false),'ماتش');
  el.innerHTML=html||'<div class="empty-state">لسه مفيش ماتشات</div>';
}

function renderRules(){

  if(admin)html+='<div style="background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.3);border-radius:14px;padding:14px;margin-bottom:14px"><input id="r_title" placeholder="عنوان" style="width:100%;padding:12px;background:rgba(0,0,0,.4);border:1px solid rgba(59,130,246,.25);border-radius:10px;color:#fff;margin-bottom:8px"><textarea id="r_body" placeholder="التفاصيل" style="width:100%;padding:12px;background:rgba(0,0,0,.4);border:1px solid rgba(59,130,246,.25);border-radius:10px;color:#fff;min-height:70px;margin-bottom:8px"></textarea><button class="btn-purple" onclick="addRule()">إضافة</button></div>';
  if(!rules.length)html+='<div class="empty-state">مفيش قوانين</div>';
  else for(var i=0;i<rules.length;i++){var r=rules[i];
    html+='<div style="background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.25);border-radius:14px;padding:14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="font-weight:800;color:var(--blue-lt)">'+esc(r.title)+'</div>'+(admin?'<button onclick="delRule(\''+r.id+'\')" style="background:none;border:none;color:#e74c3c;cursor:pointer">🗑</button>':'')+'</div><div style="font-size:13px;line-height:1.7;color:#ccc">'+esc(r.body).replace(/\n/g,'<br>')+'</div></div>';}
  el.innerHTML=html;
}
function addRule(){var t=document.getElementById('r_title').value.trim();var b=document.getElementById('r_body').value.trim();if(!t)return alert('اكتب عنوان');var rs=getRules();rs.push({id:uid(),title:t,body:b,date:Date.now()});if(!setRules(rs))return;renderRules();}
function delRule(id){if(!confirm('حذف؟'))return;setRules(getRules().filter(function(r){return r.id!==id}));renderRules();}

// ============ ANNOUNCEMENTS ============
function renderAnns(){
  var el=document.getElementById('panel-5');
  var anns=getAnns().slice().sort(function(a,b){return b.date-a.date});
  var admin=isAdmin();
  var html='<div class="section-header">📢 الإعلانات</div>';
  if(admin)html+='<div style="background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.3);border-radius:14px;padding:14px;margin-bottom:14px"><input id="a_title" placeholder="عنوان" style="width:100%;padding:12px;background:rgba(0,0,0,.4);border:1px solid rgba(59,130,246,.25);border-radius:10px;color:#fff;margin-bottom:8px"><textarea id="a_body" placeholder="التفاصيل" style="width:100%;padding:12px;background:rgba(0,0,0,.4);border:1px solid rgba(59,130,246,.25);border-radius:10px;color:#fff;min-height:70px;margin-bottom:8px"></textarea><button class="btn-purple" onclick="addAnn()">نشر</button></div>';
  if(!anns.length)html+='<div class="empty-state">مفيش إعلانات</div>';
  else for(var i=0;i<anns.length;i++){var a=anns[i];
    html+='<div style="background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.25);border-radius:14px;padding:14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-weight:800;color:var(--blue-lt)">'+esc(a.title)+'</div>'+(admin?'<button onclick="delAnn(\''+a.id+'\')" style="background:none;border:none;color:#e74c3c;cursor:pointer">🗑</button>':'')+'</div><div style="font-size:11px;color:var(--dim);margin-bottom:6px">'+new Date(a.date).toLocaleString('ar-EG')+'</div><div style="font-size:13px;line-height:1.7;color:#ccc">'+esc(a.body).replace(/\n/g,'<br>')+'</div></div>';}
  el.innerHTML=html;
}
function addAnn(){var t=document.getElementById('a_title').value.trim();var b=document.getElementById('a_body').value.trim();if(!t)return alert('اكتب عنوان');var u=me();var arr=getAnns();arr.push({id:uid(),title:t,body:b,date:Date.now(),author:u?u.name:''});if(!setAnns(arr))return;renderAnns();}
function delAnn(id){if(!confirm('حذف؟'))return;setAnns(getAnns().filter(function(a){return a.id!==id}));renderAnns();}

// ============ ADMIN ============
function renderAdmin(){
  var el=document.getElementById('panel-6');
  var u=me();if(!u){el.innerHTML='';return}
  if(u.role!=='admin'&&u.role!=='coach'&&u.role!=='supervisor'){el.innerHTML='<div class="empty-state"><div class="empty-icon">🔒</div><div>الإدارة للأدمن/المدرب/المشرف</div></div>';return}
  var team=getTeam(),users=getUsers(),notifs=getNotifs().slice().sort(function(a,b){return b.date-a.date});
  var admin=u.role==='admin';
  var html='';
  html+='<div class="section-header">🛡️ شعار الفريق</div><div style="background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.25);border-radius:14px;padding:14px;margin-bottom:14px"><div style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#1a2a44,#050a15);border:2px solid var(--blue-mid);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden">'+(team.logo?'<img src="'+team.logo+'" style="width:100%;height:100%;object-fit:cover">':'⚽')+'</div><div style="flex:1"><input id="team_name" value="'+esc(team.name)+'" style="width:100%;padding:10px;background:rgba(0,0,0,.4);border:1px solid rgba(59,130,246,.25);border-radius:8px;color:#fff;margin-bottom:6px"><button class="btn-purple" onclick="saveTeamName()" style="padding:8px;font-size:12px">حفظ</button></div></div><button class="btn-purple" onclick="openPhotoUpload(\'\',\'logo\')" style="background:rgba(59,130,246,.15);color:var(--blue-lt);border:1px solid rgba(59,130,246,.35)">📤 رفع شعار</button></div>';
  html+='<div class="section-header">🔔 إشعارات</div><div style="background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.25);border-radius:14px;padding:14px;margin-bottom:14px"><input id="n_title" placeholder="عنوان" style="width:100%;padding:12px;background:rgba(0,0,0,.4);border:1px solid rgba(59,130,246,.25);border-radius:10px;color:#fff;margin-bottom:8px"><textarea id="n_body" placeholder="النص" style="width:100%;padding:12px;background:rgba(0,0,0,.4);border:1px solid rgba(59,130,246,.25);border-radius:10px;color:#fff;min-height:60px;margin-bottom:8px"></textarea><button class="btn-purple" onclick="addNotif()">إرسال</button>'+(notifs.length?'<div style="margin-top:10px">'+notifs.map(function(n){return '<div style="padding:8px;border-bottom:1px solid #222"><div style="font-weight:700;color:var(--blue-lt);font-size:13px">'+esc(n.title)+'</div><div style="font-size:11px;color:var(--dim)">'+new Date(n.date).toLocaleString('ar-EG')+'</div><div style="font-size:12px;color:#ccc;margin-top:4px">'+esc(n.body)+'</div></div>'}).join('')+'</div>':'')+'</div>';
  var pending=users.filter(function(x){return x.status==='pending'});
  html+='<div class="section-header">📨 طلبات <span class="count">'+pending.length+'</span></div>';
  if(pending.length){
    html+='<div style="background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.25);border-radius:14px;padding:14px;margin-bottom:14px">';
    for(var i=0;i<pending.length;i++){var pr=pending[i];
      html+='<div class="pending-request"><div class="pr-info"><div class="pr-name">'+esc(pr.name)+'</div><div class="pr-phone">📱 '+esc(pr.phone)+'</div><div class="pr-date">🎂 '+esc(pr.birthDate||'—')+'</div></div><div class="pr-actions"><button class="btn-approve" onclick="approveUser(\''+pr.id+'\')">✓</button><button class="btn-reject" onclick="rejectUser(\''+pr.id+'\')">✗</button></div></div>';}
    html+='</div>';
  }else html+='<div style="color:var(--dim);font-size:12px;margin-bottom:14px">مفيش طلبات</div>';
  html+='<div class="section-header">👑 الصلاحيات</div><div style="background:linear-gradient(135deg,var(--card),var(--card-2));border:1px solid rgba(59,130,246,.25);border-radius:14px;padding:14px;margin-bottom:14px">';
  for(var k=0;k<users.length;k++){var usr=users[k];
    html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #222"><div><div style="font-weight:700;font-size:13px">'+esc(usr.name)+'</div><div style="font-size:11px;color:var(--dim)"><span class="role-badge role-'+usr.role+'">'+roleLabel(usr.role)+'</span> '+esc(usr.phone)+'</div></div>';
    if(admin&&usr.id!==u.id){
      html+='<select onchange="changeRole(\''+usr.id+'\',this.value)" style="width:auto;padding:6px;font-size:12px;background:rgba(0,0,0,.5);border:1px solid rgba(59,130,246,.35);border-radius:6px;color:#fff"><option value="player" '+(usr.role==='player'?'selected':'')+'>لاعب</option><option value="coach" '+(usr.role==='coach'?'selected':'')+'>مدير فني</option><option value="supervisor" '+(usr.role==='supervisor'?'selected':'')+'>مشرف</option><option value="admin" '+(usr.role==='admin'?'selected':'')+'>أدمن</option></select>';}
    html+='</div>';}
  html+='</div>';
  el.innerHTML=html;
}
function roleLabel(r){return{admin:'أدمن',player:'لاعب',coach:'مدير فني',supervisor:'مشرف'}[r]||r}
function saveTeamName(){var t=getTeam();t.name=document.getElementById('team_name').value.trim()||'FC ARENA';if(!setTeam(t))return;renderAdmin();}
function addNotif(){var t=document.getElementById('n_title').value.trim();var b=document.getElementById('n_body').value.trim();if(!t)return alert('اكتب عنوان');var arr=getNotifs();arr.push({id:uid(),title:t,body:b,date:Date.now()});if(!setNotifs(arr))return;renderAdmin();}
function changeRole(userId,role){var us=getUsers();for(var i=0;i<us.length;i++)if(us[i].id===userId){us[i].role=role;break}if(!setUsers(us))return;renderAdmin();}

// ============ PENDING ============
function updateNotifBadge(){
  var u=me(),btn=document.getElementById('notifBtn'),badge=document.getElementById('notifBadge');
  if(!u||u.role!=='admin'){if(btn)btn.style.display='none';return}
  if(btn)btn.style.display='flex';
  var pending=getUsers().filter(function(x){return x.status==='pending'}).length;
  if(badge){if(pending>0){badge.textContent=pending;badge.style.display='flex'}else{badge.style.display='none'}}
}
function showPendingModal(){
  var pending=getUsers().filter(function(x){return x.status==='pending'});
  if(!pending.length){openModal('<h3>🔔 طلبات</h3><div class="empty-state"><div class="empty-icon">✨</div><div>مفيش طلبات</div></div>');return}
  var html='<h3>🔔 طلبات ('+pending.length+')</h3>';
  for(var i=0;i<pending.length;i++){var u=pending[i];
    html+='<div class="pending-request"><div class="pr-info"><div class="pr-name">'+esc(u.name)+'</div><div class="pr-phone">📱 '+esc(u.phone)+'</div><div class="pr-date">🎂 '+esc(u.birthDate||'—')+'</div></div><div class="pr-actions"><button class="btn-approve" onclick="approveUser(\''+u.id+'\')">✓</button><button class="btn-reject" onclick="rejectUser(\''+u.id+'\')">✗</button></div></div>';}
  openModal(html);
}
function approveUser(id){
  var us=getUsers(),u=null;
  for(var i=0;i<us.length;i++)if(us[i].id===id){u=us[i];break}
  if(!u)return;
  u.status='approved';u.role=u.role||'player';
  var ps=getPlayers(),pl=null;
  for(var j=0;j<ps.length;j++)if(ps[j].phone===u.phone){pl=ps[j];break}
  if(!pl){
    pl={id:uid(),name:u.name,position:'لاعب',phone:u.phone,birthDate:u.birthDate,photo:'',cardBackImage:'',stats:{goals:0,assists:0,matches:0,motm:0,rating:0,pace:70,shooting:70,passing:70,dribbling:70,defending:70,physical:70,skills:3,weakFoot:3,jerseyNumber:0}};
    ps.push(pl);setPlayers(ps);
  }
  u.playerId=pl.id;setUsers(us);
  closeModal();renderAll();
  alert('✓ تم قبول '+u.name);
}
function rejectUser(id){
  if(!confirm('رفض؟'))return;
  var us=getUsers();
  for(var i=0;i<us.length;i++)if(us[i].id===id){us[i].status='rejected';break}
  setUsers(us);closeModal();renderAll();
}

// ============ MODAL ============
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}

// ============ BOOT ============
(function boot(){
  var btns=document.querySelectorAll('.tab-btn');
  for(var i=0;i<btns.length;i++){
    (function(btn){btn.onclick=function(){goTab(parseInt(btn.dataset.tab,10))}})(btns[i]);
  }
  var u=me();
  if(u&&u.status==='approved')enterApp();
  else{if(u)setSession(null);showView('login')}
  setInterval(function(){var user=me();if(user&&user.role==='admin')updateNotifBadge()},15000);
  // Auto-rotate legendary carousel
  setInterval(function(){
    if(cardsTab==='legendary'&&!legendaryPaused&&currentTab===1){
      var ls=getLegendary();
      if(ls.length>1){
        legendaryIndex=(legendaryIndex+1)%ls.length;
        updateLegendaryPositions();
      }
    }
  },5500);
})();
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();closeProfile();closePreview()}});
</script>
</body>
</html>
